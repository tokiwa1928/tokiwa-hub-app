<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棚版ラベル作成 | Tokiwa Hub Tools</title>
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif; color:#1a1a1a; background:#f4f3f0; font-size:13px; }
  header{ background:#1a1a1a; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; }
  header h1{ font-size:15px; margin:0; letter-spacing:.08em; }
  header a{ color:#9ca3af; font-size:12px; text-decoration:none; }
  main{ max-width:1180px; margin:0 auto; padding:16px; display:grid; grid-template-columns:360px 1fr; gap:16px; align-items:start; }
  @media(max-width:980px){ main{ grid-template-columns:1fr; } }
  .panel{ background:#fff; border:1.5px solid #1a1a1a; border-radius:12px; padding:16px; }
  .panel h2{ font-size:13px; margin:0 0 10px; letter-spacing:.06em; }
  label{ display:block; font-size:12px; color:#334155; margin:9px 0 3px; font-weight:700; }
  input[type=text], input[type=number], select{ width:100%; padding:7px 9px; font-size:14px; border:1px solid #cbd5e1; border-radius:7px; font-family:inherit; background:#fff; }
  input:focus, select:focus{ outline:none; border-color:#0891b2; }
  .row{ display:flex; gap:10px; }
  .row > div{ flex:1; }
  .btn{ border:1px solid #cbd5e1; border-radius:8px; background:#fff; cursor:pointer; font-size:13px; padding:8px 14px; font-family:inherit; font-weight:700; }
  .btn:hover{ background:#f1f5f9; }
  .btn.primary{ background:#0891b2; border-color:#0891b2; color:#fff; }
  .hint{ font-size:11px; color:#64748b; margin-top:4px; line-height:1.5; }
  .eltbox{ border:1px solid #e2e8f0; border-radius:9px; padding:10px; margin-top:8px; background:#fafafa; }
  .eltbox .t{ font-size:12px; font-weight:800; color:#334155; margin-bottom:4px; }
  /* プレビュー */
  .pv{ background:#fff; border:1.5px solid #1a1a1a; border-radius:12px; padding:12px; }
  .pvrow{ display:flex; gap:14px; flex-wrap:wrap; }
  .pvcol{ }
  .pvcol .cap{ font-size:11px; color:#64748b; margin-bottom:4px; font-weight:700; }
  .sheetwrap{ overflow:hidden; border:1px solid #ddd; }
  /* ラベル面(A4) */
  .lbl{ position:relative; background:#fff; overflow:hidden; box-sizing:border-box; }
  .band{ position:absolute; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3mm; overflow:hidden; padding:6mm 2mm; }
  .el{ text-align:center; line-height:1.0; white-space:nowrap; }
  .el.vertical{ writing-mode:vertical-rl; text-orientation:upright; }
  .el.sideways{ /* 横倒し: 回転で実現(band側で回す) */ }
  #printArea{ display:none; }
  @media print{
    body > *{ display:none !important; }
    #printArea{ display:block !important; }
    html, body{ background:#fff !important; margin:0; padding:0; }
    @page{ size:A4 portrait; margin:0; }
    .lbl{ page-break-after:always; }
    .lbl:last-child{ page-break-after:auto; }
  }
  #toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:#fff; padding:9px 18px; border-radius:8px; font-size:13px; display:none; z-index:99; }
</style>
</head>
<body>
<header>
  <h1>🗄 棚版ラベル作成</h1>
  <a href="../index.html">← TOKIWA HUB</a>
  <span id="hub-user" style="margin-left:auto;font-size:11px;color:#9ca3af"></span>
</header>
<main>
  <div class="panel">
    <h2>用紙・帯</h2>
    <div class="row">
      <div><label>用紙の向き</label>
        <select id="orient" onchange="render()"><option value="land">A4 横</option><option value="port">A4 縦</option></select>
      </div>
      <div><label>両面</label>
        <select id="duplex" onchange="render()"><option value="on">両面(表裏同じ)</option><option value="off">片面のみ</option></select>
      </div>
    </div>
    <div class="row" style="margin-top:6px">
      <div><label>帯の位置</label>
        <select id="bandpos" onchange="render()"><option value="right">右</option><option value="left">左</option><option value="top">上</option><option value="bottom">下</option><option value="full">全面</option></select>
      </div>
      <div><label>帯の幅(%)</label><input type="number" id="bandw" min="10" max="100" value="33" oninput="render()"></div>
    </div>
    <div class="row" style="margin-top:6px">
      <div><label>帯の色</label>
        <select id="bandbg" onchange="render()"><option value="#000">黒</option><option value="#fff">白(枠)</option><option value="none">なし(白)</option></select>
      </div>
      <div><label>文字色</label>
        <select id="fg" onchange="render()"><option value="#fff">白</option><option value="#000">黒</option></select>
      </div>
    </div>

    <h2 style="margin-top:16px">見出し</h2>
    <input type="text" id="h-text" value="版No." oninput="render()">
    <div class="eltbox">
      <div class="row">
        <div><label>文字サイズ(pt)</label><input type="number" id="h-size" min="6" max="200" step="1" value="28" oninput="render()"></div>
        <div><label>向き</label>
          <select id="h-dir" onchange="render()"><option value="h">横書き</option><option value="v">縦書き</option><option value="s90">横倒し(90°)</option><option value="s270">横倒し(270°)</option></select>
        </div>
      </div>
    </div>

    <h2 style="margin-top:14px">メイン（番号など）</h2>
    <input type="text" id="m-text" value="776" oninput="render()">
    <div class="eltbox">
      <div class="row">
        <div><label>文字サイズ(pt)</label><input type="number" id="m-size" min="8" max="600" step="1" value="180" oninput="render()"></div>
        <div><label>向き</label>
          <select id="m-dir" onchange="render()"><option value="s270">横倒し(270°)</option><option value="s90">横倒し(90°)</option><option value="v">縦書き</option><option value="h">横書き</option></select>
        </div>
      </div>
      <div class="row" style="margin-top:6px">
        <div><label>太さ</label>
          <select id="m-weight" onchange="render()"><option value="800">極太</option><option value="700">太</option><option value="400">標準</option></select>
        </div>
        <div></div>
      </div>
    </div>

    <div class="eltbox" style="margin-top:8px;background:#f0fdf4;border-color:#86efac">
      <label style="font-weight:700;color:#166534">📋 まとめて複数作成（1行に1枚ぶんの番号）</label>
      <textarea id="m-list" rows="4" placeholder="例）&#10;776&#10;777&#10;A-102, 名刺／トキワ商事&#10;（空欄なら上のメイン1件だけ。行ごとに1枚。「番号, 補助」でその行だけ補助を差し替え）" oninput="render()" style="width:100%;font-size:13px;font-family:inherit;padding:7px 9px;border:1px solid #86efac;border-radius:6px;resize:vertical"></textarea>
      <div class="hint" id="count-hint" style="margin-top:4px;color:#166534"></div>
    </div>

    <h2 style="margin-top:14px">補助（任意）</h2>
    <input type="text" id="s-text" placeholder="例: 得意先名・品名" oninput="render()">
    <div class="eltbox">
      <div class="row">
        <div><label>文字サイズ(pt)</label><input type="number" id="s-size" min="6" max="120" step="1" value="16" oninput="render()"></div>
        <div><label>向き</label>
          <select id="s-dir" onchange="render()"><option value="h">横書き</option><option value="v">縦書き</option><option value="s90">横倒し(90°)</option><option value="s270">横倒し(270°)</option></select>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn" onclick="render()">🔄 更新</button>
      <button class="btn primary" onclick="doPrint()">🖨 印刷（一覧は全件まとめて）</button>
    </div>
    <div class="hint" style="margin-top:8px">A4全面に1枚。両面ONで表・裏の2ページを同じ向きで出力します。印字はプリンタの端(約5mm)が欠ける場合があるので、帯や文字は端に寄せすぎないでください。</div>
  </div>

  <div class="pv">
    <h2 style="margin:0 0 8px">プレビュー</h2>
    <div class="pvrow" id="pvrow"></div>
  </div>
</main>
<div id="printArea"></div>
<div id="toast"></div>
<script>
function esc(s){ s=(s==null?'':String(s)); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){t.style.display='none';},2500); }

function readCfg(){
  var g=function(id){ return document.getElementById(id).value; };
  return {
    orient:g('orient'), duplex:g('duplex'), bandpos:g('bandpos'), bandw:parseFloat(g('bandw'))||33,
    bandbg:g('bandbg'), fg:g('fg'),
    h:{text:g('h-text'), size:parseFloat(g('h-size'))||28, dir:g('h-dir')},
    m:{text:g('m-text'), size:parseFloat(g('m-size'))||180, dir:g('m-dir'), weight:g('m-weight')},
    s:{text:g('s-text'), size:parseFloat(g('s-size'))||16, dir:g('s-dir')},
    mList:g('m-list')
  };
}
// 複数作成: 各行 → 1枚ぶんの設定(メイン番号＋任意で補助を差し替え)を配列で返す
function buildItems(c){
  var lines=(c.mList||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
  if(!lines.length){ return [c]; }   // リストが空なら単票(上のメイン)
  return lines.map(function(ln){
    var parts=ln.split(/[,、|｜\t]/).map(function(s){return s.trim();});
    var cc=JSON.parse(JSON.stringify(c));
    cc.m.text=parts[0]||'';
    if(parts.length>1 && parts[1]) cc.s=Object.assign({}, c.s, {text:parts[1]});
    return cc;
  });
}
function pageSize(o){ return o==='port' ? {w:210,h:297} : {w:297,h:210}; }
// 要素1つのHTML(向き対応)
function elHtml(e, fg, extraWeight){
  if(!e.text) return '';
  var style='color:'+fg+';font-size:'+e.size+'pt;';
  if(extraWeight) style+='font-weight:'+extraWeight+';';
  if(e.dir==='v'){ style+='writing-mode:vertical-rl;text-orientation:upright;'; }         // 縦書き(数字も立つ)
  else if(e.dir==='s90'){ style+='writing-mode:vertical-rl;text-orientation:mixed;'; }     // 横倒し 上→下
  else if(e.dir==='s270'){ style+='writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);'; } // 横倒し 下→上(添付と同じ)
  return '<div class="el" style="'+style+'">'+esc(e.text)+'</div>';
}
function bandStyle(c, ps){
  var pos=c.bandpos, wpc=c.bandw/100;
  var bg = c.bandbg==='none' ? '#fff' : c.bandbg;
  var border = c.bandbg==='#fff' ? 'border:0.5mm solid #000;' : '';
  var st='background:'+bg+';'+border;
  if(pos==='full'){ st+='left:0;top:0;width:'+ps.w+'mm;height:'+ps.h+'mm;'; }
  else if(pos==='right'){ st+='right:0;top:0;height:'+ps.h+'mm;width:'+(ps.w*wpc)+'mm;'; }
  else if(pos==='left'){ st+='left:0;top:0;height:'+ps.h+'mm;width:'+(ps.w*wpc)+'mm;'; }
  else if(pos==='top'){ st+='left:0;top:0;width:'+ps.w+'mm;height:'+(ps.h*wpc)+'mm;'; }
  else if(pos==='bottom'){ st+='left:0;bottom:0;width:'+ps.w+'mm;height:'+(ps.h*wpc)+'mm;'; }
  return st;
}
function faceHtml(c, ps){
  var inner = elHtml(c.h, c.fg) + elHtml(c.m, c.fg, c.m.weight) + elHtml(c.s, c.fg);
  return '<div class="lbl" style="width:'+ps.w+'mm;height:'+ps.h+'mm">'
    + '<div class="band" style="'+bandStyle(c,ps)+'">'+inner+'</div></div>';
}
function render(){
  var c=readCfg(), ps=pageSize(c.orient);
  var items=buildItems(c);
  var sheets=c.duplex==='on'?2:1;
  // 件数表示
  var ch=document.getElementById('count-hint');
  if(ch) ch.textContent = items.length>1
    ? ('▶ '+items.length+'枚を一括作成（印刷は '+(items.length*sheets)+'ページ'+(c.duplex==='on'?'／2ページで1枚':'')+'）'
        + ' — 例: '+items.slice(0,5).map(function(x){return x.m.text;}).join('、')+(items.length>5?' …':''))
    : '';
  // プレビュー(縮小) — 先頭の1枚（両面ならその表裏）を表示
  var pv=items[0];
  var scale = Math.min(420/(ps.w*3.7795), 300/(ps.h*3.7795));
  var faces = c.duplex==='on' ? [['表',pv],['裏',pv]] : [['',pv]];
  document.getElementById('pvrow').innerHTML = (items.length>1?'<div style="width:100%;font-size:12px;color:#166534;margin-bottom:4px">プレビューは1枚目のみ表示（全'+items.length+'枚）</div>':'')
    + faces.map(function(f){
    return '<div class="pvcol">'+(f[0]?'<div class="cap">'+f[0]+'面</div>':'')
      + '<div class="sheetwrap" style="width:'+(ps.w*3.7795*scale)+'px;height:'+(ps.h*3.7795*scale)+'px">'
      + '<div style="transform:scale('+scale+');transform-origin:top left;width:'+(ps.w)+'mm;height:'+(ps.h)+'mm">'+faceHtml(f[1],ps)+'</div>'
      + '</div></div>';
  }).join('');
  // 印刷用@page
  var st=document.getElementById('page-style');
  if(!st){ st=document.createElement('style'); st.id='page-style'; document.head.appendChild(st); }
  st.textContent='@media print{ @page{ size:'+(c.orient==='port'?'A4 portrait':'A4 landscape')+'; margin:0; } }';
}
function doPrint(){
  var c=readCfg(), ps=pageSize(c.orient);
  var items=buildItems(c);
  // 各ラベルにつき、両面ONなら表裏の2ページ（同じ向き）
  var html='';
  items.forEach(function(cc){
    var pages = c.duplex==='on' ? [cc,cc] : [cc];
    html += pages.map(function(x){ return faceHtml(x,ps); }).join('');
  });
  document.getElementById('printArea').innerHTML = html;
  var day=(new Date().toISOString().slice(0,10).replace(/-/g,''));
  var title = items.length>1
    ? day+'_棚版ラベル_'+items.length+'件'
    : day+'_棚版ラベル_'+((items[0].m.text||items[0].h.text||'棚版').replace(/[\\/:*?"<>|]/g,''));
  var old=document.title; document.title=title;
  var restore=function(){ document.title=old; window.removeEventListener('afterprint',restore); };
  window.addEventListener('afterprint',restore); setTimeout(restore,60000);
  window.print();
}
render();
</script>
<!-- HUB共通: 最新データに更新するフローティングボタン（自動挿入） -->
<style>
#hubRefreshBtn{position:fixed;right:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:6px;
  padding:9px 14px;font-size:13px;font-weight:700;font-family:inherit;color:#0f172a;background:#fde68a;
  border:1px solid #f59e0b;border-radius:22px;box-shadow:0 3px 10px rgba(0,0,0,.22);cursor:pointer;line-height:1;}
#hubRefreshBtn:hover{background:#fcd34d;}
#hubRefreshBtn:disabled{opacity:.6;cursor:default;}
@media print{#hubRefreshBtn{display:none!important;}}
</style>
<button id="hubRefreshBtn" title="クラウドの最新データに更新します" onclick="hubRefreshNow()">🔄 更新</button>
<script>
function hubRefreshNow(){
  var b=document.getElementById('hubRefreshBtn');
  var reset=function(){ if(b){ b.disabled=false; b.textContent='🔄 更新'; } };
  if(b){ b.disabled=true; b.textContent='⏳ 更新中…'; }
  // 入力中のセルを先に確定(保存)してから取り込む。未確定の入力がクラウドの古い値で消えるのを防ぐ。
  try{ var ae=document.activeElement; if(ae && ae.blur && ['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0) ae.blur(); }catch(e){}
  try{
    // クラウド取込関数を持つツール（カレンダー受注台帳など）は、再読込せず最新だけ取り込む
    if(typeof hubCloudPull==='function'){
      Promise.resolve(hubCloudPull()).then(function(){
        try{ if(typeof _hubCacheClear==='function') _hubCacheClear(); }catch(e){}
        try{ if(typeof buildYears==='function') buildYears(); }catch(e){}
        try{ if(typeof buildCats==='function') buildCats(); }catch(e){}
        try{ if(typeof render==='function') render(); }catch(e){}
        try{ if(typeof hubToast==='function') hubToast('🔄 最新データに更新しました'); }catch(e){}
        reset();
      }).catch(function(){ location.reload(); });
      return;
    }
  }catch(e){}
  // それ以外のページはページごと再読込（本体アプリは再読込でクラウドから取り直す）
  location.reload();
}
</script>
<!-- HUB共通: アプリ自動更新＋更新履歴（自動挿入 hubUpdateKit） -->
<style>
#hubLogBtn{position:fixed;right:16px;bottom:58px;z-index:99999;width:38px;height:38px;border-radius:50%;
  border:1px solid #cbd5e1;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18);cursor:pointer;font-size:17px;line-height:1;}
#hubLogBtn:hover{background:#f1f5f9;}
#hubLogPanel{position:fixed;right:16px;bottom:104px;z-index:99999;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow:auto;
  background:#fff;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px;display:none;font-size:12px;color:#0f172a;text-align:left;}
#hubLogPanel h3{margin:0 0 8px;font-size:13px;}
#hubLogPanel .d{font-weight:700;margin:10px 0 3px;color:#0369a1;}
#hubLogPanel ul{margin:0 0 4px;padding-left:17px;}
#hubLogPanel li{margin:2px 0;line-height:1.45;}
#hubUpBanner{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:100000;display:none;align-items:center;gap:10px;
  background:#0f172a;color:#fff;padding:9px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13px;}
#hubUpBanner button{font-family:inherit;font-size:12px;font-weight:700;border-radius:7px;border:0;padding:5px 11px;cursor:pointer;background:#fde68a;color:#0f172a;}
@media print{#hubLogBtn,#hubLogPanel,#hubUpBanner{display:none!important;}}
</style>
<button id="hubLogBtn" title="更新履歴を表示" onclick="hubToggleLog()">📋</button>
<div id="hubLogPanel"></div>
<div id="hubUpBanner"><span>🆕 新しい版があります（<b id="hubUpCnt">15</b>秒後に自動更新）</span><button onclick="hubDoUpdate()">今すぐ更新</button><button style="background:#334155;color:#fff" onclick="hubCancelUpdate()">後で</button></div>
<script>
(function(){
  var BASE = location.pathname.indexOf('/tools/')>=0 ? '../' : './';
  // ===== 更新履歴 =====
  window.hubToggleLog=function(){
    var p=document.getElementById('hubLogPanel');
    if(p.style.display==='block'){ p.style.display='none'; return; }
    p.style.display='block'; p.innerHTML='<h3>📋 更新履歴</h3>読み込み中…';
    fetch(BASE+'changelog.json?ts='+Date.now(), {cache:'no-store'}).then(function(r){return r.json();}).then(function(list){
      var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');};
      p.innerHTML='<h3>📋 更新履歴</h3>'+list.map(function(e){
        return '<div class="d">'+esc(e.date)+'</div><ul>'+e.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';
      }).join('');
    }).catch(function(){ p.innerHTML='<h3>📋 更新履歴</h3>取得できませんでした'; });
  };
  // ===== アプリ本体の自動更新 =====
  // service-worker.js の版番号を定期取得し、変わっていたら再読込して新しい版に切り替える。
  var curVer=null, timer=null;
  function fetchVer(){
    return fetch(BASE+'service-worker.js?ts='+Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(t){ var m=t.match(/CACHE_VERSION\s*=\s*'([^']+)'/); return m?m[1]:null; })
      .catch(function(){ return null; });
  }
  window.hubDoUpdate=function(){ try{ sessionStorage.setItem('hubJustUpdated','1'); }catch(e){} location.reload(); };
  window.hubCancelUpdate=function(){ if(timer){ clearInterval(timer); timer=null; } var b=document.getElementById('hubUpBanner'); if(b) b.style.display='none'; };
  function showBanner(){
    var b=document.getElementById('hubUpBanner'); if(!b || b.style.display==='flex') return;
    b.style.display='flex';
    var n=15, c=document.getElementById('hubUpCnt'); c.textContent=n;
    timer=setInterval(function(){
      var ae=document.activeElement;
      if(ae && ['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0) return;   // 入力中はカウントを止める
      n--; c.textContent=n;
      if(n<=0){ clearInterval(timer); hubDoUpdate(); }
    }, 1000);
  }
  function check(){
    fetchVer().then(function(v){
      if(!v) return;
      if(curVer===null){ curVer=v; return; }
      if(v===curVer) return;
      // 新しい版を検知: 非表示タブは即時、表示中はバナー＋カウントダウンで自動更新
      if(document.hidden){ hubDoUpdate(); } else { showBanner(); }
    });
  }
  fetchVer().then(function(v){ curVer=v; });
  setInterval(check, 180000);   // 3分ごとに版を確認
  window.addEventListener('focus', check);
  try{ if(sessionStorage.getItem('hubJustUpdated')){ sessionStorage.removeItem('hubJustUpdated'); } }catch(e){}
})();
</script>
