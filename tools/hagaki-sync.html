<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>はがき案件の転記</title>
<!-- HAGAKI-1（11/12 本多さん「北上プリントの年賀状・喪中はがきの案件をファイルメーカーから自動で Drive に転記」） -->
<style>
  :root{ --ink:#1f2937; --sub:#64748b; --line:#e2e8f0; --acc:#0f766e; }
  body{ margin:0; background:#f8fafc; color:var(--ink); font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; font-size:14px; }
  .wrap{ max-width:760px; margin:0 auto; padding:20px 16px 40px; }
  h1{ font-size:20px; margin:0 0 6px; }
  .note{ color:var(--sub); font-size:12.5px; line-height:1.7; margin:0 0 14px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  button{ font:inherit; padding:7px 16px; border-radius:7px; border:1px solid #cbd5e1; background:#fff; cursor:pointer; }
  button.go{ background:var(--acc); color:#fff; border-color:var(--acc); font-weight:700; }
  button:disabled{ opacity:.5; cursor:default; }
  #st{ margin-top:8px; color:var(--sub); }
  .big{ font-size:16px; font-weight:800; }
</style>
</head>
<body>
<div class="wrap">
  <h1>はがき案件の転記（北上プリント 年賀状・喪中はがき）</h1>
  <p class="note">FileMaker の受注から、得意先が <b>有限会社北上プリント</b>（5463）の 年賀・喪中・寒中 の伝票と、その官製はがき（同じ番号の -A など）を探して、Drive の「北上プリント喪中はがき・年賀状案件管理表（北上→トキワ）」の「はがき案件一覧」へ書きます。<br>
  同じ伝票番号の行があれば 起票日〜納期 を最新に直し（項番と備考は触りません）、無ければ下に足します。今シーズン（9/1 以降の起票）が対象です。<b>毎晩 2 時</b>には自動で動きます。</p>
  <div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="go" id="now">今すぐ転記</button>
      <button id="on">毎時の自動転記を入れる</button>
      <button id="off">毎時の自動転記を止める</button>
      <a id="sheet" href="https://docs.google.com/spreadsheets/d/1EwZkSzyKOUELRULI7ukP66DOD5htwhi6JbczYLD3ZWs/edit" target="_blank" style="margin-left:auto">📄 管理表を開く</a>
      <span id="signin"></span>
    </div>
    <div id="st">状態を読んでいます…</div>
  </div>
</div>
<script src="fm-bridge.js"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  try { FM.サインインのボタンを置く($('signin')); } catch (e) {}
  function 呼(n, a) { return FM.呼ぶ(n, a); }
  function 時(iso) { if (!iso) return ''; var d = new Date(iso); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function 状態() {
    呼('北上はがき', ['']).then(function (r) {
      var l = r.最後;
      $('st').innerHTML = '毎時の自動転記: <b>' + (r.毎時 ? '入っています（1 時間ごと）' : '入っていません（毎晩 2 時だけ）') + '</b>'
        + (l ? '<br>最後の転記: ' + 時(l.時刻) + '　対象 ' + l.対象 + ' 件（足した ' + l.足した + '・直した ' + l.直した + '・同じ ' + l.同じ + '）' : '<br>まだ転記していません');
    }).catch(function (e) { $('st').textContent = String(e.message || e); });
  }
  function 押す(する, btn, 文) {
    btn.disabled = true; $('st').textContent = 文;
    呼('北上はがき', [する]).then(function (r) {
      if (する === '今すぐ') $('st').innerHTML = '<span class="big" style="color:#166534">✓ 転記しました</span>　対象 ' + r.対象 + ' 件（足した ' + r.足した + '・直した ' + r.直した + '・同じ ' + r.同じ + '）';
      setTimeout(状態, する === '今すぐ' ? 4000 : 0);
    }).catch(function (e) { $('st').textContent = '転記できませんでした: ' + String(e.message || e); }).then(function () { btn.disabled = false; });
  }
  $('now').onclick = function () { 押す('今すぐ', this, 'FileMaker を探して転記しています…（数十秒）'); };
  $('on').onclick = function () { 押す('毎時オン', this, '毎時の自動転記を入れています…'); };
  $('off').onclick = function () { 押す('毎時オフ', this, '毎時の自動転記を止めています…'); };
  window.addEventListener('fm-signin', 状態);
  setTimeout(状態, 600);
})();
</script>
</body>
</html>
