<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スキャン箱 | Tokiwa Hub Tools</title>
<!--
  SCANBOX-1（本多さん 10/15）: 複合機のスキャン（メールで届いた PDF）を、1 ページ目の絵で一度に並べて見る。
  会社 GAS の scanSync が メール → Drive「スキャン/<会社>/<年-月>/」へ保存し、scanList で一覧を返す。
  ここでは 見出し（決算書・登記簿 など）・メモ・確認済み・控え（一覧から外す）を付けるだけ。ファイルの中身はこの画面に持たない
  （絵は Drive のサムネイル＝Google にログインしている人だけ見える）
-->
<style>
  :root{ --ink:#1a1a1a; --line:#e0ddd6; --bg:#f4f3f0; --acc:#0e7490; --muted:#64748b; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:#1a1a1a; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header .logo{ font-weight:800; letter-spacing:.04em; font-size:14px; }
  header .logo b{ color:#a3e635; }
  header .tname{ font-size:16px; font-weight:800; }
  header .user{ margin-left:auto; font-size:11px; color:#cbd5e1; }
  #bar{ position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:8px 14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #bar label{ font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:4px; }
  #bar input,#bar select{ padding:6px 8px; border:1px solid #d0cec8; font-size:13px; font-family:inherit; background:#fff; }
  .btn{ padding:6px 12px; border:1px solid #d0cec8; background:#fff; cursor:pointer; font-size:13px; font-family:inherit; font-weight:600; }
  .btn:hover{ border-color:#1a1a1a; }
  .btn-p{ background:var(--acc); border-color:var(--acc); color:#fff; }
  .btn:focus-visible,.tile:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; }
  #st{ font-size:12px; color:var(--muted); }
  main{ padding:12px 14px 40px; }
  .day{ font-size:13px; font-weight:800; margin:14px 0 6px; color:#334155; display:flex; gap:8px; align-items:baseline; }
  .day span{ font-weight:400; color:var(--muted); font-size:12px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .tile{ background:#fff; border:1px solid var(--line); display:flex; flex-direction:column; cursor:pointer; position:relative; }
  .tile.checked{ border-color:#16a34a; box-shadow:inset 0 0 0 1px #16a34a; }
  .tile.hidden{ opacity:.45; }
  .thumb{ height:240px; background:#f8fafc; display:flex; align-items:center; justify-content:center; overflow:hidden; border-bottom:1px solid var(--line); }
  .thumb img{ max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .meta{ padding:6px 8px; display:flex; flex-direction:column; gap:4px; font-size:12px; }
  .meta .t{ font-weight:800; font-size:13px; min-height:18px; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta .t.empty{ color:#94a3b8; font-weight:400; }
  .meta .s{ color:var(--muted); font-size:11px; display:flex; justify-content:space-between; gap:6px; }
  .badge{ position:absolute; top:6px; left:6px; background:#16a34a; color:#fff; font-size:11px; font-weight:700; padding:1px 6px; }
  .badge.h{ background:#64748b; }
  .empty-msg{ padding:40px 10px; text-align:center; color:var(--muted); font-size:14px; }
  /* 大きく見る */
  #view{ position:fixed; inset:0; background:rgba(15,23,42,.86); z-index:50; display:none; }
  #view.on{ display:flex; }
  #view .doc{ flex:1 1 auto; display:flex; min-width:0; }
  #view iframe{ flex:1 1 auto; border:0; background:#fff; }
  #view aside{ width:300px; flex:0 0 300px; background:#fff; padding:12px; display:flex; flex-direction:column; gap:10px; overflow:auto; }
  #view aside h3{ margin:0; font-size:14px; }
  #view aside .when{ font-size:12px; color:var(--muted); }
  #view aside input,#view aside textarea{ width:100%; padding:7px 8px; border:1px solid #d0cec8; font-size:14px; font-family:inherit; }
  .chips{ display:flex; flex-wrap:wrap; gap:4px; }
  .chip{ padding:4px 8px; border:1px solid #cbd5e1; background:#f8fafc; font-size:12px; cursor:pointer; font-family:inherit; }
  .chip:hover{ border-color:var(--acc); color:var(--acc); }
  .nav{ display:flex; gap:6px; }
  .nav .btn{ flex:1; }
  .hint{ font-size:11px; color:var(--muted); line-height:1.6; }
  #toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:#fff; padding:9px 18px; font-size:13px; display:none; z-index:99; }
  @media (max-width:760px){
    .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .thumb{ height:200px; }
    #view{ flex-direction:column; }
    #view aside{ width:auto; flex:0 0 auto; max-height:46vh; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
<link rel="stylesheet" href="hub-square.css"><link rel="stylesheet" href="hub-theme.css">
<script src="hub-nav.js"></script>
</head>
<body>
<header>
  <span class="logo">TOKIWA <b>HUB</b> 🧰</span>
  <span class="tname">🖨 スキャン箱</span>
  <span class="user" id="hub-user"></span>
</header>
<div id="bar">
  <label>会社 <select id="f-co"><option value="">すべて</option></select></label>
  <label>期間 <input type="date" id="f-from"> 〜 <input type="date" id="f-to"></label>
  <label>探す <input id="f-q" placeholder="見出し・メモ・ファイル名" style="width:170px"></label>
  <label><input type="checkbox" id="f-todo"> 未確認だけ</label>
  <label><input type="checkbox" id="f-hidden"> 控えも出す</label>
  <button class="btn" id="b-reload" type="button">読み直す</button>
  <button class="btn btn-p" id="b-sync" type="button" title="複合機から届いた新しいスキャンを Drive に取り込みます（毎時も自動で取り込みます）">最新を取り込む</button>
  <span id="st"></span>
</div>
<main id="out"><div class="empty-msg">読んでいます…</div></main>

<div id="view" role="dialog" aria-modal="true" aria-label="スキャンを大きく見る">
  <div class="doc"><iframe id="v-frame" title="スキャンの中身" allow="autoplay"></iframe></div>
  <aside>
    <div class="nav"><button class="btn" id="v-prev" type="button">← 前</button><button class="btn" id="v-next" type="button">次 →</button><button class="btn" id="v-close" type="button">閉じる</button></div>
    <h3 id="v-name"></h3>
    <div class="when" id="v-when"></div>
    <div>
      <div class="hint">見出し（押すと入ります）</div>
      <div class="chips" id="v-chips"></div>
    </div>
    <input id="v-title" placeholder="見出し（例: 決算書 第43期）">
    <textarea id="v-note" rows="3" placeholder="メモ（例: 税理士へ提出済み）"></textarea>
    <div class="nav">
      <button class="btn btn-p" id="v-check" type="button">✓ 確認済みにして次へ</button>
    </div>
    <div class="nav">
      <button class="btn" id="v-hide" type="button" title="一覧から外します（消しません）。「控えも出す」で見られます">控えにする</button>
      <a class="btn" id="v-open" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;color:inherit">Drive で開く</a>
    </div>
    <div class="hint">← → で前後のスキャン、Esc で閉じる。見出し・メモは欄を離れたときに保存します。</div>
  </aside>
</div>
<div id="toast"></div>

<script>
var HUB_GAS_URL = 'https://script.google.com/a/macros/tokiwap-group.com/s/AKfycbw9-8Nnq3jV9lCDUEf7JOvQM_yAy1ZYnOIab-TYP3TZ-BtH7RosxKSeXmr-FvkxMVhv/exec';
var HUB_API_KEY = 'mitsumori-2024';
var TITLES = ['決算書', '履歴事項全部証明書', '印鑑証明', '契約書', '見積書', '注文書', '請求書', '納品書', '校正', '原稿', '見本', '名刺', 'その他'];
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2200); }
function auth() { try { return JSON.parse(localStorage.getItem('murayama_auth')) || {}; } catch (e) { return {}; } }
function who() { var a = auth(); return (a.user && (a.user.email || a.user.name)) || a.email || a.name || ''; }
function api(action, params) {
  var u = new URL(HUB_GAS_URL); u.searchParams.set('action', action); u.searchParams.set('apiKey', HUB_API_KEY);
  Object.keys(params || {}).forEach(function (k) { u.searchParams.set(k, typeof params[k] === 'object' ? JSON.stringify(params[k]) : params[k]); });
  return fetch(u.toString(), { redirect: 'follow' }).then(function (r) { return r.json(); }).then(function (j) { if (!j || j.success === false) throw new Error((j && j.error) || '応答がありません'); return j; });
}
var ITEMS = [], SHOWN = [], CUR = -1;
var PREF_KEY = 'scanbox_filters';
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify({ co: $('f-co').value, todo: $('f-todo').checked, hidden: $('f-hidden').checked })); } catch (e) {} }
function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; } }
function jst(iso) { var d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function dayKey(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }); }
function kb(n) { n = +n || 0; return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

function load() {
  $('st').textContent = '読んでいます…';
  return api('scanList', { hidden: '1' }).then(function (j) {
    ITEMS = j.items || [];
    var sel = $('f-co'), keep = sel.value || loadPrefs().co || '';
    sel.innerHTML = '<option value="">すべて</option>' + (j.companies || []).map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
    sel.value = keep;
    $('st').textContent = '全 ' + ITEMS.length + ' 件' + (j.updatedAt ? '（取り込み ' + jst(j.updatedAt) + '）' : '');
    draw();
  }).catch(function (e) { $('st').textContent = ''; $('out').innerHTML = '<div class="empty-msg">読めませんでした: ' + esc(e.message || e) + '</div>'; });
}
function filtered() {
  var co = $('f-co').value, from = $('f-from').value, to = $('f-to').value, q = $('f-q').value.trim().toLowerCase(), todo = $('f-todo').checked, hid = $('f-hidden').checked;
  return ITEMS.filter(function (it) {
    if (!hid && it.hide) return false;
    if (todo && it.checked) return false;
    if (co && it.company !== co) return false;
    var day = new Date(it.at).toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
    if (from && day < from) return false;
    if (to && day > to) return false;
    if (q && (String(it.title || '') + ' ' + String(it.note || '') + ' ' + String(it.name || '') + ' ' + String(it.company || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function draw() {
  SHOWN = filtered();
  if (!SHOWN.length) { $('out').innerHTML = '<div class="empty-msg">' + (ITEMS.length ? '条件に合うスキャンはありません' : 'まだ取り込んだスキャンはありません。「最新を取り込む」を押してください') + '</div>'; return; }
  var h = '', last = '';
  SHOWN.forEach(function (it, i) {
    var dk = dayKey(it.at);
    if (dk !== last) { if (last) h += '</div>'; var n = SHOWN.filter(function (x) { return dayKey(x.at) === dk; }).length; h += '<div class="day">' + esc(dk) + ' <span>' + n + ' 件</span></div><div class="grid">'; last = dk; }
    var t = new Date(it.at).toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit' });
    h += '<div class="tile' + (it.checked ? ' checked' : '') + (it.hide ? ' hidden' : '') + '" tabindex="0" data-i="' + i + '">'
      + (it.checked ? '<span class="badge">✓ 確認済み</span>' : '') + (it.hide ? '<span class="badge h" style="left:auto;right:6px">控え</span>' : '')
      + '<div class="thumb"><img loading="lazy" alt="' + esc(it.title || it.name) + '" src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(it.fileId) + '&sz=w400"></div>'
      + '<div class="meta"><div class="t' + (it.title ? '' : ' empty') + '">' + esc(it.title || '（見出しなし）') + '</div>'
      + '<div class="s"><span>' + esc(t) + '　' + esc(it.company || '') + '</span><span>' + kb(it.size) + '</span></div>'
      + (it.note ? '<div class="s" style="color:#334155">' + esc(it.note) + '</div>' : '') + '</div></div>';
  });
  h += '</div>';
  $('out').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (el) {
    el.onclick = function () { openView(+el.getAttribute('data-i')); };
    el.onkeydown = function (e) { if (e.key === 'Enter') openView(+el.getAttribute('data-i')); };
  });
}
function openView(i) {
  if (i < 0 || i >= SHOWN.length) return;
  CUR = i; var it = SHOWN[i];
  $('v-frame').src = 'https://drive.google.com/file/d/' + encodeURIComponent(it.fileId) + '/preview';
  $('v-name').textContent = it.title || '（見出しなし）';
  $('v-when').textContent = jst(it.at) + '　' + (it.source || it.company || '') + '　' + kb(it.size) + (it.checked ? '　✓ 確認済み' : '') + (it.hide ? '　控え' : '');
  $('v-title').value = it.title || ''; $('v-note').value = it.note || '';
  $('v-open').href = 'https://drive.google.com/file/d/' + encodeURIComponent(it.fileId) + '/view';
  $('v-hide').textContent = it.hide ? '控えから戻す' : '控えにする';
  $('v-check').textContent = it.checked ? '✓ 確認済み（次へ）' : '✓ 確認済みにして次へ';
  $('v-prev').disabled = i <= 0; $('v-next').disabled = i >= SHOWN.length - 1;
  $('view').classList.add('on');
}
function closeView() { $('view').classList.remove('on'); $('v-frame').src = 'about:blank'; CUR = -1; draw(); }
function update(it, patch) {
  Object.keys(patch).forEach(function (k) { it[k] = patch[k]; });
  return api('scanUpdate', { id: it.id, patch: patch, by: who() }).then(function () { toast('保存しました'); }).catch(function (e) { toast('保存できませんでした: ' + (e.message || e)); });
}
function saveFields() {
  if (CUR < 0) return; var it = SHOWN[CUR]; var p = {};
  var t = $('v-title').value.trim(), n = $('v-note').value.trim();
  if (t !== (it.title || '')) p.title = t;
  if (n !== (it.note || '')) p.note = n;
  if (Object.keys(p).length) { update(it, p); $('v-name').textContent = t || '（見出しなし）'; }
}
$('v-chips').innerHTML = TITLES.map(function (t) { return '<button type="button" class="chip">' + esc(t) + '</button>'; }).join('');
Array.prototype.forEach.call(document.querySelectorAll('#v-chips .chip'), function (b) { b.onclick = function () { $('v-title').value = b.textContent; saveFields(); }; });
$('v-title').addEventListener('change', saveFields); $('v-note').addEventListener('change', saveFields);
$('v-prev').onclick = function () { saveFields(); openView(CUR - 1); };
$('v-next').onclick = function () { saveFields(); openView(CUR + 1); };
$('v-close').onclick = function () { saveFields(); closeView(); };
$('v-check').onclick = function () { saveFields(); var it = SHOWN[CUR]; if (!it.checked) update(it, { checked: true }); if (CUR < SHOWN.length - 1) openView(CUR + 1); else closeView(); };
$('v-hide').onclick = function () { saveFields(); var it = SHOWN[CUR]; update(it, { hide: !it.hide }); if (!it.hide) { openView(CUR); return; } if (CUR < SHOWN.length - 1) openView(CUR + 1); else closeView(); };
document.addEventListener('keydown', function (e) {
  if (!$('view').classList.contains('on')) return;
  if (/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (e.key === 'ArrowRight') $('v-next').click(); else if (e.key === 'ArrowLeft') $('v-prev').click(); else if (e.key === 'Escape') $('v-close').click();
});
['f-co', 'f-from', 'f-to', 'f-todo', 'f-hidden'].forEach(function (id) { $(id).addEventListener('change', function () { savePrefs(); draw(); }); });
$('f-q').addEventListener('input', draw);
$('b-reload').onclick = load;
$('b-sync').onclick = function () {
  var b = $('b-sync'); b.disabled = true; $('st').textContent = '複合機のメールから取り込んでいます（多いと数分）…';
  api('scanSync', { max: 60 }).then(function (j) { toast(j.added ? j.added + ' 件を取り込みました' + (j.more ? '（まだあります。もう一度押してください）' : '') : '新しいスキャンはありません'); return load(); })
    .catch(function (e) { $('st').textContent = '取り込めませんでした: ' + (e.message || e); }).then(function () { b.disabled = false; });
};
(function init() {
  var a = auth();
  $('hub-user').textContent = a && a.loggedIn ? (who() || 'ログイン中') : '';
  if (!a || !a.loggedIn) { $('out').innerHTML = '<div class="empty-msg">Tokiwa Hub にログインしてから開いてください</div>'; $('bar').style.display = 'none'; return; }
  var p = loadPrefs(); $('f-todo').checked = !!p.todo; $('f-hidden').checked = !!p.hidden;
  load();
})();
</script>
</body>
</html>
