<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>書庫（社内文書） | Tokiwa Hub</title>
<!--
  📚 書庫（社内文書）

  規程・マニュアル・様式・契約などの「どこに何があるか」を1か所にまとめる台帳。

  ここに置くもの / 置かないもの
    台帳（文書名・版・制定日・所管・保管場所）  → Hub の共有データ。全社で見える
    ファイルの実体                            → このPCのブラウザの中だけ（下記）

  ※ Hub は公開のページ（GitHub Pages）です。社内文書のファイルそのものを
    リポジトリに置くと誰でも読めてしまうので、絶対に置きません。
    全社で共有したいファイルは Google Drive 等に置き、そのリンクを台帳に登録します。
-->
<style>
  :root{ --lime:#84cc16; --ink:#1a1a1a; --line:#e0ddd6; --bg:#f4f3f0; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:#1a1a1a; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; }
  header .logo{ font-weight:800; letter-spacing:.04em; font-size:14px; }
  header .logo b{ color:#a3e635; }
  header .tname{ font-size:16px; font-weight:800; }
  header .user{ margin-left:auto; font-size:11px; color:#cbd5e1; }
  main{ max-width:760px; margin:18px auto; padding:0 14px; }
  .sec{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:.9rem 1.1rem; margin-bottom:.7rem; }
  .st{ font-size:10px; font-weight:700; color:#999; letter-spacing:.1em; margin-bottom:.5rem; text-transform:uppercase; }
  label{ font-size:11px; color:#888; display:block; margin-bottom:2px; }
  input,select,textarea{ width:100%; padding:7px 9px; border:1px solid #d0cec8; border-radius:6px; font-size:14px; font-family:inherit; background:#fff; }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:#1a1a1a; }
  .btn{ padding:9px 16px; border:1px solid #d0cec8; border-radius:7px; background:#fff; cursor:pointer; font-size:14px; font-family:inherit; font-weight:600; }
  .btn-p{ background:#0891b2; border-color:#0891b2; color:#fff; }
  .btn:active{ transform:translateY(1px); }
  .muted{ font-size:11px; color:#94a3b8; }
  #toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:#fff; padding:9px 18px; border-radius:8px; font-size:13px; display:none; z-index:99; }
  main{ max-width:1120px; }
  .warn{ background:#fffbeb; border:1px solid #fcd34d; color:#78350f; border-radius:8px;
         padding:.6rem .9rem; font-size:12px; line-height:1.75; margin-bottom:.7rem; }
  .bar{ display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .bar .f{ min-width:0; }
  .bar input,.bar select{ font-size:13px; padding:6px 8px; }
  table.list{ border-collapse:collapse; width:100%; font-size:12.5px; }
  table.list th{ background:#f4f3f0; text-align:left; padding:6px 8px; border-bottom:1px solid var(--line);
        white-space:nowrap; font-size:11px; color:#666; font-weight:700; }
  table.list td{ padding:6px 8px; border-bottom:1px solid #f0eeea; vertical-align:top; }
  table.list tr.r:hover td{ background:#fdfdf5; cursor:pointer; }
  table.list td.c{ text-align:center; white-space:nowrap; }
  .tag{ font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:10px; background:#e2e8f0; color:#334155; }
  .tag.有効{ background:#dcfce7; color:#15803d; }
  .tag.改定中{ background:#fef3c7; color:#92400e; }
  .tag.廃止{ background:#f1f5f9; color:#94a3b8; text-decoration:line-through; }
  .cat{ font-size:10.5px; color:#64748b; }
  .fname{ font-weight:700; font-size:13.5px; }
  .sub{ font-size:11px; color:#94a3b8; }
  .chip{ display:inline-block; font-size:11px; background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3;
         border-radius:6px; padding:1px 7px; margin:1px 3px 1px 0; text-decoration:none; }
  .chip:hover{ background:#e0e7ff; }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .g3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  #edit{ display:none; }
  .drop{ border:2px dashed #cbd5e1; border-radius:8px; padding:14px; text-align:center; color:#94a3b8;
         font-size:12px; background:#fafaf9; }
  .drop.on{ border-color:#0891b2; background:#ecfeff; color:#0e7490; }
  .files{ margin-top:6px; }
  .files div{ display:flex; gap:8px; align-items:center; font-size:12px; padding:3px 0; }
  .files a{ color:#0369a1; }
  .x{ border:1px solid #fca5a5; background:#fff; color:#b91c1c; border-radius:5px;
      font-size:11px; padding:1px 8px; cursor:pointer; font-family:inherit; }
  @media print{ .noprint{ display:none !important; } }
</style>
</head>
<body>
<header>
  <span class="logo">TOKIWA <b>HUB</b> 📚</span>
  <span class="tname">書庫</span>
  <span style="font-size:11px;color:#94a3b8">社内文書の台帳</span>
  <a href="../index.html" style="color:#cbd5e1;font-size:12px;text-decoration:none">← Hub</a>
  <span class="user" id="hub-user"></span>
</header>
<main>

  <div class="warn noprint">
    <b>ファイルの置き場所について。</b>
    台帳（どんな文書があるか）は Hub の共有データに入り、全社で見えます。
    <b>ファイルそのものは、このパソコンのブラウザの中だけに保存</b>されます（他の人には渡りません）。
    全社で見せたいファイルは Google ドライブなどに置き、その<b>リンクを「保管場所」に登録</b>してください。
    Hub は公開のページなので、社内文書をそのまま載せることはできません。
  </div>

  <div class="sec noprint">
    <div class="bar">
      <div class="f" style="flex:2;min-width:180px">
        <label>探す（文書名・所管・メモ）</label>
        <input id="q" placeholder="例: 個人情報" oninput="render()">
      </div>
      <div class="f" style="min-width:130px">
        <label>分類</label>
        <select id="fcat" onchange="render()"><option value="">すべて</option></select>
      </div>
      <div class="f" style="min-width:110px">
        <label>状態</label>
        <select id="fst" onchange="render()">
          <option value="">有効・改定中</option>
          <option>有効</option><option>改定中</option><option>廃止</option>
          <option value="__all">すべて</option>
        </select>
      </div>
      <button class="btn btn-p" onclick="openEdit(null)">＋ 文書を登録</button>
      <button class="btn" onclick="window.print()">🖨 印刷</button>
      <button class="btn" onclick="exportJson()" title="台帳を書き出す">⬇ 書き出し</button>
    </div>
  </div>

  <div class="sec" id="edit">
    <div class="st" id="edit-title">文書の登録</div>
    <div class="g3">
      <div><label>分類 *</label>
        <select id="e-cat"></select></div>
      <div style="grid-column:span 2"><label>文書名 *</label>
        <input id="e-name" placeholder="例: 個人情報保護規程"></div>
    </div>
    <div class="g3" style="margin-top:6px">
      <div><label>版</label><input id="e-ver" placeholder="例: 第2版"></div>
      <div><label>制定日</label><input id="e-from" type="date"></div>
      <div><label>最終改定日</label><input id="e-rev" type="date"></div>
    </div>
    <div class="g3" style="margin-top:6px">
      <div><label>所管</label><input id="e-own" placeholder="例: 総務"></div>
      <div><label>状態</label>
        <select id="e-st"><option>有効</option><option>改定中</option><option>廃止</option></select></div>
      <div><label>次回見直し</label><input id="e-next" type="date"></div>
    </div>
    <div style="margin-top:6px">
      <label>保管場所（Google ドライブ等のリンク・紙の場所）</label>
      <input id="e-url" placeholder="https://drive.google.com/... ／ 例: 総務キャビネット3段目">
    </div>
    <div style="margin-top:6px">
      <label>メモ</label>
      <textarea id="e-memo" rows="2"></textarea>
    </div>
    <div style="margin-top:8px">
      <label>ファイル（このパソコンの中だけに保存されます）</label>
      <div class="drop" id="drop">ここにファイルをドロップ、または
        <button class="btn" style="padding:4px 12px;font-size:12px" onclick="document.getElementById('pick').click()">選ぶ</button>
        <input type="file" id="pick" multiple style="display:none" onchange="addFiles(this.files)">
      </div>
      <div class="files" id="e-files"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-p" onclick="saveDoc()">保存</button>
      <button class="btn" onclick="closeEdit()">やめる</button>
      <button class="btn" style="margin-left:auto;color:#b91c1c;border-color:#fca5a5" id="e-del" onclick="delDoc()">削除</button>
    </div>
  </div>

  <div class="sec">
    <div class="st" id="cnt">書庫</div>
    <div style="overflow-x:auto">
      <table class="list">
        <thead><tr>
          <th>文書名</th><th>版</th><th>制定</th><th>最終改定</th>
          <th>所管</th><th>状態</th><th>保管場所</th><th class="c">ファイル</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

</main>

<script>
// ═════════ Tokiwa Hub 共有ヘルパー (全ツール共通・ここから下は原則編集しない) ═════════
var HUB_DBKEY = 'murayama_v15';
var HUB_AUTHKEY = 'murayama_auth';
var HUB_TOOL_ID = 'shoko';
var HUB_OWN_COLLS = ['documents'];   // このツールが持ち主のコレクション
// 本体(index.html)の CLOUD_CONFIG と同じ値。ツール単独でも全社クラウド(GAS)へ直接保存するために使う。
var HUB_GAS_URL = 'https://script.google.com/a/macros/tokiwap-group.com/s/AKfycbw9-8Nnq3jV9lCDUEf7JOvQM_yAy1ZYnOIab-TYP3TZ-BtH7RosxKSeXmr-FvkxMVhv/exec';
var HUB_API_KEY = 'mitsumori-2024';

function hubLoad(){
  try { return JSON.parse(localStorage.getItem(HUB_DBKEY)) || null; }
  catch(e){ console.error(e); return null; }
}
function hubAuth(){
  try { return JSON.parse(localStorage.getItem(HUB_AUTHKEY)) || {}; } catch(e){ return {}; }
}
// 保存: 必ず「読み直し→変更→書き込み」の形で使う (mutator に最新DBを渡す)
// localStorage容量対策: 問い合わせ本文(body)等はクラウド(Communications)が正なので、
// 端末ミラーには一覧最小限だけ残す。容量超過時に本文を落として保存を通す。
function _hubInqLite_(db){
  if(!db || !Array.isArray(db.inquiries) || !db.inquiries.length) return db;
  var KEEP=['id','subject','kind','status','priority','source_type','channel_company','from_name','from_email','from_company','custName','received_at','createdAt','updatedAt','assignee','category','isSpam','tags','linked_project_id','linked_quote_id','linked_invoice_id','cust_id','tel'];
  var lite=db.inquiries.map(function(r){ if(!r||typeof r!=='object') return r; var o={}; KEEP.forEach(function(k){ if(k in r) o[k]=r[k]; }); o._lite=true; return o; });
  return Object.assign({}, db, {inquiries:lite});
}
function hubSave(mutator){
  var db = hubLoad();
  if(!db){ hubToast('❌ 本体データが見つかりません。先に本体アプリへログインしてください'); return false; }
  try { mutator(db); } catch(e){ hubToast('❌ 変更失敗: ' + e); return false; }
  var _lok=false;
  try { localStorage.setItem(HUB_DBKEY, JSON.stringify(db)); _lok=true; }
  catch(e){
    try { localStorage.setItem(HUB_DBKEY, JSON.stringify(_hubInqLite_(db))); _lok=true; }
    catch(e2){ try { var _b=_hubInqLite_(db); _b.inquiries=[]; _b.history=[]; localStorage.setItem(HUB_DBKEY, JSON.stringify(_b)); _lok=true; } catch(e3){} }
    hubToast(_lok ? '💾 端末保存は軽量化しました（データはクラウドに保存）' : '⚠ 端末保存失敗・クラウドには保存します');
  }
  try { new BroadcastChannel('tokiwa-hub-tools').postMessage({ type:'db-updated', tool: HUB_TOOL_ID }); } catch(e){}
  hubCloudPushSoon();   // ローカル保存の成否に関わらず全社クラウドへ反映（消失防止）
  return true;
}
// ツール単独で全社クラウド(GAS saveAll)へ即保存。本体経由・BroadcastChannel依存をやめ、強制リロードで消えるのを防ぐ。
// 注: 本体 saveToCloud と同じく localStorage の全DBを送る（=本体と同一の保存モデル）。
// 更新時刻ベースの安全な保存: 先にクラウド最新を取得し、このツールが扱うコレクションだけ
// 「レコードごとに新しい方」をマージして送る。他コレクションはクラウド最新をそのまま返す。
// これにより、この端末が古いデータを持っていても他機能・他端末の新しい変更を上書きしない。
function _tsval(r){ if(!r) return 0; var t=r._updatedAt||r.updatedAt||r.paidAt||r.matchedAt||r.createdAt||r._createdAt; var n=t?Date.parse(t):0; return isNaN(n)?0:n; }
// 論理時計: PCの時計が他PCよりずれていても、直近の編集が必ず「より新しい」と判定される時刻を刻む。
// 既存レコードを更新するときは必ず hubStamp(rec) を使うこと(new Date()直書き禁止)。
function hubStamp(rec){ var t=new Date(Math.max(Date.now(), _tsval(rec)+1000)).toISOString(); if(rec) rec._updatedAt=t; return t; }
function mergeNewestById(localArr, cloudArr){
  var byId={}, order=[];
  function take(r, isLocal){ if(!r||!r.id) return;
    if(!(r.id in byId)){ order.push(r.id); byId[r.id]=r; return; }
    var a=_tsval(r), b=_tsval(byId[r.id]);
    if(a>b || (a===b && isLocal)) byId[r.id]=r;   // 同時刻/両方無しはローカル(=このツールの編集)を優先
  }
  (Array.isArray(cloudArr)?cloudArr:[]).forEach(function(r){ take(r,false); });
  (Array.isArray(localArr)?localArr:[]).forEach(function(r){ take(r,true); });
  return order.map(function(id){ return byId[id]; });
}
// このツールが編集の主体となるコレクション(ここだけローカルの新しい変更を反映する)
function ownColls(){ return (typeof HUB_OWN_COLLS!=='undefined'&&HUB_OWN_COLLS) ? HUB_OWN_COLLS : ((typeof COLL!=='undefined'&&COLL) ? [COLL] : []); }
async function hubCloudFetch(){
  var auth=hubAuth(); if(!auth || !auth.loggedIn || !auth.companyId) return null;
  var url=new URL(HUB_GAS_URL);
  url.searchParams.set('action','syncAll'); url.searchParams.set('apiKey', HUB_API_KEY); url.searchParams.set('companyId', auth.companyId);
  var res=await fetch(url.toString(), { method:'GET', redirect:'follow' });
  var r=await res.json();
  var d=r && (r.data||r);
  return (d && typeof d==='object') ? d : null;
}
async function hubCloudPush(){
  var db = hubLoad(), auth = hubAuth();
  if(!db) return false;
  if(!auth || !auth.loggedIn || !auth.companyId) return false;   // 未ログインはローカルのみ
  var cloud=null; try{ cloud=await hubCloudFetch(); }catch(e){ cloud=null; }
  db=hubLoad()||db;   // 通信待ちの間の入力を失わないよう読み直す
  var data;
  if(cloud){
    data = Object.assign({}, cloud);                 // 他コレクションはクラウド最新を維持
    ownColls().forEach(function(k){
      var merged=mergeNewestById(db[k]||[], cloud[k]||[]);
      data[k]=merged;
      db[k]=merged;                                   // ローカルにも反映(他端末の新しい変更を取込)
    });
    try{ localStorage.setItem(HUB_DBKEY, JSON.stringify(db)); }catch(e){}
  } else {
    // クラウド取得失敗: 従来どおりローカル全体(最善努力・消失防止)
    data = {
      master: db.master, config: db.conf,
      projects: db.projects||[], history: db.history||[], quotations: db.quotations||[],
      intercoRequests: db.intercoRequests||[], intercoOrders: db.intercoOrders||[],
      outsourceOrders: db.outsourceOrders||[], artesoCases: db.artesoCases||[],
      calendarOrders: db.calendarOrders||[], inquiries: db.inquiries||[],
      deliveryItems: db.deliveryItems||[], drivers: db.drivers||[],
      inquirySettings: db.inquirySettings||{}, releaseConfig: db.releaseConfig||{},
      toolCompanyConfig: db.toolCompanyConfig||{}, bookmarks: db.bookmarks||[],
      bookmarkCategories: db.bookmarkCategories||[], leadTimeMaster: db.leadTimeMaster||{},
      bookmarksDeleted: (db.bookmarksDeleted||[]).slice(-500),
      bookmarkCategoriesDeleted: (db.bookmarkCategoriesDeleted||[]).slice(-200)
    };
  }
  try {
    var url = new URL(HUB_GAS_URL);
    url.searchParams.set('action','saveAll');
    url.searchParams.set('apiKey', HUB_API_KEY);
    var res = await fetch(url.toString(), { method:'POST', body: JSON.stringify({ companyId: auth.companyId, data: data }), redirect:'follow' });
    var r = await res.json();
    return !!(r && r.success);
  } catch(e){ console.warn('[Tool] cloud push failed', e); return false; }
}
// リアルタイム同期: 20秒ごと＋タブ復帰時にクラウド最新を取り込み、変更があれば再描画
var _hubAutoBusy=false;
async function hubAutoSync(){
  if(_hubAutoBusy || document.hidden) return;
  var ae=document.activeElement;
  if(ae && ['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0) return;   // 入力中は邪魔しない
  _hubAutoBusy=true;
  try{
    var cloud=await hubCloudFetch();
    if(cloud){
      var db=hubLoad();
      if(db){
        var changed=false;
        ownColls().forEach(function(k){
          var before=JSON.stringify((db[k]||[]).map(function(r){return r&&r.id+':'+_tsval(r);}));
          var merged=mergeNewestById(db[k]||[], cloud[k]||[]);
          var after=JSON.stringify(merged.map(function(r){return r&&r.id+':'+_tsval(r);}));
          if(after!==before){ db[k]=merged; changed=true; }
        });
        if(changed){
          try{ localStorage.setItem(HUB_DBKEY, JSON.stringify(db)); }catch(e){}
          try{ if(typeof render==='function') render(); else if(typeof renderResult==='function'){} }catch(e){}
        }
      }
    }
  }catch(e){}
  _hubAutoBusy=false;
}
setInterval(hubAutoSync, 20000);
window.addEventListener('focus', hubAutoSync);

var _hubCloudTimer = null;
function hubCloudPushSoon(){
  if(_hubCloudTimer) clearTimeout(_hubCloudTimer);
  _hubCloudTimer = setTimeout(function(){ _hubCloudTimer=null; hubCloudPush(); }, 1500);
}
// 配列コレクションへの追加ショートカット
function hubAppend(key, record){
  return hubSave(function(db){ if(!Array.isArray(db[key])) db[key] = []; db[key].push(record); });
}
function hubEsc(s){ s=(s==null?'':String(s)); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hubToast(msg){
  var t = document.getElementById('toast'); if(!t) return alert(msg);
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.style.display='none'; }, 2600);
}
function hubYen(n){ return '¥' + Number(n||0).toLocaleString(); }
// ヘッダーにログインユーザー表示 + 未ログインガード
(function(){
  var a = hubAuth();
  var el = document.getElementById('hub-user');
  if(el) el.textContent = a.loggedIn ? ('👤 ' + (a.userName||'') + ' / ' + (a.companyName||'')) : '⚠ 本体未ログイン';
})();
// ═════════ 共有ヘルパーここまで ═════════
</script>
<script>
// ═════════ 書庫 ═════════
var COLL = 'documents';
var 分類 = ['規程・規則', 'マニュアル・手順', '様式・書式', '契約・覚書',
            '議事録', '認証・許認可', '図面・仕様', 'その他'];

// ---- ファイルはブラウザの中（IndexedDB）。台帳と違って全社へは渡らない ----
var DB = null;
function idb() {
  if (DB) return Promise.resolve(DB);
  return new Promise(function (ok, ng) {
    var q = indexedDB.open('tokiwa_shoko', 1);
    q.onupgradeneeded = function () {
      if (!q.result.objectStoreNames.contains('files')) q.result.createObjectStore('files', { keyPath: 'id' });
    };
    q.onsuccess = function () { DB = q.result; ok(DB); };
    q.onerror = function () { ng(q.error); };
  });
}
function fileGet(id) {
  return idb().then(function (db) {
    return new Promise(function (ok) {
      var r = db.transaction('files').objectStore('files').get(id);
      r.onsuccess = function () { ok(r.result || null); };
      r.onerror = function () { ok(null); };
    });
  });
}
function filePut(rec) {
  return idb().then(function (db) {
    return new Promise(function (ok, ng) {
      var t = db.transaction('files', 'readwrite');
      t.objectStore('files').put(rec);
      t.oncomplete = function () { ok(true); };
      t.onerror = function () { ng(t.error); };
    });
  });
}
function fileDel(id) {
  return idb().then(function (db) {
    return new Promise(function (ok) {
      var t = db.transaction('files', 'readwrite');
      t.objectStore('files').delete(id);
      t.oncomplete = function () { ok(true); };
      t.onerror = function () { ok(false); };
    });
  });
}

// ---- 台帳 ----
function docs() { var db = hubLoad(); return (db && Array.isArray(db[COLL])) ? db[COLL] : []; }
function uid() { return 'doc_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function ymd(v) { return v ? String(v).slice(0, 10) : ''; }

var 編集中 = null;      // 編集中のレコード（新規は null）
var 添付 = [];          // [{id,name,type,size}]

function fillSelects() {
  var a = document.getElementById('fcat'), b = document.getElementById('e-cat');
  分類.forEach(function (c) {
    a.insertAdjacentHTML('beforeend', '<option>' + hubEsc(c) + '</option>');
    b.insertAdjacentHTML('beforeend', '<option>' + hubEsc(c) + '</option>');
  });
}

function render() {
  var q = (document.getElementById('q').value || '').trim().toLowerCase();
  var cat = document.getElementById('fcat').value;
  var st = document.getElementById('fst').value;
  var list = docs().slice();

  list = list.filter(function (r) {
    if (!r) return false;
    if (cat && r.分類 !== cat) return false;
    if (st === '') { if (r.状態 === '廃止') return false; }
    else if (st !== '__all' && r.状態 !== st) return false;
    if (q) {
      var s = [r.文書名, r.所管, r.メモ, r.分類, r.版].join(' ').toLowerCase();
      if (s.indexOf(q) < 0) return false;
    }
    return true;
  });
  list.sort(function (a, b) {
    if (a.分類 !== b.分類) return 分類.indexOf(a.分類) - 分類.indexOf(b.分類);
    return String(a.文書名 || '').localeCompare(String(b.文書名 || ''), 'ja');
  });

  var tb = document.getElementById('rows');
  if (!list.length) {
    tb.innerHTML = '<tr><td colspan="8" style="color:#bbb;text-align:center;padding:1.6rem">'
                 + (docs().length ? '見つかりませんでした' : 'まだ何も登録されていません。「＋ 文書を登録」から始めてください')
                 + '</td></tr>';
  } else {
    tb.innerHTML = list.map(function (r) {
      var n = (r.添付 || []).length;
      var url = String(r.保管場所 || '');
      var link = /^https?:/i.test(url)
        ? '<a class="chip" href="' + hubEsc(url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 開く</a>'
        : hubEsc(url);
      return '<tr class="r" onclick="openEdit(\'' + r.id + '\')">'
        + '<td><div class="fname">' + hubEsc(r.文書名 || '（無題）') + '</div>'
        + '<div class="cat">' + hubEsc(r.分類 || '') + '</div>'
        + (r.メモ ? '<div class="sub">' + hubEsc(r.メモ) + '</div>' : '') + '</td>'
        + '<td>' + hubEsc(r.版 || '') + '</td>'
        + '<td>' + hubEsc(ymd(r.制定日)) + '</td>'
        + '<td>' + hubEsc(ymd(r.改定日)) + '</td>'
        + '<td>' + hubEsc(r.所管 || '') + '</td>'
        + '<td><span class="tag ' + hubEsc(r.状態 || '') + '">' + hubEsc(r.状態 || '') + '</span></td>'
        + '<td>' + link + '</td>'
        + '<td class="c">' + (n ? '📎 ' + n : '') + '</td>'
        + '</tr>';
    }).join('');
  }
  document.getElementById('cnt').textContent =
    '書庫　' + list.length + ' 件' + (docs().length !== list.length ? '（全 ' + docs().length + ' 件）' : '');
}

function openEdit(id) {
  編集中 = id ? docs().filter(function (r) { return r.id === id; })[0] : null;
  var r = 編集中 || {};
  添付 = (r.添付 || []).slice();
  document.getElementById('edit-title').textContent = 編集中 ? '文書の編集' : '文書の登録';
  document.getElementById('e-cat').value = r.分類 || 分類[0];
  document.getElementById('e-name').value = r.文書名 || '';
  document.getElementById('e-ver').value = r.版 || '';
  document.getElementById('e-from').value = ymd(r.制定日);
  document.getElementById('e-rev').value = ymd(r.改定日);
  document.getElementById('e-own').value = r.所管 || '';
  document.getElementById('e-st').value = r.状態 || '有効';
  document.getElementById('e-next').value = ymd(r.次回見直し);
  document.getElementById('e-url').value = r.保管場所 || '';
  document.getElementById('e-memo').value = r.メモ || '';
  document.getElementById('e-del').style.display = 編集中 ? '' : 'none';
  document.getElementById('edit').style.display = 'block';
  drawFiles();
  document.getElementById('e-name').focus();
  document.getElementById('edit').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function closeEdit() { document.getElementById('edit').style.display = 'none'; 編集中 = null; 添付 = []; }

function drawFiles() {
  var el = document.getElementById('e-files');
  if (!添付.length) { el.innerHTML = '<div class="sub">まだありません</div>'; return; }
  el.innerHTML = 添付.map(function (f, i) {
    return '<div><span>📎 ' + hubEsc(f.name) + '</span>'
      + '<span class="sub">' + Math.round((f.size || 0) / 1024).toLocaleString() + ' KB</span>'
      + '<a href="#" onclick="openFile(\'' + f.id + '\');return false">開く</a>'
      + '<button class="x" onclick="dropFile(' + i + ')">外す</button></div>';
  }).join('');
}
function addFiles(fs) {
  var 残り = fs.length;
  if (!残り) return;
  Array.prototype.forEach.call(fs, function (f) {
    if (f.size > 25 * 1024 * 1024) { hubToast('⚠ ' + f.name + ' は大きすぎます（25MBまで）'); 残り--; return; }
    var id = 'f_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    filePut({ id: id, name: f.name, type: f.type, size: f.size, blob: f })
      .then(function () {
        添付.push({ id: id, name: f.name, type: f.type, size: f.size });
        drawFiles();
      })
      .catch(function () { hubToast('⚠ ' + f.name + ' を保存できませんでした'); });
  });
  document.getElementById('pick').value = '';
}
function dropFile(i) {
  var f = 添付[i]; if (!f) return;
  if (!confirm(f.name + ' を外します。よろしいですか？\n（このパソコンから消えます）')) return;
  fileDel(f.id); 添付.splice(i, 1); drawFiles();
}
function openFile(id) {
  fileGet(id).then(function (r) {
    if (!r || !r.blob) { hubToast('⚠ このパソコンには保存されていません'); return; }
    var u = URL.createObjectURL(r.blob);
    window.open(u, '_blank', 'noopener');
    setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
  });
}

function saveDoc() {
  var 名 = document.getElementById('e-name').value.trim();
  if (!名) { hubToast('⚠ 文書名を入れてください'); return; }
  var v = {
    分類: document.getElementById('e-cat').value,
    文書名: 名,
    版: document.getElementById('e-ver').value.trim(),
    制定日: document.getElementById('e-from').value,
    改定日: document.getElementById('e-rev').value,
    所管: document.getElementById('e-own').value.trim(),
    状態: document.getElementById('e-st').value,
    次回見直し: document.getElementById('e-next').value,
    保管場所: document.getElementById('e-url').value.trim(),
    メモ: document.getElementById('e-memo').value.trim(),
    添付: 添付.slice()
  };
  var a = hubAuth();
  var ok;
  if (編集中) {
    var id = 編集中.id;
    ok = hubSave(function (db) {
      var r = (db[COLL] || []).filter(function (x) { return x.id === id; })[0];
      if (!r) return;
      Object.keys(v).forEach(function (k) { r[k] = v[k]; });
      r.更新者 = a.userName || '';
      hubStamp(r);
    });
  } else {
    v.id = uid();
    v.createdAt = new Date().toISOString();
    v.登録者 = a.userName || '';
    hubStamp(v);
    ok = hubAppend(COLL, v);
  }
  if (ok) { hubToast('💾 保存しました'); closeEdit(); render(); }
}

function delDoc() {
  if (!編集中) return;
  if (!confirm(編集中.文書名 + ' を書庫から消します。よろしいですか？')) return;
  var id = 編集中.id, fs = (編集中.添付 || []).slice();
  var ok = hubSave(function (db) {
    db[COLL] = (db[COLL] || []).filter(function (x) { return x.id !== id; });
  });
  if (ok) { fs.forEach(function (f) { fileDel(f.id); }); hubToast('🗑 消しました'); closeEdit(); render(); }
}

function exportJson() {
  var b = new Blob([JSON.stringify(docs(), null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = '書庫台帳_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 30000);
}

// ドラッグ＆ドロップ
(function () {
  var d = document.getElementById('drop');
  ['dragenter', 'dragover'].forEach(function (e) {
    d.addEventListener(e, function (ev) { ev.preventDefault(); d.classList.add('on'); });
  });
  ['dragleave', 'drop'].forEach(function (e) {
    d.addEventListener(e, function (ev) { ev.preventDefault(); d.classList.remove('on'); });
  });
  d.addEventListener('drop', function (ev) { addFiles(ev.dataTransfer.files); });
})();

fillSelects();
render();
</script>

<!-- HUB共通: 最新データに更新するフローティングボタン（自動挿入） -->
<style>
#hubRefreshBtn{position:fixed;right:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:6px;
  padding:9px 14px;font-size:13px;font-weight:700;font-family:inherit;color:#0f172a;background:#fde68a;
  border:1px solid #f59e0b;border-radius:22px;box-shadow:0 3px 10px rgba(0,0,0,.22);cursor:pointer;line-height:1;}
#hubRefreshBtn:hover{background:#fcd34d;}
#hubRefreshBtn:disabled{opacity:.6;cursor:default;}
@media print{#hubRefreshBtn{display:none!important;}}
</style>
<button id="hubRefreshBtn" title="クラウドの最新データに更新します" onclick="hubRefreshNow()">🔄 更新</button>
<script>
function hubRefreshNow(){
  var b=document.getElementById('hubRefreshBtn');
  var reset=function(){ if(b){ b.disabled=false; b.textContent='🔄 更新'; } };
  if(b){ b.disabled=true; b.textContent='⏳ 更新中…'; }
  // 入力中のセルを先に確定(保存)してから取り込む。未確定の入力がクラウドの古い値で消えるのを防ぐ。
  try{ var ae=document.activeElement; if(ae && ae.blur && ['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0) ae.blur(); }catch(e){}
  try{
    // クラウド取込関数を持つツール（カレンダー受注台帳など）は、再読込せず最新だけ取り込む
    if(typeof hubCloudPull==='function'){
      Promise.resolve(hubCloudPull()).then(function(){
        try{ if(typeof _hubCacheClear==='function') _hubCacheClear(); }catch(e){}
        try{ if(typeof buildYears==='function') buildYears(); }catch(e){}
        try{ if(typeof buildCats==='function') buildCats(); }catch(e){}
        try{ if(typeof render==='function') render(); }catch(e){}
        try{ if(typeof hubToast==='function') hubToast('🔄 最新データに更新しました'); }catch(e){}
        reset();
      }).catch(function(){ location.reload(); });
      return;
    }
  }catch(e){}
  // それ以外のページはページごと再読込（本体アプリは再読込でクラウドから取り直す）
  location.reload();
}
</script>
<!-- HUB共通: アプリ自動更新＋更新履歴（自動挿入 hubUpdateKit） -->
<style>
#hubLogBtn{position:fixed;right:16px;bottom:58px;z-index:99999;width:38px;height:38px;border-radius:50%;
  border:1px solid #cbd5e1;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18);cursor:pointer;font-size:17px;line-height:1;}
#hubLogBtn:hover{background:#f1f5f9;}
#hubLogPanel{position:fixed;right:16px;bottom:104px;z-index:99999;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow:auto;
  background:#fff;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px;display:none;font-size:12px;color:#0f172a;text-align:left;}
#hubLogPanel h3{margin:0 0 8px;font-size:13px;}
#hubLogPanel .d{font-weight:700;margin:10px 0 3px;color:#0369a1;}
#hubLogPanel ul{margin:0 0 4px;padding-left:17px;}
#hubLogPanel li{margin:2px 0;line-height:1.45;}
#hubUpBanner{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:100000;display:none;align-items:center;gap:10px;
  background:#0f172a;color:#fff;padding:9px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13px;}
#hubUpBanner button{font-family:inherit;font-size:12px;font-weight:700;border-radius:7px;border:0;padding:5px 11px;cursor:pointer;background:#fde68a;color:#0f172a;}
@media print{#hubLogBtn,#hubLogPanel,#hubUpBanner{display:none!important;}}
</style>
<button id="hubLogBtn" title="更新履歴を表示" onclick="hubToggleLog()">📋</button>
<div id="hubLogPanel"></div>
<div id="hubUpBanner"><span>🆕 新しい版があります（<b id="hubUpCnt">15</b>秒後に自動更新）</span><button onclick="hubDoUpdate()">今すぐ更新</button><button style="background:#334155;color:#fff" onclick="hubCancelUpdate()">後で</button></div>
<script>
(function(){
  var BASE = location.pathname.indexOf('/tools/')>=0 ? '../' : './';
  // ===== 更新履歴 =====
  window.hubToggleLog=function(){
    var p=document.getElementById('hubLogPanel');
    if(p.style.display==='block'){ p.style.display='none'; return; }
    p.style.display='block'; p.innerHTML='<h3>📋 更新履歴</h3>読み込み中…';
    fetch(BASE+'changelog.json?ts='+Date.now(), {cache:'no-store'}).then(function(r){return r.json();}).then(function(list){
      var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');};
      p.innerHTML='<h3>📋 更新履歴</h3>'+list.map(function(e){
        return '<div class="d">'+esc(e.date)+'</div><ul>'+e.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';
      }).join('');
    }).catch(function(){ p.innerHTML='<h3>📋 更新履歴</h3>取得できませんでした'; });
  };
  // ===== アプリ本体の自動更新 =====
  // service-worker.js の版番号を定期取得し、変わっていたら再読込して新しい版に切り替える。
  var curVer=null, timer=null;
  function fetchVer(){
    return fetch(BASE+'service-worker.js?ts='+Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(t){ var m=t.match(/CACHE_VERSION\s*=\s*'([^']+)'/); return m?m[1]:null; })
      .catch(function(){ return null; });
  }
  window.hubDoUpdate=function(){ try{ sessionStorage.setItem('hubJustUpdated','1'); }catch(e){} location.reload(); };
  window.hubCancelUpdate=function(){ if(timer){ clearInterval(timer); timer=null; } var b=document.getElementById('hubUpBanner'); if(b) b.style.display='none'; };
  function showBanner(){
    var b=document.getElementById('hubUpBanner'); if(!b || b.style.display==='flex') return;
    b.style.display='flex';
    var n=15, c=document.getElementById('hubUpCnt'); c.textContent=n;
    timer=setInterval(function(){
      var ae=document.activeElement;
      if(ae && ['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0) return;   // 入力中はカウントを止める
      n--; c.textContent=n;
      if(n<=0){ clearInterval(timer); hubDoUpdate(); }
    }, 1000);
  }
  function check(){
    fetchVer().then(function(v){
      if(!v) return;
      if(curVer===null){ curVer=v; return; }
      if(v===curVer) return;
      // 新しい版を検知: 非表示タブは即時、表示中はバナー＋カウントダウンで自動更新
      if(document.hidden){ hubDoUpdate(); } else { showBanner(); }
    });
  }
  fetchVer().then(function(v){ curVer=v; });
  setInterval(check, 180000);   // 3分ごとに版を確認
  window.addEventListener('focus', check);
  try{ if(sessionStorage.getItem('hubJustUpdated')){ sessionStorage.removeItem('hubJustUpdated'); } }catch(e){}
})();
</script>
</body>
