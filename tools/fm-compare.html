<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>付け合わせ（FileMaker ⇔ 案件入力）| Tokiwa Hub</title>
<style>
  :root{ --ink:#0d0d0d; --bg:#f1efea; --line:#b8b3a6; --line2:#8f97a3; --sub:#33393f;
         --acc:#65a30d; --red:#c0392b; --hd:#e6e3db; --hl:#1d4ed8; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
        font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif; font-size:12.5px; }
  .hubbar{ background:#0a0a0a; color:#fff; padding:8px 16px; display:flex; align-items:center; gap:12px; flex:none; }
  .hubbar .logo{ font-weight:800; font-size:13px; } .hubbar .logo b{ color:#a3e635; }
  .hubbar .tname{ font-size:15px; font-weight:800; }
  .hubbar .who{ margin-left:auto; font-size:11px; color:#cbd5e1; }
  .tabs{ display:flex; gap:4px; padding:6px 14px 0; flex:none; }
  .tb{ font-size:12px; font-weight:800; padding:5px 16px; border:1px solid var(--line);
       border-bottom:none; border-radius:8px 8px 0 0; background:#e9e6df; cursor:pointer; font-family:inherit; }
  .tb.on{ background:#fff; }
  .pane{ display:none; flex:1; min-height:0; margin:0 14px 12px; background:#fff;
         border:1px solid var(--line); border-radius:0 10px 10px 10px; }
  .pane.on{ display:flex; flex-direction:column; }
  /* ── 画面併記 ── */
  .cmpbar{ display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--line);
           font-size:11.5px; flex:none; flex-wrap:wrap; }
  .cmpbar b{ color:var(--hl); }
  .split{ display:flex; flex:1; min-height:0; }
  .side{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .side + .side{ border-left:2px solid var(--line); }
  .sh{ font-size:11px; font-weight:800; padding:4px 10px; background:var(--hd); border-bottom:1px solid var(--line); flex:none; }
  .side iframe{ width:100%; height:100%; border:0; }
  .hublist{ overflow:auto; padding:6px 8px; }
  .hf{ display:flex; align-items:center; gap:8px; padding:4px 7px; margin-bottom:3px;
       border:1px solid var(--line); border-radius:6px; background:#faf9f7; cursor:pointer; }
  .hf:hover{ background:#eef4ff; }
  .hf .nm{ font-weight:700; }
  .hf .id{ font-size:10.5px; color:var(--sub); margin-left:auto; }
  .hf.hit{ outline:3px solid var(--hl); background:#e0edff; }
  .hf.dim{ opacity:.35; }
  /* 吹き出し */
  #tip{ position:fixed; z-index:9999; display:none; max-width:420px; background:#0a0a0a; color:#fff;
        border-radius:8px; padding:8px 11px; font-size:11.5px; line-height:1.7; box-shadow:0 6px 20px rgba(0,0,0,.3); }
  #tip .k{ color:#a3e635; font-weight:800; }
  #tip .w{ color:#fca5a5; font-weight:800; }
  /* ── 対応表 ── */
  .tblwrap{ overflow:auto; padding:8px 12px; }
  .bar{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:8px;
        padding:6px 8px; background:#faf9f7; border:1px solid var(--line); border-radius:8px; }
  .fb{ font-size:11.5px; font-weight:700; padding:3px 11px; border:1.4px solid #6b6a64;
       border-radius:6px; background:#fff; cursor:pointer; font-family:inherit; }
  .fb.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  table{ border-collapse:collapse; width:100%; }
  th,td{ border:1px solid var(--line2); padding:3px 6px; vertical-align:middle; }
  th{ background:var(--hd); font-size:10.5px; font-weight:800; position:sticky; top:0; z-index:1; }
  td.n{ text-align:right; font-variant-numeric:tabular-nums; }
  select{ font-family:inherit; font-size:12px; padding:2px 4px; width:100%;
          border:1.4px solid #7b8695; border-radius:5px; background:#fff; }
  .st{ font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:10px; white-space:nowrap; }
  .st.ok{ background:#e7f0dd; color:#3f6212; }
  .st.add{ background:#e0edff; color:#1d4ed8; }
  .st.drop{ background:#fdf2f1; color:var(--red); }
  tr.dead td{ background:#fdf2f1; } tr.rare td{ background:#fffaf0; } tr.low td{ background:#fffdf0; }
  .mini{ font-size:10.5px; color:var(--sub); }
  .cnt{ font-size:11.5px; font-weight:800; margin-left:auto; }
</style>
</head>
<body>
<div class="hubbar"><span class="logo">TOKIWA <b>HUB</b></span>
  <span class="tname">付け合わせ（開発用）</span><span class="who">FileMaker ⇔ 案件入力</span></div>
<div style="height:3px;background:#65a30d"></div>

<div class="tabs">
  <button class="tb on" id="tb-cmp" onclick="tab('cmp')">画面で付け合わせ</button>
  <button class="tb" id="tb-map" onclick="tab('map')">対応表</button>
</div>

<div class="pane on" id="pane-cmp">
  <div class="cmpbar">
    左のFileMakerの欄に<b>マウスを乗せる</b>と、右のHub案件入力（本番の実画面）の該当箇所が光ります。右側は案件入力を開いてから使ってください。
    右に乗せれば左が光ります。<b>対応が無いものは「Hubに無い（追加候補）」</b>と出ます。
    <label style="margin-left:auto;display:flex;align-items:center;gap:5px;cursor:pointer">
      <input type="checkbox" id="dimoff" onchange="render()"> 対応しない欄を薄くする</label>
    <span id="cmp-msg" class="mini"></span>
  </div>
  <div class="split">
    <div class="side">
      <div class="sh">左：FileMaker 受注入力（実画面）</div>
      <iframe id="fmfr" src="fm-juchu.html"></iframe>
    </div>
    <div class="side">
      <div class="sh">右：Hub 案件入力（本番の実画面）
        <button class="fb" style="padding:1px 8px;margin-left:8px" onclick="bindHub(true)">項目を紐付け直す</button>
        <span id="hub-msg" class="mini"></span></div>
      <iframe id="hubfr" src="../index.html"></iframe>
    </div>
  </div>
</div>

<div class="pane" id="pane-map">
  <div class="tblwrap">
    <div class="bar">
      <button class="fb on" onclick="setF('all',this)">すべて</button>
      <button class="fb" onclick="setF('add',this)">Hubに無い＝要追加</button>
      <button class="fb" onclick="setF('ok',this)">対応あり</button>
      <button class="fb" onclick="setF('live',this)">実績あり(10%以上)だけ</button>
      <button class="fb" onclick="setF('dead',this)">実績0件</button>
      <span style="width:10px"></span>
      <button class="fb" onclick="exportMap()">対応表を書き出す</button>
      <button class="fb" onclick="resetMap()">一次案に戻す</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <table id="tbl"></table>
  </div>
</div>

<div id="tip"></div>

ack-box", "label": "箱入れ"}, {"id": "pack-boxes", "label": "総箱数"}, {"id": "die-cut", "label": "抜き型"}, {"id": "die-cut-note", "label": "型番・備考"}, {"id": "delivery-note", "label": "納品先・備考"}, {"id": "pattern-name", "label": ""}];
var KEY = 'fm_compare_map_v1';
var MAP = null;
try{ MAP = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){ MAP = null; }
if(!MAP){ MAP = {}; FM.forEach(function(r){ MAP[r.id] = r.to; }); }

var FMBY = {}; FM.forEach(function(r){ FMBY[r.id] = r; });
var HUBBY = {}; HUB.forEach(function(r){ HUBBY[r.id] = r; });
function hubToFm(hid){ return FM.filter(function(r){ return MAP[r.id] === hid; }); }

function tab(k){
  document.getElementById('pane-cmp').classList.toggle('on', k === 'cmp');
  document.getElementById('pane-map').classList.toggle('on', k === 'map');
  document.getElementById('tb-cmp').classList.toggle('on', k === 'cmp');
  document.getElementById('tb-map').classList.toggle('on', k === 'map');
}

/* ───────── 画面で付け合わせ ───────── */
function useTxt(u){
  if(u === null || u === undefined) return '実績データなし';
  if(u < 0) return '過去データと照合できない項目';
  return '過去2年 11,781件のうち ' + u + '% に入力あり';
}
function showTip(x, y, html){
  var t = document.getElementById('tip');
  t.innerHTML = html; t.style.display = 'block';
  var w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.min(x + 14, innerWidth - w - 8) + 'px';
  t.style.top  = Math.min(y + 16, innerHeight - h - 8) + 'px';
}
function hideTip(){ document.getElementById('tip').style.display = 'none'; }

function fmDoc(){
  try{ return document.getElementById('fmfr').contentDocument; }catch(e){ return null; }
}
function hubDoc(){
  try{ return document.getElementById('hubfr').contentDocument; }catch(e){ return null; }
}
function unmark(d){
  if(!d) return;
  d.querySelectorAll('.cmp-hit').forEach(function(e){
    e.classList.remove('cmp-hit'); e.style.outline = ''; e.style.background = '';
  });
}
function clearHit(){ unmark(fmDoc()); unmark(hubDoc()); }
function mark(e, scroll){
  if(!e) return;
  e.classList.add('cmp-hit');
  e.style.outline = '3px solid #1d4ed8';
  e.style.background = '#e0edff';
  if(scroll){ try{ e.scrollIntoView({block:'center'}); }catch(x){} }
}
// Hub側のidは cust-3 のようにタブ番号が付く。前方一致＋数字で実物を探す。
function findHubEl(hid){
  var d = hubDoc(); if(!d) return null;
  var list = d.querySelectorAll('[id^="' + hid + '-"]');
  var re = new RegExp('^' + hid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '-\\d+$');
  for(var i = 0; i < list.length; i++){
    if(re.test(list[i].id) && list[i].offsetParent !== null) return list[i];
  }
  for(var j = 0; j < list.length; j++){ if(re.test(list[j].id)) return list[j]; }
  return null;
}
// 左(FM)の欄に乗った → 右を光らせる
function onFmHover(fid, ev){
  clearHit();
  var r = FMBY[fid]; if(!r) return;
  var hid = MAP[fid] || '';
  var h = '<span class="k">' + (r.label || fid) + '</span>（FMの列: ' + (r.col || '—') + '）<br>'
        + useTxt(r.use) + '<br>';
  if(hid && HUBBY[hid]){
    var el = findHubEl(hid);
    h += '→ Hubの <span class="k">' + (HUBBY[hid].label || hid) + '</span> に入ります'
       + (el ? '' : '<br><span class="w">※右の画面にまだ出ていません（案件入力を開いてください）</span>');
    mark(el, true);
  }else if(r.drop){
    h += '<span class="w">移さない</span>（過去2年で使われていないため）';
  }else{
    h += '<span class="w">Hubに無い（追加候補）</span>';
  }
  showTip(ev.clientX, ev.clientY, h);
}
// 右(Hub)の欄に乗った → 左を光らせる
function onHubHover(hid, ev){
  clearHit();
  var hb = HUBBY[hid];
  var srcs = hubToFm(hid);
  var h = '<span class="k">' + (hb.label || hid) + '</span>（Hubの案件入力）<br>';
  if(srcs.length){
    h += '← FileMakerの <span class="k">' + srcs.map(function(r){ return r.label; }).join(' / ') + '</span> が入ります<br>'
       + srcs.map(function(r){ return '　' + r.label + '：' + useTxt(r.use); }).join('<br>');
    var d = fmDoc();
    if(d) srcs.forEach(function(r, i){ mark(d.getElementById(r.id), i === 0); });
  }else{
    h += '<span class="w">FileMakerに該当なし</span>（Hub側だけの項目）';
  }
  showTip(ev.clientX, ev.clientY, h);
}

function render(){
  var add = FM.filter(function(r){ return !(MAP[r.id] || '') && !r.drop; }).length;
  document.getElementById('cmp-msg').textContent =
    'FM ' + FM.length + '項目 / Hub ' + HUB.length + '項目 / Hubに無い ' + add + '件';
  renderTable();
}

// 左iframeの読み込み後に、各入力へマウス反応を付ける
function bindFm(){
  var d = fmDoc(); if(!d) return;
  var n = 0;
  Object.keys(FMBY).forEach(function(fid){
    var e = d.getElementById(fid); if(!e) return;
    n++;
    e.addEventListener('mouseenter', function(ev){
      onFmHover(fid, { clientX: ev.clientX + frameLeft(), clientY: ev.clientY + frameTop() });
    });
    e.addEventListener('mousemove', function(ev){
      onFmHover(fid, { clientX: ev.clientX + frameLeft(), clientY: ev.clientY + frameTop() });
    });
    e.addEventListener('mouseleave', function(){ hideTip(); clearHit(); });
  });
  var msg = document.getElementById('cmp-msg');
  msg.textContent = msg.textContent + ' ／ 左画面に ' + n + '項目を紐付け';
}
// 右の実画面に、対応表にある項目だけマウス反応を付ける。
// 案件入力は後から組み立てられるので、DOMの変化を見て何度でも貼り直す。
var _hubBound = {};
function bindHub(force){
  var d = hubDoc(); if(!d) return;
  if(force) _hubBound = {};
  var n = 0, found = 0;
  HUB.forEach(function(x){
    var e = findHubEl(x.id); if(!e) return;
    found++;
    if(_hubBound[e.id]) { n++; return; }
    _hubBound[e.id] = 1; n++;
    e.addEventListener('mouseenter', function(ev){
      onHubHover(x.id, { clientX: ev.clientX + hubLeft(), clientY: ev.clientY + hubTop() });
    });
    e.addEventListener('mousemove', function(ev){
      onHubHover(x.id, { clientX: ev.clientX + hubLeft(), clientY: ev.clientY + hubTop() });
    });
    e.addEventListener('mouseleave', function(){ hideTip(); clearHit(); });
  });
  var m = document.getElementById('hub-msg');
  if(m) m.textContent = ' 右画面で ' + found + ' / ' + HUB.length + ' 項目を認識';
}
function hubLeft(){ return document.getElementById('hubfr').getBoundingClientRect().left; }
function hubTop(){  return document.getElementById('hubfr').getBoundingClientRect().top; }
document.getElementById('hubfr').addEventListener('load', function(){
  setTimeout(function(){ bindHub(true); }, 1200);
  try{
    var d = hubDoc();
    new MutationObserver(function(){ clearTimeout(window._hubT); window._hubT = setTimeout(bindHub, 600); })
      .observe(d.body, { childList:true, subtree:true });
  }catch(e){}
});

function frameLeft(){ return document.getElementById('fmfr').getBoundingClientRect().left; }
function frameTop(){  return document.getElementById('fmfr').getBoundingClientRect().top; }
document.getElementById('fmfr').addEventListener('load', function(){ setTimeout(bindFm, 400); });

/* ───────── 対応表 ───────── */
var FILTER = 'all';
function useClass(u){
  if(u === null || u === undefined || u < 0) return '';
  if(u === 0) return 'dead';
  if(u < 1) return 'rare';
  if(u < 10) return 'low';
  return '';
}
function opts(sel){
  var h = '<option value="">（Hubに無い）</option>';
  HUB.forEach(function(x){
    h += '<option value="' + x.id + '"' + (sel === x.id ? ' selected' : '') + '>'
       + (x.label ? x.label + '  〔' + x.id + '〕' : x.id) + '</option>';
  });
  return h;
}
function renderTable(){
  var h = '<thead><tr><th style="width:150px">FileMakerの項目</th><th style="width:110px">FMの列</th>'
        + '<th style="width:64px">実績</th><th style="width:76px">状態</th>'
        + '<th>Hub案件入力のどこに入れるか</th><th style="width:120px">id</th></tr></thead><tbody>';
  var n = 0;
  FM.forEach(function(r){
    var to = MAP[r.id] || '';
    var st = r.drop ? 'drop' : (to ? 'ok' : 'add');
    if(FILTER === 'add'  && st !== 'add') return;
    if(FILTER === 'ok'   && st !== 'ok')  return;
    if(FILTER === 'dead' && r.use !== 0) return;
    if(FILTER === 'live' && !(r.use !== null && r.use >= 10)) return;
    n++;
    h += '<tr class="' + useClass(r.use) + '">'
      + '<td><b>' + r.label + '</b></td><td class="mini">' + (r.col || '') + '</td>'
      + '<td class="n mini">' + (r.use === null || r.use === undefined ? '—' : (r.use < 0 ? '照合不可' : r.use + '%')) + '</td>'
      + '<td><span class="st ' + st + '">' + (st === 'ok' ? '対応あり' : (st === 'drop' ? '移さない' : 'Hubに無い')) + '</span></td>'
      + '<td><select onchange="pick(\'' + r.id + '\', this.value)">' + opts(to) + '</select></td>'
      + '<td class="mini">' + r.id + '</td></tr>';
  });
  document.getElementById('tbl').innerHTML = h + '</tbody>';
  var add = FM.filter(function(x){ return !(MAP[x.id] || '') && !x.drop; }).length;
  document.getElementById('cnt').textContent = '表示 ' + n + '件 ／ 全 ' + FM.length + '件 ／ Hubに無い ' + add + '件';
}
function pick(id, v){ MAP[id] = v; save(); render(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(MAP)); }catch(e){} }
function setF(f, btn){
  FILTER = f;
  Array.prototype.forEach.call(document.querySelectorAll('.bar .fb'), function(b){ b.classList.remove('on'); });
  if(btn) btn.classList.add('on');
  renderTable();
}
function resetMap(){
  if(!confirm('一次案に戻します。よろしいですか？')) return;
  MAP = {}; FM.forEach(function(r){ MAP[r.id] = r.to; }); save(); render();
}
function exportMap(){
  var out = FM.map(function(r){
    return { fm: r.id, label: r.label, col: r.col, use: r.use, hub: MAP[r.id] || '', drop: !!r.drop };
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ map: out }, null, 1)], { type: 'application/json' }));
  a.download = 'fm_hub_map.json'; a.click();
}
render();
</script>
