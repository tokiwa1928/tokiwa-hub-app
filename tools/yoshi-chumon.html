<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>用紙注文書 | Tokiwa Hub</title>
<style>
  /* FileMaker の「用紙注文書」画面と同じ並び。データも FileMaker の同じテーブル（発注番号 y…）に入る */
  body{ margin:0; font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif; background:#e5e7eb; color:#111; }
  #bar{ background:#0d0d0d; color:#e5e7eb; padding:6px 14px; display:flex; gap:8px; align-items:center; font-size:13px; flex-wrap:wrap; }
  #bar a{ color:#93c5fd; text-decoration:none; }
  #bar select,#bar input{ font-size:13px; padding:3px 6px; border:1px solid #64748b; border-radius:4px; }
  #bar button{ font-size:13px; padding:3px 12px; border:1px solid #cbd5e1; border-radius:4px; background:#fff; color:#111; cursor:pointer; }
  #bar button.rd{ background:#dc2626; color:#fff; border-color:#dc2626; }
  #bar .st{ color:#fbbf24; }
  #paper{ width:297mm; min-height:200mm; margin:12px auto; background:#fff; padding:8mm 10mm; box-sizing:border-box; font-size:10pt; box-shadow:0 2px 10px rgba(0,0,0,.2); position:relative; }
  .no{ position:absolute; right:14mm; top:6mm; font-size:10pt; }
  h1{ text-align:center; font-size:20pt; font-weight:500; margin:2mm 0 4mm; text-decoration:underline; }
  .head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4mm; }
  .to{ font-size:15pt; font-weight:700; border-bottom:2px solid #000; padding:0 8mm 1mm 4mm; margin-bottom:5mm; min-width:70mm; }
  .to input{ font-size:15pt; font-weight:700; border:0; border-bottom:1px dotted #94a3b8; width:60mm; background:transparent; }
  .kind{ margin-left:6mm; font-size:10pt; } .kind input{ width:22mm; border:0; border-bottom:1px dotted #94a3b8; }
  .greet{ margin:5mm 0 2mm 4mm; font-size:10pt; }
  .note{ color:#dc2626; font-size:8pt; margin-left:22mm; }
  .us{ text-align:left; font-size:10pt; line-height:1.5; width:90mm; }
  .us .date{ font-size:10pt; margin-bottom:1mm; } .us .date input{ border:0; border-bottom:1px dotted #94a3b8; width:28mm; font-size:10pt; }
  .us .co{ font-size:14pt; font-weight:700; margin:1mm 0 2mm; }
  .us .tanto{ border-bottom:1px solid #000; padding-bottom:1mm; } .us .tanto input{ border:0; border-bottom:1px dotted #94a3b8; width:24mm; font-size:11pt; }
  table{ border-collapse:collapse; width:100%; table-layout:fixed; }
  th,td{ border:1px solid #000; padding:0; font-size:9pt; height:7mm; text-align:center; overflow:hidden; }
  th{ font-weight:500; height:9mm; line-height:1.2; }
  td input{ width:100%; height:100%; border:0; box-sizing:border-box; font-size:9pt; text-align:center; background:transparent; padding:0 1mm; font-family:inherit; }
  td input:focus{ outline:2px solid #60a5fa; background:#eff6ff; }
  tr.even td{ border-top:1px solid #9ca3af; }
  #toast{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#111; color:#fff; padding:6px 14px; border-radius:6px; font-size:12px; display:none; }
  .only-print{ display:none; }
  @media print{ body{ background:#fff; } .only-print{ display:inline; } #f-date{ display:none; } #bar,#toast{ display:none !important; } #paper{ margin:0; box-shadow:none; width:auto; min-height:auto; padding:6mm 8mm; } @page{ size:A4 landscape; margin:0; }
    td input,.to input,.kind input,.us input{ border:0 !important; background:transparent; } td input:focus{ outline:0; } }
</style>
</head>
<body>
<div id="bar">
  <a href="fm-juchu-hub.html">← 受注入力</a>
  <b>用紙注文書</b>
  <select id="list" title="これまでの注文書（新しい順）"><option value="">— 注文書を開く —</option></select>
  <button id="new">新規</button>
  <button id="save">保存</button>
  <button id="print">印刷</button>
  <button id="del" class="rd">削除</button>
  <span class="st" id="st"></span>
  <span style="margin-left:auto" id="fm-who"></span><span id="fm-signin"></span>
</div>

<div id="paper">
  <div class="no" id="p-no"></div>
  <h1>用紙注文書</h1>
  <div class="head">
    <div>
      <div class="to"><input id="f-to" list="dl-to" placeholder="注文先"><datalist id="dl-to"></datalist>　御中</div>
      <div class="kind">分類　<input id="f-kind" list="dl-kind" placeholder="個別"><datalist id="dl-kind"><option>個別</option><option>在庫1</option><option>在庫2</option></datalist></div>
      <div class="greet">下記用紙発注お願いします。</div>
      <div class="note">*表紙はパーツに0と入力</div>
    </div>
    <div class="us">
      <div class="date"><input id="f-date" type="date"><span id="p-date" class="only-print"></span></div>
      <div class="co">トキワ印刷株式会社</div>
      <div>〒 432-8053 浜松市法枝町115<br>TEL 053-441-2784　FAX 053-442-1265</div>
      <div class="tanto">担当者　：　<input id="f-tanto" list="dl-tanto"><datalist id="dl-tanto"></datalist></div>
    </div>
  </div>
  <table>
    <colgroup><col style="width:22mm"><col style="width:9mm"><col style="width:26mm"><col style="width:12mm"><col style="width:13mm"><col style="width:9mm"><col style="width:15mm"><col style="width:8mm"><col style="width:36mm"><col style="width:13mm"><col style="width:26mm"><col style="width:13mm"><col style="width:12mm"><col style="width:12mm"></colgroup>
    <thead><tr><th>伝票番号</th><th>パーツ<span style="color:#dc2626">*</span></th><th>紙質</th><th>厚さ</th><th>サイズ</th><th>切数</th><th>数量<br>（全紙）</th><th>紙目</th><th>得意先</th><th>入荷<br>希望日</th><th>納品場所</th><th>入荷日</th><th>単価</th><th>切代</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="toast"></div>

<script src="fm-bridge.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 2500); }
function 和暦(iso) { if (!iso) return ''; var p = iso.split('-'); var r = Number(p[0]) - 2018; return '令和' + (r === 1 ? '元' : r) + '年' + p[1] + '月' + p[2] + '日'; }
function FM日付(iso) { if (!iso) return ''; var p = iso.split('-'); return p[1] + '/' + p[2] + '/' + p[0]; }
function ISO日付(fm) { var m = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(String(fm || '')); return m ? (m[3] + '-' + m[1] + '-' + m[2]) : ''; }

var 列 = ['伝票番号', 'パーツ', '品名', '厚さ', 'サイズ', '切数', '数量', '紙目', '得意先', '入荷希望日', '納品場所', '入荷日', '単価', '切代'];
var 現在 = null;   // { recordId, modId, fields }
var マスタ = {};

// ---- 行
function 行を描く() {
  var h = '';
  for (var i = 1; i <= 9; i++) {
    h += '<tr' + (i % 2 === 0 ? ' class="even"' : '') + ' data-i="' + i + '">';
    列.forEach(function (c) { h += '<td><input data-c="' + c + '"' + (c === '伝票番号' ? ' list="dl-no"' : '') + '></td>'; });
    h += '</tr>';
  }
  $('rows').innerHTML = h;
  // 伝票番号＋パーツを入れたら FileMaker の受注から紙質などを引く
  Array.prototype.forEach.call($('rows').querySelectorAll('input[data-c="伝票番号"],input[data-c="パーツ"]'), function (el) {
    el.addEventListener('change', function () { 受注から埋める(el.closest('tr')); });
  });
}
function 値(tr, c) { return tr.querySelector('input[data-c="' + c + '"]').value.trim(); }
function 置く(tr, c, v) { tr.querySelector('input[data-c="' + c + '"]').value = (v == null ? '' : String(v)); }

var 受注キャッシュ = {};
function 受注から埋める(tr) {
  var no = 値(tr, '伝票番号'), p = 値(tr, 'パーツ');
  if (!no) return;
  if (!/^[a-zA-Z]\d{5,}$/.test(no)) return;
  var 埋める = function (f) {
    var s = (p === '0') ? '0' : (p || '1');
    if (!p) 置く(tr, 'パーツ', '1');
    置く(tr, '品名', f['品名' + s] || f['紙質' + s] || '');
    置く(tr, '厚さ', f['規格' + s] || '');
    置く(tr, 'サイズ', f['サイズ' + s] || '');
    置く(tr, '切数', f['切数' + s] || '');
    置く(tr, '数量', f['合計数' + s] || '');
    置く(tr, '紙目', f['紙目' + s] || '');
    置く(tr, '得意先', 得意先名(f['得意先コード']) || '');
    if (!値(tr, '入荷希望日')) 置く(tr, '入荷希望日', '最短');
    if (!値(tr, '納品場所')) 置く(tr, '納品場所', 'トキワ印刷(株)');
  };
  if (受注キャッシュ[no]) { 埋める(受注キャッシュ[no]); return; }
  $('st').textContent = no + ' を FileMaker から読んでいます…';
  FM.呼ぶ('画面_読み込み', [no]).then(function (r) {
    if (!r.record) throw new Error('見つかりません: ' + no);
    return FM.呼ぶ('画面_全項目', [r.record.recordId]);
  }).then(function (j) { 受注キャッシュ[no] = j.fields; 埋める(j.fields); $('st').textContent = ''; })
    .catch(function (e) { $('st').textContent = String(e.message || e); });
}

// ---- 読む・書く
function 画面へ(rec) {
  現在 = rec;
  var f = rec ? rec.fields : {};
  $('p-no').textContent = f['発注番号'] || '（新規）';
  $('f-to').value = f['注文先'] || ''; $('f-kind').value = f['発注分類'] || '個別';
  $('f-date').value = ISO日付(f['日付']) || new Date().toISOString().slice(0, 10);
  $('f-tanto').value = f['担当者'] || $('f-tanto').value;
  $('p-date').textContent = 和暦($('f-date').value);
  Array.prototype.forEach.call($('rows').querySelectorAll('tr'), function (tr) {
    var i = tr.getAttribute('data-i');
    列.forEach(function (c) { var v = f[c + i]; if (c === '入荷日' && v) v = ISO日付(v) || v; 置く(tr, c, v == null ? '' : v); });
  });
  document.title = '用紙注文書 ' + (f['発注番号'] || '新規') + (f['注文先'] ? '_' + f['注文先'] : '') + ' | Tokiwa Hub';
}
function 画面から() {
  var f = { '注文先': $('f-to').value.trim(), '発注分類': $('f-kind').value.trim(), '日付': FM日付($('f-date').value), '担当者': $('f-tanto').value.trim(), '書名': '用紙注文書' };
  Array.prototype.forEach.call($('rows').querySelectorAll('tr'), function (tr) {
    var i = tr.getAttribute('data-i');
    列.forEach(function (c) { var v = 値(tr, c); if (c === '入荷日' && /^\d{4}-\d\d-\d\d$/.test(v)) v = FM日付(v); f[c + i] = v; });
  });
  return f;
}
function 保存() {
  var f = 画面から();
  if (!f['注文先']) { toast('注文先を入れてください'); $('f-to').focus(); return; }
  $('st').textContent = '保存しています…';
  var p = 現在 ? FM.呼ぶ('用紙注文_保存', [現在.recordId, 現在.modId, f]) : FM.呼ぶ('用紙注文_作る', [f]);
  p.then(function (r) { 画面へ(r); $('st').textContent = ''; toast('保存しました ' + r.fields['発注番号']); 一覧を読む(); 候補(); })
   .catch(function (e) { $('st').textContent = String(e.message || e); });
}
function 新規() {
  if (現在 && !confirm('新しい注文書にします。よろしいですか？（保存していない変更は消えます）')) return;
  画面へ(null); $('list').value = ''; $('f-to').focus();
}
function 削除() {
  if (!現在) { toast('まだ保存していません'); return; }
  var no = 現在.fields['発注番号'];
  var t = prompt('FileMaker からこの注文書を削除します。取り消せません。\n\n確認のため発注番号（' + no + '）を入れてください');
  if (t === null) return; if (String(t).trim() !== String(no)) { toast('番号が違うので削除しません'); return; }
  FM.呼ぶ('用紙注文_削除', [現在.recordId]).then(function () { toast(no + ' を削除しました'); 画面へ(null); 一覧を読む(); })
    .catch(function (e) { $('st').textContent = String(e.message || e); });
}
function 開く(発注番号) {
  if (!発注番号) return;
  $('st').textContent = '読んでいます… ' + 発注番号;
  FM.呼ぶ('用紙注文_読む', [発注番号]).then(function (r) { 画面へ(r); $('st').textContent = ''; try { history.replaceState(null, '', '?no=' + encodeURIComponent(発注番号)); } catch (e) {} })
    .catch(function (e) { $('st').textContent = String(e.message || e); });
}
var 一覧 = [];
function 一覧を読む() {
  return FM.呼ぶ('用紙注文_一覧', [60]).then(function (r) {
    一覧 = r.行 || [];
    var sel = $('list'); var cur = sel.value; sel.innerHTML = '<option value="">— 注文書を開く（' + (r.全体 || 0).toLocaleString() + ' 件）—</option>';
    一覧.forEach(function (x) { var o = document.createElement('option'); o.value = x.発注番号; o.textContent = x.発注番号 + '　' + (x.日付 || '') + '　' + (x.注文先 || '') + '　' + (x.発注分類 || '') + '　' + x.行数 + '行'; sel.appendChild(o); });
    sel.value = cur;
  }).catch(function (e) { $('st').textContent = String(e.message || e); });
}
function 候補() {
  var seen = {}; var dl = $('dl-to'); dl.innerHTML = '';
  一覧.forEach(function (x) { if (x.注文先 && !seen[x.注文先]) { seen[x.注文先] = 1; var o = document.createElement('option'); o.value = x.注文先; dl.appendChild(o); } });
  var seen2 = {}; var dk = $('dl-kind'); dk.innerHTML = '';
  ['個別', '在庫1', '在庫2'].concat(一覧.map(function (x) { return x.発注分類; })).forEach(function (k) { if (k && !seen2[k]) { seen2[k] = 1; var o = document.createElement('option'); o.value = k; dk.appendChild(o); } });
}

// ---- マスタ（得意先名・担当者）
function マスタを用意() {
  return Promise.all(['得意先マスタ', '社員マスタ'].map(function (L) {
    try { var c = JSON.parse(localStorage.getItem('fm_master_' + L) || 'null'); if (c && c.取った && Date.now() - new Date(c.取った).getTime() < 24 * 3600 * 1000) { マスタ[L] = c; return; } } catch (e) {}
    return FM.呼ぶ('マスタ_配る', [L]).then(function (j) { j.取った = new Date().toISOString(); マスタ[L] = j; try { localStorage.setItem('fm_master_' + L, JSON.stringify(j)); } catch (e) {} });
  })).then(function () {
    var dt = $('dl-tanto'); dt.innerHTML = '';
    ((マスタ['社員マスタ'] || {}).行 || []).forEach(function (r) { var o = document.createElement('option'); o.value = r['氏名']; dt.appendChild(o); });
  });
}
function 得意先名(code) { var m = マスタ['得意先マスタ']; if (!m) return ''; var h = m.行.filter(function (r) { return String(r['得意先コード']) === String(code); })[0]; return h ? h['得意先名'] : ''; }

// ---- 起動
(function () {
  FM.サインインのボタンを置く($('fm-signin'));
  function 名() { var m = FM.名乗っている(); $('fm-who').textContent = m ? ('FileMaker: ' + m) : ''; }
  名(); window.addEventListener('fm-signin', 名);
  行を描く(); 画面へ(null);
  $('new').onclick = 新規; $('save').onclick = 保存; $('del').onclick = 削除;
  $('print').onclick = function () { window.print(); };
  $('list').onchange = function () { 開く($('list').value); };
  $('f-date').addEventListener('change', function () { $('p-date').textContent = 和暦($('f-date').value); });
  window.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); 保存(); } });
  マスタを用意().then(一覧を読む).then(候補).then(function () {
    var q = new URLSearchParams(location.search);
    if (q.get('no')) { $('list').value = q.get('no'); 開く(q.get('no')); }
    else if (q.get('juchu')) { var tr = $('rows').querySelector('tr'); 置く(tr, '伝票番号', q.get('juchu')); 置く(tr, 'パーツ', '1'); 受注から埋める(tr); }
  });
})();
</script>
<script>window.KAIZEN_KEY = 'yoshi-chumon';</script>
<script src="kaizen.js"></script>
</body>
</html>
