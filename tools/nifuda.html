<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>荷札作成（ヤマウチ印刷／住友電装）| Tokiwa Hub</title>
<style>
  :root{ --ink:#0d0d0d; --bg:#f1efea; --line:#b8b3a6; --line2:#8f97a3; --sub:#33393f;
         --acc:#65a30d; --hd:#e6e3db; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif; font-size:12.5px; }
  .hubbar{ background:#0a0a0a; color:#fff; padding:9px 18px; display:flex; align-items:center; gap:12px; }
  .hubbar .logo{ font-weight:800; font-size:13px; } .hubbar .logo b{ color:#a3e635; }
  .hubbar .tname{ font-size:15px; font-weight:800; }
  .wrap{ margin:10px 14px 26px; background:#fff; border:1px solid var(--line);
         border-radius:10px; padding:10px 14px; }
  h2{ font-size:14px; margin:0 0 6px; border-left:3px solid var(--acc); padding-left:8px; }
  .note{ font-size:11.5px; color:var(--sub); line-height:1.7; margin-bottom:8px; }
  .bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;
        padding:7px 9px; background:#faf9f7; border:1px solid var(--line); border-radius:8px; }
  .fb{ font-size:11.5px; font-weight:700; padding:4px 12px; border:1.4px solid #6b6a64;
       border-radius:6px; background:#fff; cursor:pointer; font-family:inherit; }
  .fb.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .fb.p{ background:var(--ink); color:#fff; border-color:var(--ink); }
  label.lb{ font-size:11px; font-weight:800; color:var(--sub); }
  input,select{ font-family:inherit; font-size:12.5px; padding:3px 6px; border:1.4px solid #7b8695;
                border-radius:5px; background:#fff; }
  table.g{ border-collapse:collapse; width:100%; }
  table.g th,table.g td{ border:1px solid var(--line2); padding:3px 6px; }
  table.g th{ background:var(--hd); font-size:10.5px; font-weight:800; }
  table.g td input{ width:100%; border:none; padding:2px 4px; }
  table.g td.n input{ text-align:right; }

  /* ── 印刷面（A4横 297×210mm）── */
  #sheet{ position:relative; width:297mm; height:210mm; background:#fff;
          border:1px solid var(--line); margin:10px auto; }
  .lbl{ position:absolute; box-sizing:border-box; }
  .lbl .frame{ position:absolute; inset:0; border:1.2mm solid transparent; }
  .cell{ position:absolute; writing-mode:vertical-rl; text-orientation:upright;
         font-weight:700; white-space:pre-wrap; overflow:hidden; line-height:1.15; }
  body.daishi .frame, body.daishi .fixed{ display:none; }   /* 台紙モード＝枠と固定文字は出さない */
  @media print{
    @page{ size:A4 landscape; margin:0; }
    body{ background:#fff; }
    .hubbar,.wrap>h2,.wrap>.note,.bar,#editor{ display:none !important; }
    .wrap{ margin:0; border:0; border-radius:0; padding:0; }
    #sheet{ border:0; margin:0; }
  }
</style>
</head>
<body>
<div class="hubbar"><span class="logo">TOKIWA <b>HUB</b></span>
  <span class="tname">荷札作成（ヤマウチ印刷／住友電装）</span></div>
<div style="height:3px;background:#65a30d"></div>

<div class="wrap">
  <h2>品名と数量を入れて、台紙に印刷します</h2>
  <div class="note">
    スキャンした台紙（A4横）から実寸を測って作っています。上段＝<b>ヤマウチ印刷（緑枠・水色台紙）5枚</b>、
    下段＝<b>住友電装株式会社 御中（黒枠・黄色台紙）5枚</b>。<br>
    <b>台紙モード</b>＝すでに印刷された台紙に重ねて、品名・数量だけを刷ります。
    <b>全面モード</b>＝枠も文字も全部刷るので、白紙にそのまま出せます。<br>
    刷ってみて位置がずれたら、<b>ヨコ調整・タテ調整</b>をmmで動かしてください（この端末に覚えます）。
  </div>

  <div class="bar" id="editor">
    <button class="fb on" id="m-daishi" onclick="setMode('daishi')">台紙モード</button>
    <button class="fb" id="m-full" onclick="setMode('full')">全面モード</button>
    <span style="width:8px"></span>
    <label class="lb">ヨコ調整</label><input id="ox" type="number" step="0.5" value="0" style="width:70px" oninput="draw()"><span class="lb">mm</span>
    <label class="lb">タテ調整</label><input id="oy" type="number" step="0.5" value="0" style="width:70px" oninput="draw()"><span class="lb">mm</span>
    <label class="lb">文字の大きさ</label><input id="fs" type="number" step="0.5" value="4.5" style="width:70px" oninput="draw()"><span class="lb">mm</span>
    <span style="margin-left:auto"></span>
    <button class="fb" onclick="fillAll()">1枚目を全部にコピー</button>
    <button class="fb" onclick="clearAll()">全部消す</button>
    <button class="fb p" onclick="window.print()">🖨 印刷</button>
  </div>

  <div id="editor2">
    <table class="g">
      <thead><tr><th style="width:34px"></th>
        <th>上段：ヤマウチ印刷　品名</th><th style="width:110px">数量</th>
        <th>下段：住友電装 御中　品名</th><th style="width:110px">数量</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="sheet"></div>
</div>

<script>
// ── スキャン（A4横 297×210mm・150dpi）から測った実寸 ──
// 上段: 水色台紙 左89.7 上21.2 / 192.0×77.0、枠は 幅28.0×高60.9、ピッチ38.1、1枚目左96.5 上28.8
// 下段: 黄色台紙 左64.9 上116.8 / 215.7×75.4、枠は 幅32.0×高60.1、ピッチ43.1、1枚目左71.5 上124.5
var BANDS = [
  { key:'up', n:5, x:96.5, y:28.8, w:28.0, h:60.9, pitch:38.1,
    color:'#1f7a3a', paper:'#cfeaf5', fixed:'ヤマウチ印刷',
    // 枠の中を右から: 品名ラベル / 数量ラベル / 記入欄
    colName:{ off:0.0,  w:6.5 },   // 「品名」の見出し（右端から）
    colQty :{ off:6.5,  w:6.5 },   // 「数量」の見出し
    inName :{ off:13.5, w:7.0 },   // 品名を書く場所
    inQty  :{ off:20.5, w:7.0 },   // 数量を書く場所
    fixedAt:{ off:0, side:'left', w:7.0 } },
  { key:'lo', n:5, x:71.5, y:124.5, w:32.0, h:60.1, pitch:43.1,
    color:'#1a1a1a', paper:'#fdf3c0', fixed:'ヤマウチ印刷', head:'住友電装株式会社 御中',
    colName:{ off:4.5,  w:6.0 },
    colQty :{ off:10.5, w:6.0 },
    inName :{ off:16.5, w:7.5 },
    inQty  :{ off:24.0, w:7.5 },
    fixedAt:{ off:0, side:'left', w:7.5 } }
];

var KEY = 'nifuda_v1';
var D = { mode:'daishi', ox:0, oy:0, fs:4.5, up:[], lo:[] };
try{ var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if(sv) D = Object.assign(D, sv); }catch(e){}
for(var i=0;i<5;i++){ D.up[i] = D.up[i] || {name:'',qty:''}; D.lo[i] = D.lo[i] || {name:'',qty:''}; }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} }

function setMode(m){
  D.mode = m; save();
  document.body.classList.toggle('daishi', m === 'daishi');
  document.getElementById('m-daishi').classList.toggle('on', m === 'daishi');
  document.getElementById('m-full').classList.toggle('on', m === 'full');
  draw();
}
function rows(){
  var h = '';
  for(var i=0;i<5;i++){
    h += '<tr><td style="text-align:center;font-weight:800">' + (i+1) + '</td>'
      + '<td><input value="' + esc(D.up[i].name) + '" oninput="ed(\'up\',' + i + ',\'name\',this.value)"></td>'
      + '<td class="n"><input value="' + esc(D.up[i].qty) + '" oninput="ed(\'up\',' + i + ',\'qty\',this.value)"></td>'
      + '<td><input value="' + esc(D.lo[i].name) + '" oninput="ed(\'lo\',' + i + ',\'name\',this.value)"></td>'
      + '<td class="n"><input value="' + esc(D.lo[i].qty) + '" oninput="ed(\'lo\',' + i + ',\'qty\',this.value)"></td></tr>';
  }
  document.getElementById('rows').innerHTML = h;
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function ed(band, i, k, v){ D[band][i][k] = v; save(); draw(); }
function fillAll(){
  ['up','lo'].forEach(function(b){
    for(var i=1;i<5;i++){ D[b][i] = { name:D[b][0].name, qty:D[b][0].qty }; }
  });
  save(); rows(); draw();
}
function clearAll(){
  if(!confirm('入力した品名・数量を全部消します。よろしいですか？')) return;
  ['up','lo'].forEach(function(b){ for(var i=0;i<5;i++) D[b][i]={name:'',qty:''}; });
  save(); rows(); draw();
}

function draw(){
  D.ox = parseFloat(document.getElementById('ox').value) || 0;
  D.oy = parseFloat(document.getElementById('oy').value) || 0;
  D.fs = parseFloat(document.getElementById('fs').value) || 4.5;
  save();
  var sh = document.getElementById('sheet');
  var h = '';
  BANDS.forEach(function(b){
    var data = D[b.key];
    for(var i=0;i<b.n;i++){
      var L = b.x + b.pitch * i + D.ox, T = b.y + D.oy;
      h += '<div class="lbl" style="left:' + L + 'mm;top:' + T + 'mm;width:' + b.w + 'mm;height:' + b.h + 'mm">'
        + '<div class="frame" style="border-color:' + b.color + ';background:' + b.paper + '"></div>';
      // 台紙にすでに刷ってある固定文字（全面モードだけ出す）
      if(b.head){
        h += cell(b.w - 4.5, 0, 4.5, b.h, b.head, b.color, 'fixed', 3.6);
      }
      h += cell(0, 0, b.fixedAt.w, b.h, b.fixed, b.color, 'fixed', 3.4);
      h += cell(b.w - b.colName.off - b.colName.w, 0, b.colName.w, 14, '品名', b.color, 'fixed', 3.6);
      h += cell(b.w - b.colQty.off  - b.colQty.w,  0, b.colQty.w,  14, '数量', b.color, 'fixed', 3.6);
      // 実際に入れる中身
      h += cell(b.w - b.inName.off - b.inName.w, 2, b.inName.w, b.h - 4, data[i].name, '#000', 'val', D.fs);
      h += cell(b.w - b.inQty.off  - b.inQty.w,  2, b.inQty.w,  b.h - 4, data[i].qty,  '#000', 'val', D.fs);
      h += '</div>';
    }
  });
  sh.innerHTML = h;
}
function cell(x, y, w, hh, txt, col, cls, fs){
  if(!txt) return '';
  return '<div class="cell ' + cls + '" style="right:auto;left:' + x + 'mm;top:' + y + 'mm;width:' + w
       + 'mm;height:' + hh + 'mm;color:' + col + ';font-size:' + fs + 'mm">' + esc(txt) + '</div>';
}

document.getElementById('ox').value = D.ox;
document.getElementById('oy').value = D.oy;
document.getElementById('fs').value = D.fs;
rows();
setMode(D.mode);
</script>
</body>
</html>
