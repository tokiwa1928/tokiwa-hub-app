<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FileMaker の項目しらべ | Tokiwa Hub Tools</title>
<!-- SHIRABE-1（本多さん 10/1「やっぱり FileMaker 直らない」の調べ用）: 伝票番号を入れると、FileMaker のレイアウトの項目名と値をそのまま出す。読むだけ。
     「ある言葉が入っている項目はどれか」を探せるので、画面に見えている値がどの項目から来ているか分かる -->
<style>
  body{ margin:0; background:#f4f3f0; color:#1c1b18; font-family:'Yu Gothic UI','Yu Gothic','Meiryo',sans-serif; font-size:14px; }
  header{ background:#1c1b18; color:#fff; padding:8px 16px; display:flex; gap:12px; align-items:center; } header a{ color:#d9f99d; font-weight:700; text-decoration:none; } header h1{ font-size:15px; margin:0; }
  main{ max-width:1000px; margin:14px auto; padding:0 16px; }
  .box{ background:#fff; border:1px solid #e0ddd6; border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  input, select{ font:inherit; padding:6px 9px; border:1px solid #cfcbc2; border-radius:6px; } button{ font:inherit; padding:6px 14px; border:1px solid #3f6212; background:#3f6212; color:#fff; border-radius:7px; font-weight:700; cursor:pointer; }
  table{ border-collapse:collapse; width:100%; font-size:12.5px; } td{ border-bottom:1px solid #f0ede7; padding:3px 6px; vertical-align:top; } td:first-child{ white-space:nowrap; font-weight:700; width:220px; }
  .hit{ background:#fef3c7; } .note{ font-size:12px; color:#6f6c66; } #msg{ color:#b3261e; font-weight:700; }
</style>
<link rel="stylesheet" href="hub-square.css"><link rel="stylesheet" href="hub-theme.css">
</head>
<body>
<header><a href="../index.html">← Hub</a><h1>FileMaker の項目しらべ（読むだけ）</h1><span id="signin"></span></header>
<main>
  <div class="box">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <label>レイアウト <input id="lay" value="受注データ" style="width:160px" list="dl-lay"></label><datalist id="dl-lay"></datalist>
      <label>伝票番号 <input id="no" value="" style="width:120px"></label>
      <label>この言葉が入っている項目 <input id="q" value="" style="width:160px" placeholder="例: 赤坂"></label>
      <button id="go">しらべる</button>
      <label class="note"><input type="checkbox" id="all"> 全部の項目を出す</label>
      <button id="patrol" type="button" style="background:#9a5b06;border-color:#9a5b06" title="外注データの 外注コード と 会社名 が食い違っている伝票（新しい 300 件）を、外注先マスタのコードに合わせて直します。本多さん・福永さんだけ">外注の見回りを今まわす</button>
    </div>
    <p class="note">FileMaker の中身を読むだけで、何も書きません。言葉を入れると、その言葉が入っている項目に色が付きます。レイアウトは Data API に出ているものだけ（受注データA のような画面用レイアウトは出ていません。受注データ・Hub受注・外注データ を使ってください）。</p>
    <div id="msg"></div>
  </div>
  <div class="box" id="out"></div>
</main>
<script src="fm-bridge.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }; var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  try { FM.サインインのボタンを置く($('signin')); } catch (e) {}
  // レイアウトの候補（Data API に出ているもの）
  try { FM.呼ぶ('layouts', []).then(function (ls) { var flat = []; (function walk(a) { (a || []).forEach(function (l) { if (l.folderLayoutNames) walk(l.folderLayoutNames); else flat.push(l.name); }); })(ls); document.getElementById('dl-lay').innerHTML = flat.map(function (n) { return '<option value="' + esc(n) + '">'; }).join(''); }).catch(function () {}); } catch (e) {}
  // GAICHU-CODE-3: 15 分ごとの見回りを手で 1 回まわす（結果がその場で見える）
  $('patrol').onclick = async function () {
    $('msg').textContent = ''; $('out').innerHTML = '見回っています（新しい伝票 300 件）…';
    try { var r = await FM.呼ぶ('外注_見回り', []); var d = r.直した || [];
      $('out').innerHTML = '<p class="note">15 分ごとの見回り: ' + (r.トリガー ? '入っています' : '<b style="color:#b3261e">入っていません</b>') + '　／　今回そろえた伝票 ' + d.length + ' 件</p>' + (d.length ? '<table>' + d.map(function (x) { return '<tr><td colspan="2">' + esc(x) + '</td></tr>'; }).join('') + '</table>' : '');
    } catch (e) { $('msg').textContent = String(e.message || e); $('out').innerHTML = ''; }
  };
  $('go').onclick = async function () {
    var lay = $('lay').value.trim(), no = $('no').value.trim(), q = $('q').value.trim(); $('msg').textContent = ''; $('out').innerHTML = '読んでいます…';
    if (!lay || !no) { $('msg').textContent = 'レイアウトと伝票番号を入れてください'; $('out').innerHTML = ''; return; }
    try {
      var r = await FM.呼ぶ('layoutFind', [lay, [{ '伝票番号': '==' + no }], 2]);
      var recs = r.records || []; if (!recs.length) { $('out').innerHTML = '見つかりません（' + esc(lay) + ' に 伝票番号 ' + esc(no) + ' が無いか、このレイアウトに伝票番号の項目がありません）'; return; }
      var f = recs[0].fields || {}; var keys = Object.keys(f); var ql = q.toLowerCase();
      var rows = keys.filter(function (k) { var v = String(f[k] == null ? '' : f[k]); if (!$('all').checked && !v) return false; return !q || v.toLowerCase().indexOf(ql) >= 0 || !$('all').checked; });
      var hits = keys.filter(function (k) { return q && String(f[k] == null ? '' : f[k]).toLowerCase().indexOf(ql) >= 0; });
      var h = '<p class="note">レイアウト ' + esc(lay) + '　recordId ' + esc(recs[0].recordId) + '　項目 ' + keys.length + ' 個' + (q ? '　「' + esc(q) + '」が入っている項目: <b>' + (hits.length ? hits.map(esc).join('、') : '無し') + '</b>' : '') + '</p>';
      h += '<table>' + keys.filter(function (k) { var v = String(f[k] == null ? '' : f[k]); return $('all').checked || v; }).map(function (k) { var v = String(f[k] == null ? '' : f[k]); var hit = q && v.toLowerCase().indexOf(ql) >= 0; return '<tr' + (hit ? ' class="hit"' : '') + '><td>' + esc(k) + '</td><td>' + esc(v).slice(0, 300) + '</td></tr>'; }).join('') + '</table>';
      var pd = recs[0].portalData; if (pd && Object.keys(pd).length) h += '<p class="note">ポータル: ' + esc(JSON.stringify(pd)).slice(0, 2000) + '</p>';
      $('out').innerHTML = h;
    } catch (e) { $('msg').textContent = String(e.message || e); $('out').innerHTML = ''; }
  };
})();
</script>
</body>
</html>
