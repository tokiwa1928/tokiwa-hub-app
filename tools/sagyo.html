<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>指示書 | Tokiwa Hub</title>
<style>
  /* FileMaker の「作業指示書」（A4 縦）と同じ並び。画面では上に操作、印刷では紙だけ */
  body{ margin:0; font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif; background:#e5e7eb; color:#111; }
  #bar{ background:#0d0d0d; color:#e5e7eb; padding:6px 14px; display:flex; gap:10px; align-items:center; font-size:13px; flex-wrap:wrap; }
  #bar a{ color:#93c5fd; text-decoration:none; }
  #bar input{ font-size:13px; padding:3px 6px; border:1px solid #64748b; border-radius:4px; width:120px; }
  #bar button{ font-size:13px; padding:3px 12px; border:1px solid #cbd5e1; border-radius:4px; background:#fff; color:#111; cursor:pointer; }
  #bar .st{ color:#fbbf24; }
  #paper{ width:210mm; min-height:297mm; margin:12px auto; background:#fff; padding:14mm 12mm 12mm; box-sizing:border-box; font-size:10.5pt; box-shadow:0 2px 10px rgba(0,0,0,.2); }
  h1{ text-align:center; font-size:18pt; font-weight:500; letter-spacing:.15em; margin:0 0 4mm; }
  .date{ text-align:right; font-size:10pt; margin-bottom:6mm; padding-right:6mm; }
  table{ border-collapse:collapse; width:100%; table-layout:fixed; }
  td,th{ border:1px solid #000; padding:1.2mm 1.5mm; font-size:9.5pt; line-height:1.25; vertical-align:middle; overflow:hidden; }
  th{ font-weight:400; text-align:center; background:#fff; }
  .lbl{ width:20mm; text-align:left; }
  .c{ text-align:center; } .l{ text-align:left; } .r{ text-align:right; }
  .thick{ border-width:2px; }
  .box{ border:2px solid #000; }
  .small{ font-size:8pt; } .tiny{ font-size:7pt; }
  .foot{ margin-top:5mm; margin-left:auto; width:70mm; font-size:9.5pt; line-height:1.55; }
  /* SEIZO-1: 製造指示書（作業伝票）用 */
  #paper.seizo{ padding:8mm 8mm 8mm; font-size:9pt; }
  #paper.seizo table{ table-layout:fixed; }
  #paper.seizo td, #paper.seizo th{ padding:0.35mm 0.7mm; font-size:7.8pt; line-height:1.12; height:4.3mm; white-space:normal; word-break:break-all; overflow-wrap:anywhere; overflow:visible; vertical-align:middle; }
  #paper.seizo th{ font-size:7.5pt; line-height:1.1; }
  #paper.seizo td.r, #paper.seizo td.rn{ white-space:nowrap; }
  #paper.seizo .lbl{ width:auto; background:#fff; font-size:7.2pt; line-height:1.1; text-align:left; }
  #paper.seizo .sheet{ height:281mm; overflow:hidden; box-sizing:border-box; }
  #paper.seizo .sheet.back{ height:auto; min-height:281mm; page-break-before:always; break-before:page; page-break-after:auto; break-after:auto; }
  #paper.seizo .back table{ margin-top:2mm; }
  #paper.seizo .back td, #paper.seizo .back th{ height:auto; font-size:8.5pt; padding:0.8mm 1.2mm; }
  #paper.seizo .back h1{ font-size:12pt; letter-spacing:.2em; }
  .chg{ text-decoration:underline; text-decoration-style:double; text-underline-offset:1px; }
  /* 印刷: 表面 1 枚＝用紙ぴったりだと丸めで 2 枚目に白紙が出るので、少し余らせる。裏面は中身の分だけ */
  @media print{
    #paper.seizo{ padding:6mm 8mm 5mm; }
    #paper.seizo .sheet{ height:282mm; overflow:hidden; page-break-after:always; break-after:page; }
    #paper.seizo .sheet:last-child{ page-break-after:auto; break-after:auto; }
    #paper.seizo .sheet.back{ height:auto; min-height:0; page-break-before:always; break-before:page; }
    html, body{ height:auto; }
  }
  #paper.seizo .rn{ text-align:center; font-size:7.5pt; color:#333; }
  #paper.seizo .sec{ margin-top:2mm; }
  .chg{ color:#c00; font-weight:700; }   /* モノクロでも分かるよう、下は二重下線も付ける */
  #rec{ display:flex; justify-content:space-between; align-items:flex-start; gap:6mm; margin:0 0 2mm; font-size:8.5pt; }
  #rec .cmt{ color:#c00; font-weight:700; white-space:pre-wrap; }
  #rec .hist{ color:#555; font-size:7.5pt; }
  #paper.seizo h1{ font-size:12pt; letter-spacing:.3em; margin:0 0 1.2mm; }
  #paper.seizo #rec{ margin:0 0 1.2mm; font-size:8pt; }
  #paper.seizo .sec{ margin-top:1.4mm; }
  .sheet{ page-break-after:always; break-after:page; }
  .sheet:last-child{ page-break-after:auto; break-after:auto; }
  .testmark{ border:2px solid #c00; color:#c00; font-weight:700; text-align:center; padding:1mm; margin:0 0 2mm; font-size:11pt; letter-spacing:.2em; }
  @media print{ body{ background:#fff; } #bar{ display:none; } #paper{ margin:0; box-shadow:none; width:auto; min-height:auto; padding:10mm 10mm 8mm; } @page{ size:A4 portrait; margin:0; } }
</style>
</head>
<body>
<div id="bar">
  <a href="fm-juchu-hub.html" onclick="var n=(document.getElementById('no')||{}).value; if(n){ this.href='fm-juchu-hub.html?no='+encodeURIComponent(n.trim()); }">← 受注入力</a>
  <b id="kind-label">外注指示書</b>
  <span style="display:inline-flex;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden;margin-left:6px">
    <button type="button" id="k-gaichu" onclick="種類を変える('gaichu')" style="border:0;padding:3px 10px;cursor:pointer;background:#1a1a1a;color:#fff">外注</button>
    <button type="button" id="k-seizo" onclick="種類を変える('seizo')" style="border:0;padding:3px 10px;cursor:pointer;background:#fff">製造</button>
  </span>
  <input id="no" placeholder="伝票番号" autocomplete="off">
  <button id="go">出す</button>
  <button id="pr" title="製造指示書は、印刷するたびに 第N回・日時・誰が・変更コメント を記録します">🖨 印刷</button>
  <button id="pt" title="記録を残さずに印刷します（紙に「テスト出力」の帯が入ります）" style="border-color:#f87171;color:#b91c1c">🧪 テスト出力</button>
  <span class="st" id="st"></span>
  <span style="margin-left:auto" id="fm-who"></span><span id="fm-signin"></span>
</div>
<div id="paper"><div style="text-align:center;color:#9ca3af;padding-top:60mm">伝票番号を入れて「出す」</div></div>

<script src="fm-bridge.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
// SAGYO-2: 指示書の種類。gaichu＝外注指示書（FileMaker と同じ紙）／seizo＝製造指示書（内製用）
var 種類 = 'gaichu', 直近 = null;
function 種類を変える(k) { 種類 = (k === 'seizo') ? 'seizo' : 'gaichu';
  $('kind-label').textContent = 種類 === 'seizo' ? '製造指示書' : '外注指示書';
  $('k-gaichu').style.background = 種類 === 'gaichu' ? '#1a1a1a' : '#fff'; $('k-gaichu').style.color = 種類 === 'gaichu' ? '#fff' : '#1a1a1a';
  $('k-seizo').style.background = 種類 === 'seizo' ? '#1a1a1a' : '#fff'; $('k-seizo').style.color = 種類 === 'seizo' ? '#fff' : '#1a1a1a';
  try { var u = new URL(location.href); if (種類 === 'seizo') u.searchParams.set('type', 'seizo'); else u.searchParams.delete('type'); history.replaceState(null, '', u); } catch (e) {}
  if (直近) 描く(直近);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function 数(v) { var x = Number(v); return (v === '' || v == null || isNaN(x)) ? '' : x.toLocaleString(); }
function 和暦(d) { var y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), dd = ('0' + d.getDate()).slice(-2); var r = y - 2018; return '令和' + (r === 1 ? '元' : r) + '年' + m + '月' + dd + '日'; }

// ---- マスタ（保管庫の json。24 時間はこの PC に置く）
var マスタ = {};
function マスタを用意() {
  var need = ['得意先マスタ', '社員マスタ'];
  return Promise.all(need.map(function (L) {
    try { var c = JSON.parse(localStorage.getItem('fm_master_' + L) || 'null'); if (c && c.取った && Date.now() - new Date(c.取った).getTime() < 24 * 3600 * 1000) { マスタ[L] = c; return; } } catch (e) {}
    return FM.呼ぶ('マスタ_配る', [L]).then(function (j) { j.取った = new Date().toISOString(); マスタ[L] = j; try { localStorage.setItem('fm_master_' + L, JSON.stringify(j)); } catch (e) {} });
  }));
}
function 得意先名(code) { var m = マスタ['得意先マスタ']; if (!m) return ''; var h = m.行.filter(function (r) { return String(r['得意先コード']) === String(code); })[0]; return h ? h['得意先名'] : ''; }
function 社員名(code) { var m = マスタ['社員マスタ']; if (!m) return ''; var h = m.行.filter(function (r) { return String(r['社員コード']) === String(code); })[0]; return h ? h['氏名'] : ''; }

// ---- 紙を描く（FileMaker の作業指示書テーブルと同じ対応: 色数裏=色MAX、バック/カーボン色=スポット色、穴=ファイル穴、左中右=マージナルパンチa/b/c）
function 描く(f) {
  直近 = f;
  if (種類 === 'seizo') { 製造を描く(f); return; }
  $('paper').className = '';
  var パーツ = [1, 2, 3, 4, 5];
  function row(n) { return n === '表紙' ? 0 : n; }
  function v(k, n) { var x = f[k + row(n)]; return (x == null) ? '' : String(x); }
  var h = '<h1>外注指示書</h1><div class="date">' + 和暦(new Date()) + '</div>';
  h += '<table class="box">'
    + '<tr><td class="lbl">伝票番号</td><td colspan="8" class="c">' + esc(f['伝票番号']) + '</td></tr>'
    + '<tr><td class="lbl">得意先名</td><td colspan="8" class="c">' + esc(得意先名(f['得意先コード'])) + '</td></tr>'
    + '<tr><td class="lbl">ユーザ名</td><td colspan="8" class="c">' + esc(f['ユーザー名']) + '</td></tr>'
    + '<tr><td class="lbl">品名</td><td colspan="8" class="c">' + esc(f['製品名']) + '</td></tr>'
    + '<tr><td class="lbl">パーツ数</td><td colspan="8" class="c">' + esc(f['パーツ数']) + '</td></tr>'
    + '<tr><td class="lbl" rowspan="2">サイズ</td><td colspan="8"><span style="display:inline-block;width:14mm">(mm)</span><span style="display:inline-block;width:60mm;text-align:right">横　' + esc(f['サイズ横']) + '　×　縦　' + esc(f['サイズ縦']) + '</span></td></tr>'
    + '<tr><td colspan="8"><span style="display:inline-block;width:14mm">(in)</span><span style="display:inline-block;width:60mm;text-align:right">' + esc(f['横1'] || '-') + ' / ' + esc(f['縦1'] || '-') + '</span></td></tr>'
    + '<tr><td class="lbl">契約数量</td><td colspan="8" class="c">' + esc(数(f['ロット契約単位'])) + '　　' + esc(f['単位']) + '</td></tr>'
    + '<tr><td class="lbl">セット数</td><td colspan="8" class="c">' + esc(数(f['ロットセット数'])) + '</td></tr>'
    + '<tr><td class="lbl">仕様変更</td><td colspan="2" class="c">' + esc(f['仕様変更']) + '</td><td class="c" colspan="2">版下変更</td><td colspan="2" class="c">' + esc(f['版下変更']) + '</td><td colspan="2"></td></tr>'
    + '</table>';
  // 紙情報・印刷
  h += '<table class="box" style="margin-top:-1px"><colgroup><col style="width:20mm"><col style="width:38mm"><col style="width:9mm"><col style="width:12mm"><col style="width:7mm"><col style="width:7mm"><col style="width:14mm"><col style="width:14mm"><col style="width:9mm"><col style="width:9mm"><col style="width:9mm"><col style="width:9mm"><col style="width:9mm"></colgroup>'
    + '<tr><th rowspan="3"></th><th rowspan="3">紙情報</th><th rowspan="3">版下</th><th rowspan="3" class="tiny">バック<br>カーボン色</th><th colspan="9">印刷</th></tr>'
    + '<tr><th colspan="2">色数</th><th colspan="2">インキ</th><th rowspan="2">減感</th><th colspan="4">ナンバリング</th></tr>'
    + '<tr><th>表</th><th>裏</th><th>表</th><th>裏</th><th>種類</th><th>書体</th><th>桁数</th><th>色</th></tr>';
  パーツ.concat(['表紙']).forEach(function (n) {
    h += '<tr><td class="l">' + (n === '表紙' ? '表紙' : n + 'パーツ目') + '</td><td class="c">' + esc(v('紙質', n)) + '</td><td class="c">' + esc(v('版下', n)) + '</td><td class="c small">' + esc(v('スポット色', n)) + '</td>'
      + '<td class="c">' + esc(v('色数', n)) + '</td><td class="c">' + esc(v('色MAX', n)) + '</td><td class="c">' + esc(v('インキ表', n)) + '</td><td class="c">' + esc(v('インキ裏', n)) + '</td><td class="c">' + esc(v('減感', n)) + '</td>'
      + '<td class="c">' + esc(v('種類', n)) + '</td><td class="c">' + esc(v('書体', n)) + '</td><td class="c">' + esc(v('桁数', n)) + '</td><td class="c">' + esc(v('色', n)) + '</td></tr>';
  });
  h += '</table>';
  // 加工
  h += '<table class="box" style="margin-top:-1px"><colgroup><col style="width:20mm"><col style="width:6mm"><col style="width:6mm"><col style="width:6mm"><col style="width:9mm"><col style="width:8mm"><col style="width:10mm"><col style="width:10mm"><col style="width:10mm"><col style="width:10mm"><col></colgroup>'
    + '<tr><th rowspan="3"></th><th colspan="9">加工</th><th rowspan="3">備考</th></tr>'
    + '<tr><th colspan="3" class="tiny">ﾏｰｼﾞﾅﾙﾊﾟﾝﾁ</th><th rowspan="2" class="small">ﾌｧｲﾙ</th><th rowspan="2">穴</th><th rowspan="2" class="small">横ﾐｼﾝ</th><th rowspan="2" class="tiny">中間<br>横ﾐｼﾝ</th><th rowspan="2" class="small">縦ﾐｼﾝ</th><th rowspan="2" class="tiny">中間<br>縦ﾐｼﾝ</th></tr>'
    + '<tr><th>左</th><th>中</th><th>右</th></tr>';
  パーツ.concat(['表紙']).forEach(function (n) {
    h += '<tr><td class="l">' + (n === '表紙' ? '表紙' : n + 'パーツ目') + '</td><td class="c">' + esc(v('マージナルパンチa', n)) + '</td><td class="c">' + esc(v('マージナルパンチb', n)) + '</td><td class="c">' + esc(v('マージナルパンチc', n)) + '</td>'
      + '<td class="c">' + esc(v('ファイル', n)) + '</td><td class="c">' + esc(v('ファイル穴', n)) + '</td><td class="c">' + esc(v('横ミシン', n)) + '</td><td class="c">' + esc(v('中間横ミシン', n)) + '</td><td class="c">' + esc(v('縦ミシン', n)) + '</td><td class="c">' + esc(v('中間縦ミシン', n)) + '</td>'
      + '<td class="l small">' + esc(v('備考', n)) + '</td></tr>';
  });
  h += '</table>';
  // 下段
  var 箱 = [f['箱サイズ横'], f['箱サイズ縦'], f['箱サイズ高さ']].map(function (x) { return x == null ? '' : String(x); });
  h += '<table class="box" style="margin-top:-1px"><colgroup><col style="width:20mm"><col style="width:30mm"><col style="width:20mm"><col></colgroup>'
    + '<tr><td class="lbl">ナンバー自</td><td>' + esc(f['ナンバー自']) + '</td><td class="lbl">ナンバー至</td><td>' + esc(f['ナンバー至']) + '</td></tr>'
    + '<tr><td class="lbl">製本加工</td><td colspan="3" class="small">' + esc(f['製本加工']) + '</td></tr>'
    + '<tr><td class="lbl">内部備考</td><td colspan="3" class="small">' + esc(f['内装備考']) + '</td></tr>'
    + '<tr><td class="lbl">カートン型式</td><td colspan="3">' + esc(f['カートン型式']) + '</td></tr>'
    + '<tr><td class="lbl">カートン</td><td colspan="3">' + esc(f['カートン']) + '</td></tr>'
    + '<tr><td class="lbl">箱数</td><td colspan="3">' + esc(f['箱数']) + '</td></tr>'
    + '<tr><td class="lbl">箱サイズ</td><td colspan="3">' + esc(箱[0]) + '　×　' + esc(箱[1]) + '　×　' + esc(箱[2]) + '</td></tr>'
    + '<tr><td class="lbl">備考</td><td colspan="3" class="small">' + esc(f['備考']) + '</td></tr>'
    + '</table>';
  h += '<div class="foot">ご不明な点は下記担当者までご連絡下さい。<br>トキワ印刷株式会社<br>〒432-8053<br>静岡県浜松市中央区法枝町115<br>TEL:  053-441-2784<br>FAX:  053-442-1265<br>mail:<br>担当: ' + esc(社員名(f['担当者コード'])) + '</div>';
  $('paper').innerHTML = h;
}

// ---- 製造指示書＝社内の作業伝票（211110 の紙と同じ並び）。SEIZO-1
var 外注行 = [];          // 画面_外注 の行（会社名・発注内容・数量・単価・合計）
var 今の写し = null;       // いま描いた内容（出力記録に残す）
var 前回の記録 = null;     // この伝票の直前の出力記録（変更の赤字に使う）
var 記録一覧 = [];         // この伝票の出力記録（古い順）
// 本体の DB（IndexedDB tokiwa_hub_local/kv/db、無ければ localStorage murayama_v15）から 製造指示書の出力記録を読む
function 本体DBを読む() {
  return new Promise(function (res) {
    try {
      var r = indexedDB.open('tokiwa_hub_local', 1);
      r.onupgradeneeded = function (e) { try { var d = e.target.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); } catch (x) {} };
      r.onsuccess = function () { try { var d = r.result; var tx = d.transaction('kv', 'readonly'); var q = tx.objectStore('kv').get('db');
        q.onsuccess = function () { var v = q.result; d.close(); if (v && v.json) { try { res(JSON.parse(v.json)); return; } catch (e) {} } res(null); };
        q.onerror = function () { d.close(); res(null); }; } catch (e) { res(null); } };
      r.onerror = function () { res(null); };
    } catch (e) { res(null); }
  }).then(function (db) {
    if (db) return db;
    try { return JSON.parse(localStorage.getItem('murayama_v15') || 'null'); } catch (e) { return null; }
  });
}
function 出力記録を読む(no) {
  return 本体DBを読む().then(function (db) {
    var out = [];
    ((db && db.sagyoPrints) || []).forEach(function (r) { if (r && String(r.fmNo) === String(no) && (r.kind || 'seizo') === 'seizo') out.push(r); });
    try { (JSON.parse(localStorage.getItem('fm_sagyo_pending') || '[]')).forEach(function (r) { if (r && String(r.fmNo) === String(no) && !out.some(function (x) { return x.id === r.id; })) out.push(r); }); } catch (e) {}
    out.sort(function (a, b) { return String(a.at || '').localeCompare(String(b.at || '')); });
    return out;
  });
}
function 日時(iso) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return String(iso); return d.getFullYear() + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function 製造HTML(f) {
  var snap = {}; 今の写し = snap;
  var prev = 前回の記録 && 前回の記録.snap ? 前回の記録.snap : null;
  // V(鍵, 値, 表示) … 写しに入れ、前回と違えば赤字
  function V(key, val, disp) { val = (val == null) ? '' : String(val); snap[key] = val; var d = (disp == null) ? val : disp; var chg = prev && ((prev[key] == null ? '' : String(prev[key])) !== val); return '<span class="' + (chg ? 'chg' : '') + '">' + esc(d) + '</span>'; }
  function N(key, val) { return V(key, val, 数(val)); }
  function F(k) { return V(k, f[k]); }
  function Fn(k) { return N(k, f[k]); }
  function P(k, n) { var key = k + (n === '表紙' ? 0 : n); return V(key, f[key]); }
  function Pn(k, n) { var key = k + (n === '表紙' ? 0 : n); return N(key, f[key]); }
  function nm(n) { return n === '表紙' ? '表紙' : ('0' + n); }
  var 得 = 得意先名(f['得意先コード']);
  var h = '<h1>製造指示書</h1>';
  // 出力記録の帯（画面と紙の両方に出す）
  var n回 = 記録一覧.length;
  var last = 記録一覧[n回 - 1] || null;
  h += '<div id="rec"><div>'

    q.push(rec); c.記録一覧 = c.記録一覧.concat([rec]);
  });
  try { localStorage.setItem('fm_sagyo_pending', JSON.stringify(q)); } catch (e) { alert('記録を置けませんでした（保存領域がいっぱいです）。印刷だけします'); }
  try { new BroadcastChannel('tokiwa-hub-tools').postMessage({ type: 'sagyo' }); } catch (e) {}
  束を描く();   // 帯に 第N回 を出してから印刷（赤字は前回比のまま）
  束.forEach(function (c) { c.前回の記録 = c.記録一覧[c.記録一覧.length - 1]; });
  $('st').textContent = 束.length + ' 件を記録しました';
  setTimeout(function () { window.print(); }, 200);
}
function 記録して印刷() {
  if (テスト) { window.print(); return; }
  if (束 && 種類 === 'seizo') { 束を記録して印刷(); return; }
  if (種類 !== 'seizo' || !直近 || !今の写し) { window.print(); return; }
  var no = String(直近['伝票番号'] || ''); if (!no) { window.print(); return; }
  var chg = 変更点(前回の記録 && 前回の記録.snap, 今の写し);
  var 案 = chg.map(function (c) { return 項目の表示名(c.k) + ': ' + (c.before || '（空）') + ' → ' + (c.after || '（空）'); }).join('、');
  var msg = 記録一覧.length ? ('第' + (記録一覧.length + 1) + '回の出力です。前回（第' + 記録一覧.length + '回・' + 日時(前回の記録.at) + '）からの変更をコメントに残します。\n' + (chg.length ? '自動で見つけた変更 ' + chg.length + ' 項目が入っています。書き足して OK を押してください。' : '自動で見つけた変更はありません。あれば書いてください。'))
                          : '第 1 回の出力です。コメントがあれば書いてください（空でも OK）。';
  var cmt = prompt(msg, 案); if (cmt === null) { $('st').textContent = '印刷をやめました（記録していません）'; return; }
  var who = ''; try { who = FM.名乗っている() || ''; } catch (e) {}
  var rec = { id: 'SGP' + Date.now() + Math.floor(Math.random() * 1000), fmNo: no, kind: 'seizo', n: 記録一覧.length + 1, at: new Date().toISOString(), by: who,
              comment: String(cmt || '').trim(), changes: chg.slice(0, 200), snap: 今の写し, custName: String(得意先名(直近['得意先コード']) || ''), prodName: String(直近['製品名'] || '') };
  var q = []; try { q = JSON.parse(localStorage.getItem('fm_sagyo_pending') || '[]'); } catch (e) { q = []; }
  q.push(rec); try { localStorage.setItem('fm_sagyo_pending', JSON.stringify(q)); } catch (e) { alert('記録を置けませんでした（保存領域がいっぱいです）。印刷だけします'); }
  try { new BroadcastChannel('tokiwa-hub-tools').postMessage({ type: 'sagyo', 伝票番号: no }); } catch (e) {}
  記録一覧 = 記録一覧.concat([rec]); 前回の記録 = 記録一覧[記録一覧.length - 2] || null;
  製造を描く(直近);   // 帯に 第N回 と コメントを出してから印刷（赤字は前回比のまま）
  前回の記録 = rec;    // 次の出力は今回との比較になる
  $('st').textContent = '第' + rec.n + '回として記録しました' + (rec.comment ? '（' + rec.comment.slice(0, 30) + '）' : '');
  setTimeout(function () { window.print(); }, 150);
}

function 出す() {
  var no = $('no').value.trim(); if (!no) return;
  $('st').textContent = '読んでいます… ' + no;
  var t0 = Date.now();
  Promise.all([FM.呼ぶ('画面_読み込み', [no]), マスタを用意(), 出力記録を読む(no), FM.呼ぶ('画面_外注', [no]).catch(function () { return null; })]).then(function (rs) {
    var r = rs[0]; if (!r.record) throw new Error('見つかりません: ' + no);
    記録一覧 = rs[2] || []; 前回の記録 = 記録一覧[記録一覧.length - 1] || null;
    var g = rs[3]; 外注行 = (g && g.外注 && g.外注[0] && g.外注[0].行) ? g.外注[0].行 : [];
    return FM.呼ぶ('画面_全項目', [r.record.recordId]);
  }).then(function (j) {
    if (種類 !== 'seizo') $('paper').className = '';
    描く(j.fields);
    document.title = (種類 === 'seizo' ? '【製造指示書】' : '【外注指示書】') + no + '_' + esc(得意先名(j.fields['得意先コード'])) + '_' + esc(j.fields['製品名'] || '');
    $('st').textContent = '出しました（' + ((Date.now() - t0) / 1000).toFixed(1) + '秒）';
    try { history.replaceState(null, '', '?no=' + encodeURIComponent(no)); } catch (e) {}
  }).catch(function (e) { $('st').textContent = String(e.message || e); });
}

(function () {
  FM.サインインのボタンを置く($('fm-signin'));
  function 名() { var m = FM.名乗っている(); $('fm-who').textContent = m ? ('FileMaker: ' + m) : ''; }
  名(); window.addEventListener('fm-signin', 名);
  $('go').onclick = function () { 束 = null; 出す(); }; $('pr').onclick = 記録して印刷; $('pt').onclick = テスト出力;
  $('no').addEventListener('keydown', function (e) { if (e.key === 'Enter') 出す(); });
  var q = new URLSearchParams(location.search); if (q.get('type') === 'seizo') 種類を変える('seizo');
  if (q.get('test') === '1') テスト = true;
  if (q.get('nos')) { setTimeout(function () { 複数を出す(q.get('nos').split(/[,\s]+/)); }, 300); }
  else if (q.get('no')) { $('no').value = q.get('no'); setTimeout(出す, 300); }
})();
</script>
