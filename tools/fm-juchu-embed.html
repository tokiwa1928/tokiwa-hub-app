<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受注入力（FileMaker） | Tokiwa Hub</title>
<!--
  FileMaker の受注入力を Hub の中で開くための枠。

  中身は Apps Script が配っている画面をそのまま埋めている。
  Apps Script から配ると社内の Google アカウントでしか開けないので、
  Hub 側（公開ページ）に鍵を置かずに済む。

  OAuth クライアントIDの設定（設置手順.md ③）が済んだら、
  下の 中身 を 'fm-juchu-hub.html' に変えるだけで、
  Hub 本体に完全に載った状態になる。枠はそのまま使える。
-->
<style>
  html,body{ height:100%; margin:0; }
  body{ display:flex; flex-direction:column;
        background:#f4f3f0; color:#1a1a1a;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",
                    "Yu Gothic",Meiryo,sans-serif; }
  header{ display:flex; align-items:center; gap:12px; flex-wrap:wrap;
          padding:7px 14px; background:#1a1a1a; color:#fff; font-size:13px; }
  header b{ font-size:14px; }
  header .tag{ font-size:11px; color:#cbd5e1; }
  header a{ color:#cbd5e1; text-decoration:none; font-size:12px; }
  header a:hover{ color:#fff; text-decoration:underline; }
  header .right{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  header button{ font:inherit; font-size:12px; padding:4px 11px; cursor:pointer;
                 border:1px solid #555; border-radius:5px; background:#333; color:#fff; }
  header button:hover{ background:#444; }
  #wrap{ flex:1; position:relative; min-height:0; }
  iframe{ width:100%; height:100%; border:0; display:block; background:#fff; }
  #note{ display:none; position:absolute; inset:0; overflow:auto;
         background:#f4f3f0; padding:2.2rem 1.6rem; }
  #note .box{ max-width:640px; margin:0 auto; background:#fff; border:1px solid #d8d4ca;
              border-radius:10px; padding:1.4rem 1.6rem; line-height:1.85; font-size:13.5px; }
  #note h2{ margin:0 0 .6rem; font-size:16px; }
  #note ol{ margin:.4rem 0 .9rem; padding-left:1.3rem; }
  #note .go{ display:inline-block; margin-top:.5rem; padding:8px 18px; border-radius:7px;
             background:#1a1a1a; color:#fff; text-decoration:none; font-weight:700; }
</style>
</head>
<body>

<header>
  <a href="../index.html">← Hub</a>
  <b>受注入力</b>
  <span class="tag">FileMaker のデータをそのまま読み書きします</span>
  <span class="right">
    <button onclick="開き直す()" title="読み込み直す">🔄 読み直す</button>
    <button onclick="別窓()" title="別のウィンドウで開く">↗ 別ウィンドウ</button>
  </span>
</header>

<div id="wrap">
  <iframe id="fm" title="受注入力（FileMaker）"
          allow="clipboard-read; clipboard-write"></iframe>
  <div id="note">
    <div class="box">
      <h2>画面を表示できませんでした</h2>
      <p>この画面は <b>社内の Google アカウント</b>でサインインしている人だけが開けます。
         枠の中に表示できないときは、たいてい次のどれかです。</p>
      <ol>
        <li>社内アカウント（<code>@tokiwap.co.jp</code> / <code>@tokiwap-group.com</code>）で
            サインインしていない</li>
        <li>ブラウザが「他サイトの Cookie」を止めている</li>
        <li>個人アカウントと切り替わっている</li>
      </ol>
      <p><b>別ウィンドウで開けば、どの場合でも使えます。</b></p>
      <a class="go" id="note-go" href="#" target="_blank" rel="noopener">↗ 別ウィンドウで開く</a>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Apps Script が配っている受注入力の画面。
  // OAuth の設定が済んだら 'fm-juchu-hub.html' に差し替える。
  var 中身 = 'https://script.google.com/macros/s/'
           + 'AKfycby3DCpR4kCCQMBZ0a8sdsBArM1z_J3JJKcIMYNOHLlhzB1LNrYPqw_NM-dxo_JirSyK4g/exec';

  // 伝票番号を ?no=... で渡せる（案件の一覧から開くときに使う）
  var 番号 = '';
  try { 番号 = new URLSearchParams(location.search).get('no') || ''; } catch (e) {}
  var url = 中身 + (番号 ? (中身.indexOf('?') < 0 ? '?' : '&') + 'no=' + encodeURIComponent(番号) : '');

  var frame = document.getElementById('fm');
  var note  = document.getElementById('note');
  document.getElementById('note-go').href = url;

  var 出た = false, 時計 = null;

  function 見張る() {
    clearTimeout(時計);
    出た = false;
    note.style.display = 'none';
    // 枠の中に出せないときは load が来ない。少し待って案内に切り替える
    時計 = setTimeout(function () { if (!出た) note.style.display = 'block'; }, 9000);
  }

  frame.addEventListener('load', function () { 出た = true; clearTimeout(時計); });

  window.開き直す = function () { 見張る(); frame.src = url; };
  window.別窓 = function () { window.open(url, '_blank', 'noopener'); };

  見張る();
  frame.src = url;
})();
</script>

</body>
</html>
