<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン | Tokiwa Hub</title>
<style>
  body{ margin:0; font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif; background:#f1f5f9; color:#111; }
  .box{ max-width:400px; margin:40px auto; background:#fff; border:1px solid #cbd5e1; padding:22px 24px; }
  h1{ font-size:18px; margin:0 0 8px; } p{ font-size:13px; line-height:1.7; color:#334155; margin:6px 0; }
  #ok{ display:none; background:#dcfce7; border:1px solid #86efac; color:#166534; padding:10px 12px; font-weight:700; margin-top:12px; }
  #btn{ margin:14px 0 4px; min-height:40px; }
</style>
<link rel="stylesheet" href="hub-square.css"><link rel="stylesheet" href="hub-theme.css">
<script src="hub-nav.js"></script>
</head>
<body>
<div class="box">
  <h1>FileMaker（中継）にログイン</h1>
  <p>社内の Google アカウントを選んでください。ログインできると、Hub の画面（配送カレンダーなど）は自動で読み直します。</p>
  <div id="btn"></div>
  <div id="ok">ログインできました。この窓は閉じて構いません。</div>
  <p id="who" style="color:#64748b"></p>
</div>
<script src="fm-bridge.js"></script>
<script>
(function () {
  function 済() { var m = FM.名乗っている(); if (!m) return false; document.getElementById('ok').style.display = 'block'; document.getElementById('who').textContent = m; document.getElementById('btn').style.display = 'none'; setTimeout(function () { try { window.close(); } catch (e) {} }, 1500); return true; }
  try { localStorage.removeItem('fm_id_token_stale'); } catch (e) {}
  FM.サインインのボタンを置く(document.getElementById('btn'));
  window.addEventListener('fm-signin', 済);
  // 開いた時点で切れていないトークンがあれば、そのまま済みにする
  setTimeout(済, 300);
})();
</script>
</body>
</html>
