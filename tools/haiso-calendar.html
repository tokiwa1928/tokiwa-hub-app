<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>配送カレンダー | Tokiwa Hub</title>
<style>
  /* FileMaker の配送カレンダー（月・平日 5 列）と同じ形。中身は FileMaker の「予定」テーブルそのもの */
  body{ margin:0; font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif; background:#f1f5f9; color:#111; }
  #bar{ background:#0d0d0d; color:#e5e7eb; padding:6px 14px; display:flex; gap:8px; align-items:center; font-size:13px; flex-wrap:wrap; }
  #bar a{ color:#93c5fd; text-decoration:none; }
  #bar button{ font-size:13px; padding:3px 12px; border:1px solid #cbd5e1; border-radius:4px; background:#fff; color:#111; cursor:pointer; }
  #bar .ym{ font-size:22px; font-weight:700; margin:0 8px; }
  #bar .st{ color:#fbbf24; }
  #bar label{ font-size:12px; }
  #bar input[type=month]{ font-size:13px; }
  #cal{ margin:10px; background:#fff; border:1px solid #94a3b8; }
  table{ border-collapse:collapse; width:100%; table-layout:fixed; }
  th{ background:#f3f4f6; border:1px solid #94a3b8; padding:6px; font-size:14px; font-weight:600; }
  th.sat{ color:#1d4ed8; } th.sun{ color:#dc2626; }
  td{ border:1px solid #94a3b8; vertical-align:top; padding:0; height:150px; }
  td.other{ background:#f8fafc; }
  #cal.week td{ height:calc(100vh - 140px); }
  #cal.week .ev{ font-size:13px; padding:4px 6px; }
  #cal .day{ padding:10px 14px; }
  #cal .day .ev{ font-size:16px; padding:8px 10px; border-bottom:1px solid #e5e7eb; }
  #cal .day .ev b{ margin-right:8px; }
  #cal .day .none{ color:#94a3b8; padding:20px; text-align:center; }
  #cal .day .add{ display:inline-block; margin:8px 0; color:#1d4ed8; cursor:pointer; font-size:13px; }
  #bar .vw button{ border-radius:0; margin-left:-1px; } #bar .vw button.on{ background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
  @media print{ #cal.week td{ height:auto; min-height:120mm; } }
  td.today .d{ background:#fde68a; }
  .d{ text-align:center; font-size:15px; font-weight:600; padding:2px; border-bottom:1px solid #e5e7eb; position:relative; }
  .d .add{ position:absolute; right:4px; top:2px; font-size:12px; color:#94a3b8; cursor:pointer; } .d .add:hover{ color:#1d4ed8; }
  .ev{ font-size:11.5px; line-height:1.35; padding:2px 4px; border-bottom:1px dotted #e5e7eb; cursor:pointer; white-space:pre-wrap; word-break:break-all; }
  .ev:hover{ background:#eff6ff; }
  .ev.off{ color:#b45309; font-weight:600; }
  #edit{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); }
  #edit .box{ background:#fff; width:560px; max-width:92vw; margin:8vh auto; padding:14px 16px; border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.3); font-size:13px; }
  #edit textarea{ width:100%; height:120px; font-size:13px; box-sizing:border-box; }
  #edit input{ font-size:13px; }
  #edit .row{ display:flex; gap:8px; align-items:center; margin:6px 0; }
  #edit button{ font-size:13px; padding:4px 12px; }
  #edit button.rd{ background:#dc2626; color:#fff; border:0; border-radius:4px; }
  @media print{ body{ background:#fff; } #bar,#edit,.add{ display:none !important; } #cal{ margin:0; border:0; } td{ height:auto; min-height:34mm; } @page{ size:A4 landscape; margin:8mm; } }
</style>
</head>
<body>
<div id="bar">
  <a href="fm-juchu-hub.html">← 受注入力</a>
  <button id="prev">←</button><span class="ym" id="ym"></span><button id="next">→</button>
  <button id="today">今日</button>
  <span class="vw"><button data-v="月" class="on">月</button><button data-v="週">週</button><button data-v="日">日</button></span>
  <label>カレンダー基準日 <input type="month" id="base"></label>
  <label><input type="checkbox" id="wk"> 土日も出す</label>
  <button id="print">印刷</button>
  <button id="reload">読み直す</button>
  <span class="st" id="st"></span>
  <span style="margin-left:auto" id="fm-who"></span><span id="fm-signin"></span>
</div>
<div id="cal"></div>

<div id="edit"><div class="box">
  <div class="row"><b id="e-title">予定</b><span style="margin-left:auto;color:#64748b" id="e-kp"></span></div>
  <div class="row"><label>日付 <input type="date" id="e-date"></label><label>時刻 <input type="time" id="e-time"></label></div>
  <div style="color:#64748b;font-size:12px">1 行目: 伝票番号 得意先 品名 担当（倫子／郵送／直送／引取 …）。2 行目以降はメモ。休みなどは「倫子　休み」のように</div>
  <textarea id="e-text"></textarea>
  <div class="row"><button id="e-save">保存</button><button id="e-cancel">やめる</button><button id="e-del" class="rd" style="margin-left:auto">削除</button></div>
</div></div>

<script src="fm-bridge.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad(n) { return ('0' + n).slice(-2); }
function FM日付(d) { return pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + '/' + d.getFullYear(); }
function ISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function ISOfromFM(fm) { var m = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(String(fm || '')); return m ? (m[3] + '-' + m[1] + '-' + m[2]) : ''; }
function FMfromISO(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? (p[1] + '/' + p[2] + '/' + p[0]) : ''; }

var 表示 = '月';                                       // 月／週／日
var 基準 = new Date(); 基準.setHours(0, 0, 0, 0);       // 見ている日（月なら その月、週なら その週）
var 予定 = [];   // 表示中の範囲の予定
var 編集中 = null;
var 曜名 = ['日', '月', '火', '水', '木', '金', '土'];

function 範囲() {
  if (表示 === '日') return { start: new Date(基準), end: new Date(基準) };
  if (表示 === '週') { var st = new Date(基準); st.setDate(st.getDate() - ((st.getDay() + 6) % 7)); var en = new Date(st); en.setDate(st.getDate() + 6); return { start: st, end: en }; }
  // 月: FileMaker と同じく、月の初めの週の月曜から、月末の週の日曜まで
  var first = new Date(基準.getFullYear(), 基準.getMonth(), 1), last = new Date(基準.getFullYear(), 基準.getMonth() + 1, 0);
  var start = new Date(first); start.setDate(first.getDate() - ((first.getDay() + 6) % 7));
  var end = new Date(last); end.setDate(last.getDate() + (7 - last.getDay()) % 7);
  return { start: start, end: end };
}
function 見出し() {
  var r = 範囲();
  if (表示 === '日') return 基準.getFullYear() + '年' + (基準.getMonth() + 1) + '月' + 基準.getDate() + '日（' + 曜名[基準.getDay()] + '）';
  if (表示 === '週') return r.start.getFullYear() + '年' + (r.start.getMonth() + 1) + '/' + r.start.getDate() + '〜' + (r.end.getMonth() + 1) + '/' + r.end.getDate();
  return 基準.getFullYear() + '年' + (基準.getMonth() + 1) + '月';
}
function 読む() {
  var r = 範囲();
  $('ym').textContent = 見出し();
  $('base').value = 基準.getFullYear() + '-' + pad(基準.getMonth() + 1);
  Array.prototype.forEach.call(document.querySelectorAll('#bar .vw button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === 表示); });
  $('st').textContent = '読んでいます…';
  return FM.呼ぶ('予定_一覧', [FM日付(r.start), FM日付(r.end)]).then(function (res) {
    予定 = res.行 || []; 描く(); $('st').textContent = 予定.length + ' 件';
    try { history.replaceState(null, '', '?v=' + encodeURIComponent(表示) + '&d=' + ISO(基準)); } catch (e) {}
  }).catch(function (e) { $('st').textContent = String(e.message || e); });
}
function 描く() {
  var r = 範囲(), 土日 = $('wk').checked || 表示 !== '月', 今日 = ISO(new Date());
  var by = {}; 予定.forEach(function (p) { var k = ISOfromFM(p.日付); (by[k] = by[k] || []).push(p); });
  $('cal').className = 表示 === '週' ? 'week' : '';
  function 予定HTML(p, big) {
    var off = /休み|休暇|有給/.test(p.タイトル) && !/^a\d/.test(p.タイトル);
    return '<div class="ev' + (off ? ' off' : '') + '" data-id="' + esc(p.recordId) + '">' + (p.時刻 ? '<b>' + esc(String(p.時刻).slice(0, 5)) + '</b> ' : '') + esc(p.タイトル) + '</div>';
  }
  var h;
  if (表示 === '日') {
    var k0 = ISO(基準); var list = by[k0] || [];
    h = '<div class="day"><div style="font-size:18px;font-weight:700;margin-bottom:6px">' + esc(見出し()) + '</div>'
      + (list.length ? list.map(function (p) { return 予定HTML(p, true); }).join('') : '<div class="none">この日の予定はありません</div>')
      + '<span class="add" data-d="' + k0 + '">＋ この日に予定を足す</span></div>';
  } else {
    var 曜 = 土日 ? ['月', '火', '水', '木', '金', '土', '日'] : ['月', '火', '水', '木', '金'];
    h = '<table><thead><tr>' + 曜.map(function (w) { return '<th class="' + (w === '土' ? 'sat' : w === '日' ? 'sun' : '') + '">' + w + '</th>'; }).join('') + '</tr></thead><tbody>';
    for (var d = new Date(r.start); d <= r.end; d.setDate(d.getDate() + 7)) {
      h += '<tr>';
      for (var i = 0; i < (土日 ? 7 : 5); i++) {
        var day = new Date(d); day.setDate(d.getDate() + i);
        var k = ISO(day), other = 表示 === '月' && day.getMonth() !== 基準.getMonth();
        h += '<td class="' + (other ? 'other ' : '') + (k === 今日 ? 'today' : '') + '" data-d="' + k + '"><div class="d">' + (表示 === '週' ? (day.getMonth() + 1) + '/' : '') + day.getDate() + '<span class="add" title="この日に予定を足す" data-d="' + k + '">＋</span></div>';
        (by[k] || []).forEach(function (p) { h += 予定HTML(p); });
        h += '</td>';
      }
      h += '</tr>';
    }
    h += '</tbody></table>';
  }
  $('cal').innerHTML = h;
  Array.prototype.forEach.call($('cal').querySelectorAll('.ev'), function (el) { el.onclick = function () { var p = 予定.filter(function (x) { return String(x.recordId) === el.getAttribute('data-id'); })[0]; if (p) 開く(p); }; });
  Array.prototype.forEach.call($('cal').querySelectorAll('.add'), function (el) { el.onclick = function () { 開く({ 日付: FMfromISO(el.getAttribute('data-d')), タイトル: '', 時刻: '' }); }; });
  // 月・週の日付を押すと、その日の一覧（日の表示）へ
  Array.prototype.forEach.call($('cal').querySelectorAll('td .d'), function (el) { el.ondblclick = function () { var k = el.parentNode.getAttribute('data-d'); if (k) { 基準 = new Date(k + 'T00:00:00'); 表示 = '日'; 読む(); } }; el.title = 'ダブルクリックでこの日だけを出す'; });
}
function 開く(p) {
  編集中 = p;
  $('e-title').textContent = p.recordId ? '予定を直す' : '予定を足す';
  $('e-kp').textContent = p.kp ? '#' + p.kp : '';
  $('e-date').value = ISOfromFM(p.日付); $('e-time').value = p.時刻 ? String(p.時刻).slice(0, 5) : '';
  $('e-text').value = String(p.タイトル || '').replace(/\r\n?/g, '\n');
  $('e-del').style.display = p.recordId ? '' : 'none';
  $('edit').style.display = 'block'; $('e-text').focus();
}
function 閉じる() { $('edit').style.display = 'none'; 編集中 = null; }
function 保存() {
  var 日付 = FMfromISO($('e-date').value), 題 = $('e-text').value.replace(/\n/g, '\r').trim(), 時刻 = $('e-time').value;
  if (!日付 || !題) { alert('日付と内容を入れてください'); return; }
  $('st').textContent = '保存しています…';
  var p = 編集中.recordId
    ? FM.呼ぶ('予定_保存', [編集中.recordId, 編集中.modId, { '日付': 日付, '予定タイトル': 題, '時刻': 時刻 ? 時刻 + ':00' : '' }])
    : FM.呼ぶ('予定_作る', [日付, 題, 時刻 ? 時刻 + ':00' : '']);
  p.then(function () { 閉じる(); return 読む(); }).catch(function (e) { $('st').textContent = String(e.message || e); });
}
function 削除() {
  if (!編集中 || !編集中.recordId) return;
  if (!confirm('この予定を FileMaker から消します。よろしいですか？\n\n' + String(編集中.タイトル).split(/\r?\n/)[0])) return;
  FM.呼ぶ('予定_削除', [編集中.recordId]).then(function () { 閉じる(); return 読む(); }).catch(function (e) { $('st').textContent = String(e.message || e); });
}

(function () {
  FM.サインインのボタンを置く($('fm-signin'));
  function 名() { var m = FM.名乗っている(); $('fm-who').textContent = m ? ('FileMaker: ' + m) : ''; }
  名(); window.addEventListener('fm-signin', 名);
  function 進む(n) { if (表示 === '月') 基準 = new Date(基準.getFullYear(), 基準.getMonth() + n, 1); else 基準.setDate(基準.getDate() + n * (表示 === '週' ? 7 : 1)); 読む(); }
  $('prev').onclick = function () { 進む(-1); };
  $('next').onclick = function () { 進む(1); };
  $('today').onclick = function () { 基準 = new Date(); 基準.setHours(0, 0, 0, 0); 読む(); };
  $('base').onchange = function () { var p = $('base').value.split('-'); if (p.length === 2) { 基準 = new Date(Number(p[0]), Number(p[1]) - 1, 1); 読む(); } };
  Array.prototype.forEach.call(document.querySelectorAll('#bar .vw button'), function (b) { b.onclick = function () { 表示 = b.getAttribute('data-v'); try { localStorage.setItem('haiso_view', 表示); } catch (e) {} 読む(); }; });
  try { var sv = localStorage.getItem('haiso_view'); if (sv === '週' || sv === '日' || sv === '月') 表示 = sv; } catch (e) {}
  $('wk').onchange = 描く; $('print').onclick = function () { window.print(); }; $('reload').onclick = 読む;
  $('e-save').onclick = 保存; $('e-cancel').onclick = 閉じる; $('e-del').onclick = 削除;
  $('edit').addEventListener('click', function (e) { if (e.target === $('edit')) 閉じる(); });
  var q = new URLSearchParams(location.search); var ym = q.get('ym'); if (ym && /^\d{4}-\d\d$/.test(ym)) { 基準 = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 1, 1); 表示 = '月'; }
  var qd = q.get('d'); if (qd && /^\d{4}-\d\d-\d\d$/.test(qd)) 基準 = new Date(qd + 'T00:00:00'); var qv = q.get('v'); if (qv === '週' || qv === '日' || qv === '月') 表示 = qv;
  setTimeout(読む, 300);
  setInterval(function () { if ($('edit').style.display !== 'block') 読む(); }, 5 * 60 * 1000);   // 5 分ごとに読み直す（他の人の登録を拾う）
})();
</script>
<script>window.KAIZEN_KEY = 'haiso-calendar';</script>
<script src="kaizen.js"></script>
</body>
</html>
