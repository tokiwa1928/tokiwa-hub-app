<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>配送カレンダー | Tokiwa Hub</title>
<style>
  /* FileMaker の配送カレンダー（月・平日 5 列）と同じ形。中身は FileMaker の「予定」テーブルそのもの */
  body{ margin:0; font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif; background:#f1f5f9; color:#111; }
  #bar{ background:#0d0d0d; color:#e5e7eb; padding:6px 14px; display:flex; gap:8px; align-items:center; font-size:13px; flex-wrap:wrap; }
  #bar a{ color:#93c5fd; text-decoration:none; }
  #bar button{ font-size:13px; padding:3px 12px; border:1px solid #cbd5e1; border-radius:4px; background:#fff; color:#111; cursor:pointer; }
  #bar .ym{ font-size:22px; font-weight:700; margin:0 8px; }
  #bar .st{ color:#fbbf24; }
  #bar label{ font-size:12px; }
  #bar input[type=month]{ font-size:13px; }
  #cal{ margin:10px; background:#fff; border:1px solid #94a3b8; }
  table{ border-collapse:collapse; width:100%; table-layout:fixed; }
  th{ background:#f3f4f6; border:1px solid #94a3b8; padding:6px; font-size:14px; font-weight:600; }
  th.sat{ color:#1d4ed8; } th.sun{ color:#dc2626; }
  td{ border:1px solid #94a3b8; vertical-align:top; padding:0; height:150px; }
  td.other{ background:#f8fafc; }
  #cal.week td{ height:calc(100vh - 140px); }
  #cal.week .ev{ font-size:13px; padding:4px 6px; }
  #cal .day{ padding:10px 14px; }
  #cal .day .ev{ font-size:16px; padding:8px 10px; border-bottom:1px solid #e5e7eb; }
  #cal .day .ev b{ margin-right:8px; }
  #cal .day .none{ color:#94a3b8; padding:20px; text-align:center; }
  #cal .day .add{ display:inline-block; margin:8px 0; color:#1d4ed8; cursor:pointer; font-size:13px; }
  #bar .vw button{ border-radius:0; margin-left:-1px; } #bar .vw button.on{ background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
  @media print{ #cal.week td{ height:auto; min-height:120mm; } }
  td.today .d{ background:#fde68a; }
  .d{ text-align:center; font-size:15px; font-weight:600; padding:2px; border-bottom:1px solid #e5e7eb; position:relative; }
  .d .add{ position:absolute; right:4px; top:2px; font-size:12px; color:#94a3b8; cursor:pointer; } .d .add:hover{ color:#1d4ed8; }
  .ev{ font-size:11.5px; line-height:1.35; padding:2px 4px; border-bottom:1px dotted #e5e7eb; cursor:pointer; white-space:pre-wrap; word-break:break-all; }
  .ev:hover{ background:#eff6ff; }
  .ev.off{ color:#b45309; font-weight:600; }
  #edit{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); }
  #edit .box{ background:#fff; width:560px; max-width:92vw; margin:8vh auto; padding:14px 16px; border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.3); font-size:13px; }
  #edit textarea{ width:100%; height:120px; font-size:13px; box-sizing:border-box; }
  #edit input{ font-size:13px; }
  #edit .row{ display:flex; gap:8px; align-items:center; margin:6px 0; }
  #edit button{ font-size:13px; padding:4px 12px; }
  #edit button.rd{ background:#dc2626; color:#fff; border:0; border-radius:4px; }
  /* HAISO-2（本多さん 9/30）: 分類・ジョブNo・案件名・担当・詳細に分ける。完了、担当での並べ替え */
  #edit .grid{ display:grid; grid-template-columns:86px 1fr; gap:6px 8px; align-items:center; margin:6px 0; }
  #edit .grid label{ color:#475569; font-size:12px; font-weight:700; }
  #edit .grid input, #edit .grid select{ font-size:14px; padding:4px 6px; border:1px solid #94a3b8; width:100%; box-sizing:border-box; }
  #edit textarea{ height:90px; border:1px solid #94a3b8; padding:4px 6px; }
  #edit button.ok{ background:#166534; color:#fff; border:0; border-radius:4px; font-weight:700; }
  .ev{ display:flex; gap:4px; align-items:flex-start; white-space:normal; }
  .ev .tx{ flex:1; min-width:0; white-space:pre-wrap; word-break:break-all; }
  .ev .cl{ flex:none; font-size:10px; font-weight:700; color:#fff; padding:0 5px; line-height:1.6; }
  .ev .jb{ font-weight:700; color:#1e40af; }
  .ev .tn{ font-weight:700; color:#fff; background:#475569; padding:0 5px; font-size:10.5px; margin-left:3px; white-space:nowrap; }
  .ev .dt{ color:#64748b; font-size:.92em; }
  .ev .dn{ flex:none; font-size:10px; border:1px solid #94a3b8; background:#fff; color:#166534; cursor:pointer; padding:0 5px; line-height:1.6; }
  .ev.done{ opacity:.55; } .ev.done .tx{ text-decoration:line-through; } .ev.done .dn{ background:#166534; color:#fff; border-color:#166534; }
  #cal .day .ev .cl{ font-size:12px; padding:1px 8px; } #cal .day .ev .tn{ font-size:13px; } #cal .day .ev .dn{ font-size:13px; padding:2px 12px; }
  @media print{ .ev .dn{ display:none; } }
  /* HAISO-3: 方面 */
  .ev .ar{ flex:none; font-size:10px; font-weight:700; color:#0f172a; background:#fde68a; padding:0 5px; line-height:1.6; white-space:nowrap; }
  .homen{ font-size:10.5px; line-height:1.5; padding:2px 4px; background:#fffbeb; border-bottom:1px solid #fde68a; color:#78350f; }
  .homen b{ color:#0f172a; } .homen .who{ font-weight:700; color:#1e40af; margin-right:2px; }
  #cal .day .homen{ font-size:14px; padding:6px 10px; margin-bottom:6px; border:1px solid #fde68a; }
  #cal .day .ev .ar{ font-size:12px; padding:1px 8px; }
  #e-same{ font-size:12px; margin:4px 0; } #e-same button{ font-size:12px; padding:2px 8px; margin:2px 4px 2px 0; border:1px solid #f59e0b; background:#fffbeb; cursor:pointer; }
  body.embed #bar > a:first-child{ display:none; }
  @media print{ body{ background:#fff; } #bar,#edit,.add{ display:none !important; } #cal{ margin:0; border:0; } td{ height:auto; min-height:34mm; } @page{ size:A4 landscape; margin:8mm; } }
</style>

</head>
<body>
<div id="bar">
  <a href="fm-juchu-hub.html">← 受注入力</a>
  <button id="prev">←</button><span class="ym" id="ym"></span><button id="next">→</button>
  <button id="today">今日</button>
  <span class="vw"><button data-v="月" class="on">月</button><button data-v="週">週</button><button data-v="日">日</button></span>
  <label>カレンダー基準日 <input type="month" id="base"></label>
  <label><input type="checkbox" id="wk"> 土日も出す</label>
  <label>並び <select id="sort" title="1 日の中の並び順"><option value="">登録順</option><option value="担当">担当（人）ごと</option><option value="分類">分類ごと</option><option value="時刻">時刻順</option></select></label>
  <label>担当 <select id="ftanto" title="この担当の分だけ出す"><option value="">全員</option></select></label>
  <label><input type="checkbox" id="hidedone"> 完了は出さない</label>
  <button id="addnew" style="background:#1d4ed8;color:#fff;border-color:#1d4ed8" title="今日の日付で予定を足します">＋ 予定を足す</button>
  <button id="print">印刷</button>
  <button id="reload">読み直す</button>
  <span class="st" id="st"></span>
  <span style="margin-left:auto" id="fm-who"></span><span id="fm-signin"></span>
</div>
<div id="cal"></div>

<div id="edit"><div class="box">
  <div class="row"><b id="e-title">予定</b><span style="margin-left:auto;color:#64748b" id="e-kp"></span></div>
  <div class="row"><label>日付 <input type="date" id="e-date"></label><label>時刻 <input type="time" id="e-time"></label></div>
  <div class="grid">
    <label>分類</label><select id="e-class"><option>自社便</option><option value="受取">受取（サンプル・原稿などを受け取りに行く）</option><option>宅配</option><option>郵送</option><option>直送</option><option value="引取">引取（お客様が取りに来る）</option><option>休み</option><option>その他</option></select>
    <label>ジョブNo</label><input id="e-job" placeholder="a107363（伝票番号）" autocomplete="off">
    <label>案件名</label><input id="e-name" placeholder="得意先 品名" autocomplete="off">
    <label>担当</label><input id="e-tanto" list="e-tanto-dl" placeholder="倫子" autocomplete="off">
    <label>住所</label><input id="e-addr" placeholder="行き先の住所（市区町村まででも可）。ジョブNo を入れると得意先の住所が入ります" autocomplete="off">
  </div>
  <div id="e-same"></div>
  <datalist id="e-tanto-dl"></datalist>
  <label style="color:#475569;font-size:12px;font-weight:700">詳細</label>
  <textarea id="e-text" placeholder="納品先・冊数・時間など"></textarea>
  <div class="row" style="background:#f0fdf4;border:1px solid #bbf7d0;padding:4px 8px"><label style="font-weight:700;color:#166534"><input type="checkbox" id="e-done"> 完了</label><label>完了日 <input type="date" id="e-donedate"></label><span style="color:#64748b;font-size:11.5px">完了にすると今日の日付が入ります。FileMaker の予定にも「【済 9/30】」と付きます</span></div>
  <div class="row"><button id="e-save">保存</button><button id="e-cancel">キャンセル</button><button id="e-complete" class="ok">完了にして保存</button><button id="e-del" class="rd" style="margin-left:auto">削除</button></div>
</div></div>

<script src="fm-bridge.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad(n) { return ('0' + n).slice(-2); }
function FM日付(d) { return pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + '/' + d.getFullYear(); }
function ISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function ISOfromFM(fm) { var m = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(String(fm || '')); return m ? (m[3] + '-' + m[1] + '-' + m[2]) : ''; }
function FMfromISO(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? (p[1] + '/' + p[2] + '/' + p[0]) : ''; }

// HAISO-2: FileMaker の予定は 1 つの文（1 行目: 伝票番号 得意先 品名 担当、2 行目から詳細）。画面では 分類・ジョブNo・案件名・担当・詳細・完了 に分けて扱い、
//   保存するときは今までと同じ形の文に組み立てる（FileMaker の配送カレンダーでもそのまま読める）。完了は頭に【済 9/30】
var 分類一覧 = ['自社便', '受取', '宅配', '郵送', '直送', '引取', '休み', 'その他'];
var 分類色 = { '自社便': '#1d4ed8', '受取': '#c2410c', '宅配': '#7c3aed', '郵送': '#0f766e', '直送': '#b45309', '引取': '#be185d', '休み': '#b91c1c', 'その他': '#64748b' };
// HAISO-3: 方面＝住所の市区町村。①予定の文にある住所（📍 や「静岡市葵区…」）②ジョブNo → 索引の得意先コード → 得意先マスタの住所 ③案件名にある得意先名 → マスタの住所
var 索引表 = null, 得意先表 = null, 得意先名順 = [];
function 方面を取る(t) {
  t = String(t || '').normalize('NFKC'); if (!t) return '';
  // 区切り（行頭・空白・記号・数字・都道府県）のあとに続く「…市」「…市…区」。市場・市民・市販などは住所ではないので飛ばす
  var 試す = function (re) { var m; while ((m = re.exec(t))) { var c = m[1].replace(/^.*?(都|道|府|県)(?=.+市$)/, ''); var after = t.charAt(m.index + m[0].length - (m[2] ? m[2].length : 0)); if (!m[2] && /[場民販内外況街]/.test(after)) continue; if (/^(都|朝|闇|魚|見本)市$/.test(c)) continue; if (c.length < 2) continue; return c + (m[2] || ''); } return ''; };
  var a = 試す(/(?<=^|[\s、,，（(〒\d\-－:：📍]|[都道府県])([一-龥ぁ-んァ-ヶ]{1,6}?市)([一-龥ぁ-んァ-ヶ]{1,4}?区)?/g) || 試す(/([一-龥ぁ-んァ-ヶ]{1,4}?市)([一-龥ぁ-んァ-ヶ]{1,4}?区)?/g);
  if (a) return a;
  var g = /([一-龥]{1,5}?郡)([一-龥ぁ-んァ-ヶ]{1,6}?[町村])/.exec(t); if (g) return g[2];
  var k = /(?:東京都)([一-龥]{1,4}?区)/.exec(t); if (k) return k[1];
  return '';
}
function 住所の列(r) { return Object.keys(r || {}).filter(function (c) { return /住所/.test(c) && !/カナ|ｶﾅ|フリガナ/.test(c); }).map(function (c) { return String(r[c] || '').trim(); }).filter(Boolean).join(' '); }
function 得意先の住所(code) { if (!得意先表 || !code) return ''; var r = 得意先表[String(code)]; return r ? 住所の列(r) : ''; }
function 予定の方面(p) {
  var o = p._o || (p._o = 分ける(p.タイトル)); if (o.方面 !== undefined) return o.方面;
  var a = 方面を取る(o.詳細) || 方面を取る(o.案件名); var src = a ? '文' : '';
  if (!a && o.ジョブ && 索引表) { var code = 索引表[o.ジョブ.replace(/-.*$/, '')] || 索引表[o.ジョブ]; if (code) { a = 方面を取る(得意先の住所(code)); if (a) src = '得意先'; } }
  if (!a && 得意先名順.length && o.案件名) { var nm = o.案件名.replace(/\s/g, ''); for (var i = 0; i < 得意先名順.length; i++) { var x = 得意先名順[i]; if (x.名.length >= 3 && nm.indexOf(x.名) >= 0) { a = 方面を取る(x.住所); if (a) { src = '得意先'; break; } } } }
  o.方面 = a; o.方面元 = src; return a;
}
function 下地を読む() {
  // 得意先マスタ（受注入力が 24 時間持っている控え）と、受注の索引（IndexedDB）。どちらも無ければ方面は予定の文からだけ
  try { var c = JSON.parse(localStorage.getItem('fm_master_得意先マスタ') || 'null'); if (c && c.行) { 得意先表 = {}; 得意先名順 = []; c.行.forEach(function (r) { var cd = String(r['得意先コード'] || ''); if (cd) 得意先表[cd] = r; var n = String(r['得意先名'] || '').replace(/株式会社|有限会社|\(株\)|\(有\)|\s/g, ''); var ad = 住所の列(r); if (n && ad) 得意先名順.push({ 名: n, 住所: ad }); }); 得意先名順.sort(function (a, b) { return b.名.length - a.名.length; }); } } catch (e) {}
  var p1 = 得意先表 ? Promise.resolve() : (FM.名乗っている() ? FM.呼ぶ('マスタ_配る', ['得意先マスタ']).then(function (j) { j.取った = new Date().toISOString(); try { localStorage.setItem('fm_master_得意先マスタ', JSON.stringify(j)); } catch (e) {} return 下地を読む(); }).catch(function () {}) : Promise.resolve());
  var p2 = new Promise(function (res) { try { var q = indexedDB.open('tokiwa_fm_index', 1); q.onupgradeneeded = function () { try { q.result.createObjectStore('idx'); } catch (e) {} }; q.onsuccess = function () { try { var g = q.result.transaction('idx').objectStore('idx').get('juchu'); g.onsuccess = function () { var j = g.result; if (j && j.列 && j.行) { var a = j.列.indexOf('伝票番号'), b = j.列.indexOf('得意先コード'); if (a >= 0 && b >= 0) { 索引表 = {}; j.行.forEach(function (r) { if (r[a]) 索引表[String(r[a])] = String(r[b] || ''); }); } } res(); }; g.onerror = function () { res(); }; } catch (e) { res(); } }; q.onerror = function () { res(); }; } catch (e) { res(); } });
  return Promise.all([p1, p2]).then(function () { 予定.forEach(function (p) { if (p._o) delete p._o.方面; }); });
}
function 担当候補() { var base = ['倫子']; try { var a = JSON.parse(localStorage.getItem('haiso_tanto') || '[]'); a.forEach(function (x) { if (x && base.indexOf(x) < 0) base.push(x); }); } catch (e) {} return base; }
function 担当を覚える(nm) { nm = String(nm || '').trim(); if (!nm || 分類一覧.indexOf(nm) >= 0) return; var a = 担当候補(); if (a.indexOf(nm) < 0) { a.push(nm); try { localStorage.setItem('haiso_tanto', JSON.stringify(a.slice(0, 40))); } catch (e) {} } }
function 分ける(題) {
  var o = { 完了: '', 分類: '', ジョブ: '', 案件名: '', 担当: '', 詳細: '' }; var t = String(題 || '').replace(/\r\n?/g, '\n');
  var m = /^【済\s*([^】]*)】\s*/.exec(t); if (m) { o.完了 = m[1].trim() || '済'; t = t.slice(m[0].length); }
  var lines = t.split('\n'); var first = lines.shift() || ''; var rest = lines.join('\n').trim();
  var tk = first.split(/[ 　\t]+/).filter(Boolean); var 候補 = 担当候補();
  if (tk.length && /^[a-zA-Z]\d{4,}(-[\w]+)?$/.test(tk[0])) o.ジョブ = tk.shift();
  // 後ろから 分類・担当 を拾う。担当のあとに続く文（★（…）など）は詳細へ
  var cut = -1;
  for (var i = tk.length - 1; i >= 0; i--) { var w = tk[i]; var base = w.replace(/[★☆◎○●※].*$/, '').replace(/[（(].*$/, '');
    if (!o.分類 && 分類一覧.indexOf(base) >= 0 && base !== 'その他') { o.分類 = base; if (cut < 0 || i < cut) cut = i; var ex = w.slice(base.length); if (ex) { tk[i] = base; tk.splice(i + 1, 0, ex); } continue; }
    if (!o.担当 && 候補.indexOf(base) >= 0) { o.担当 = base; if (cut < 0 || i < cut) cut = i; var ex2 = w.slice(base.length); if (ex2) { tk[i] = base; tk.splice(i + 1, 0, ex2); } } }
  if (cut >= 0) { var tail = tk.slice(cut).filter(function (w) { return w !== o.分類 && w !== o.担当; }); o.案件名 = tk.slice(0, cut).join(' '); if (tail.length) rest = tail.join(' ') + (rest ? '\n' + rest : ''); }
  else o.案件名 = tk.join(' ');
  if (!o.分類) o.分類 = (/休み|休暇|有給/.test(first) && !o.ジョブ) ? '休み' : (o.ジョブ || o.担当) ? '自社便' : 'その他';
  o.詳細 = rest; return o;
}
function 組み立てる(o) {
  var l1 = [o.ジョブ, o.案件名, o.担当, (o.分類 && o.分類 !== '自社便' && o.分類 !== 'その他' && !(o.分類 === '休み' && /休み|休暇|有給/.test(o.案件名 || ''))) ? o.分類 : ''].filter(function (x) { return String(x || '').trim(); }).join(' ');
  return (o.完了 ? '【済 ' + o.完了 + '】' : '') + l1 + (String(o.詳細 || '').trim() ? '\n' + String(o.詳細).trim() : '');
}
function 月日(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
var 表示 = '月';                                       // 月／週／日
var 基準 = new Date(); 基準.setHours(0, 0, 0, 0);       // 見ている日（月なら その月、週なら その週）
var 予定 = [];   // 表示中の範囲の予定
var 編集中 = null;
var 曜名 = ['日', '月', '火', '水', '木', '金', '土'];

function 範囲() {
  if (表示 === '日') return { start: new Date(基準), end: new Date(基準) };
  if (表示 === '週') { var st = new Date(基準); st.setDate(st.getDate() - ((st.getDay() + 6) % 7)); var en = new Date(st); en.setDate(st.getDate() + 6); return { start: st, end: en }; }
  // 月: FileMaker と同じく、月の初めの週の月曜から、月末の週の日曜まで
  var first = new Date(基準.getFullYear(), 基準.getMonth(), 1), last = new Date(基準.getFullYear(), 基準.getMonth() + 1, 0);
  var start = new Date(first); start.setDate(first.getDate() - ((first.getDay() + 6) % 7));
  var end = new Date(last); end.setDate(last.getDate() + (7 - last.getDay()) % 7);
  return { start: start, end: end };
}
function 見出し() {
  var r = 範囲();
  if (表示 === '日') return 基準.getFullYear() + '年' + (基準.getMonth() + 1) + '月' + 基準.getDate() + '日（' + 曜名[基準.getDay()] + '）';
  if (表示 === '週') return r.start.getFullYear() + '年' + (r.start.getMonth() + 1) + '/' + r.start.getDate() + '〜' + (r.end.getMonth() + 1) + '/' + r.end.getDate();
  return 基準.getFullYear() + '年' + (基準.getMonth() + 1) + '月';
}
function 読む() {
  var r = 範囲();
