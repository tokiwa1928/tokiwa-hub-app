<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面付チェック</title>
<!-- MENCHECK-1（11/11 本多さん「重いデータでも確認できない？」）: 面付済み PDF をこの PC のブラウザの中だけで読み、全ページのノンブルが正しい位置にあるかを調べる。ファイルはどこにも送らない -->
<style>
  :root{ --ink:#1f2937; --sub:#64748b; --line:#e2e8f0; --ok:#166534; --ng:#b91c1c; --acc:#0f766e; }
  body{ margin:0; background:#f8fafc; color:var(--ink); font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; font-size:14px; }
  .wrap{ max-width:960px; margin:0 auto; padding:20px 16px 40px; }
  h1{ font-size:20px; margin:0 0 4px; }
  .note{ color:var(--sub); font-size:12.5px; line-height:1.7; margin:0 0 12px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  #drop{ border:3px dashed #94a3b8; border-radius:12px; padding:28px; text-align:center; color:var(--sub); cursor:pointer; }
  #drop.over{ border-color:var(--acc); background:#ecfdf5; }
  select, button{ font:inherit; padding:5px 10px; border-radius:6px; border:1px solid #cbd5e1; background:#fff; }
  #bar{ height:8px; background:#e2e8f0; border-radius:4px; overflow:hidden; margin-top:8px; display:none; }
  #bar i{ display:block; height:100%; width:0; background:var(--acc); }
  table{ border-collapse:collapse; width:100%; font-size:12px; }
  th,td{ border-top:1px solid var(--line); padding:3px 6px; text-align:center; }
  td.ng{ background:#fee2e2; color:var(--ng); font-weight:700; }
  td.ok{ color:var(--ok); }
  td.em{ color:#cbd5e1; }
  .big{ font-size:18px; font-weight:800; }
</style>
</head>
<body>
<div class="wrap">
  <h1>面付チェック</h1>
  <p class="note">面付済みの PDF を下に落とすと、全ページのノンブル（ページ番号）が正しい位置に入っているかを調べます。<b>ファイルはこの PC の中だけで読み、どこにも送りません</b>。数百 MB でも動きます（少し時間がかかります）。</p>
  <div class="card">
    パターン <select id="pat"></select>
    <div id="drop" style="margin-top:10px">ここに面付済みの PDF を落とす（または押して選ぶ）<input type="file" id="f" accept=".pdf" style="display:none"></div>
    <div id="bar"><i></i></div>
    <div id="st" style="margin-top:6px;color:var(--sub)"></div>
  </div>
  <div class="card" id="out" style="display:none"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var MM = 72 / 25.4;
  // 折丁面付台（oricho-menzuke.html）の 4 ページ折り 4 列×2 段（下の段は天地逆・右綴じ）と同じ並び。表＝上 9,12,1,4／下 16,13,8,5、裏＝上 3,2,11,10／下 6,7,14,15（1 枚ごとに +16）
  var PATS = [
    { name: '北上 冊子 B6｜ローランド版 740×605 B6 4ページ折り×4丁（紙 625×440）ROLAND-4P-B6', W: 740, H: 605, pw: 128, ph: 182, offX: 85.75, offY: 158, gaps: [0, 56.5, 0], gapY: 6 },
    { name: '北上 冊子 B6 菊半｜ローランド版 740×605 B6 4ページ折り×4丁（紙 菊半裁 636×469）ROLAND-4P-B6-KIKU', W: 740, H: 605, pw: 128, ph: 182, offX: 83, offY: 140, gaps: [0, 62, 0], gapY: 6 },
    { name: '北上 冊子 四六判｜ローランド版 740×605 四六 128×188 4ページ折り×4丁', W: 740, H: 605, pw: 128, ph: 188, offX: 85.75, offY: 152, gaps: [0, 56.5, 0], gapY: 6 }
  ];
  var FRONT = [[9, 12, 1, 4], [16, 13, 8, 5]], BACK = [[3, 2, 11, 10], [6, 7, 14, 15]];
  $('pat').innerHTML = PATS.map(function (p, i) { return '<option value="' + i + '">' + esc(p.name) + '</option>'; }).join('');
  try { var hint = location.hash.slice(1); if (/KIKU/i.test(hint)) $('pat').value = '1'; } catch (e) {}
  var drop = $('drop');
  drop.onclick = function () { $('f').click(); };
  $('f').onchange = function () { if (this.files[0]) 調べる(this.files[0]); };
  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
  drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('over'); var f = e.dataTransfer.files[0]; if (f) 調べる(f); });

  function 調べる(file) {
    var P = PATS[Number($('pat').value)];
    if (/KIKU/i.test(file.name) && P.name.indexOf('KIKU') < 0) { if (confirm('ファイル名に KIKU（菊半）とあります。菊半のパターンで調べますか？')) { $('pat').value = '1'; P = PATS[1]; } }
    $('out').style.display = 'none'; $('bar').style.display = 'block'; $('bar').firstChild.style.width = '0';
    $('st').textContent = file.name + '（' + (file.size / 1048576).toFixed(1) + ' MB）を開いています…';
    var xs = [P.offX * MM]; for (var g = 0; g < 3; g++) xs.push(xs[g] + P.pw * MM + P.gaps[g] * MM);
    var pw = P.pw * MM, upTop = P.offY * MM, upBot = upTop + P.ph * MM, loTop = upBot + P.gapY * MM, loBot = loTop + P.ph * MM;
    function slot(x) { for (var k = 0; k < 4; k++) if (x >= xs[k] - 15 && x <= xs[k] + pw + 15) return k; return -1; }
    var url = URL.createObjectURL(file);
    pdfjsLib.getDocument({ url: url, disableAutoFetch: false, rangeChunkSize: 1048576 }).promise.then(function (doc) {
      var n = doc.numPages, rows = [], i = 0, info = {};
      doc.getMetadata().then(function (m) { info = m.info || {}; }).catch(function () {});
      function next() {
        if (i >= n) return 終わり(doc, rows, info, file, P);
        var idx = i++;
        return doc.getPage(idx + 1).then(function (pg) {
          var vp = pg.getViewport({ scale: 1 }), H = vp.height;
          return pg.getTextContent().then(function (tc) {
            var b = 16 * Math.floor(idx / 2), pat = idx % 2 === 0 ? FRONT : BACK, cells = [[null, null, null, null], [null, null, null, null]];
            tc.items.forEach(function (it) {
              var s = String(it.str || '').trim(); if (!/^\d{1,3}$/.test(s)) return;
              var x = it.transform[4] + (it.width || 0) / 2, yTop = H - it.transform[5];
              var r = (yTop > upBot - 60 && yTop <= upBot + 2) ? 0 : (yTop >= loTop - 2 && yTop < loTop + 60) ? 1 : -1;
              if (r < 0) return; var k = slot(x); if (k < 0) return;
              var c = cells[r][k] || (cells[r][k] = []); if (c.indexOf(Number(s)) < 0) c.push(Number(s));
            });
            rows.push({ idx: idx, b: b, pat: pat, cells: cells });
            pg.cleanup();
            $('bar').firstChild.style.width = Math.round(i / n * 100) + '%'; $('st').textContent = i + ' / ' + n + ' 面を調べました';
            return next();
          });
        });
      }
      return next();
    }).catch(function (e) { $('st').textContent = '開けませんでした: ' + String(e.message || e); });
  }
  function 終わり(doc, rows, info, file, P) {
    var ok = 0, ng = [], empty = 0;
    var h = '<table><tr><th>面</th><th>表裏</th><th colspan="4">上の段（左→右）</th><th colspan="4">下の段（左→右）</th></tr>';
    rows.forEach(function (r) {
      h += '<tr><td>' + (r.idx + 1) + '</td><td>' + (r.idx % 2 === 0 ? '表' : '裏') + '</td>';
      [0, 1].forEach(function (row) { [0, 1, 2, 3].forEach(function (k) {
        var exp = r.b + r.pat[row][k], got = r.cells[row][k];
        if (!got) { empty++; h += '<td class="em" title="ノンブルなし（白・扉・図など）">(' + exp + ')</td>'; return; }
        if (got.length === 1 && got[0] === exp) { ok++; h += '<td class="ok">' + exp + '</td>'; return; }
        if (got.indexOf(exp) >= 0) { ok++; h += '<td class="ok" title="ほかの数字も見えています: ' + got.join(',') + '">' + exp + '</td>'; return; }
        ng.push({ 面: r.idx + 1, 段: row ? '下' : '上', 位置: k + 1, 入っている: got.join(','), 入るべき: exp });
        h += '<td class="ng">' + got.join(',') + '<br><span style="font-weight:400">本来 ' + exp + '</span></td>';
      }); });
      h += '</tr>';
    });
    h += '</table>';
    var made = String(info.CreationDate || '').replace(/^D:(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2}).*$/, '$1/$2/$3 $4:$5:$6');
    var head = '<div class="big" style="color:' + (ng.length ? 'var(--ng)' : 'var(--ok)') + '">' + (ng.length ? '✗ ' + ng.length + ' 面が違う位置にあります' : '✓ 全部正しい位置です') + '</div>'
      + '<div style="margin:4px 0 10px;color:var(--sub)">' + esc(file.name) + '　' + rows.length + ' 面（' + rows.length / 2 + ' 枚・' + rows.length * 8 + ' ページ分）　ノンブルが合ったページ ' + ok + '／ノンブルの無いページ ' + empty + '（白・扉・図・目次など。かっこの番号が入るはずのページ）' + (made ? '　PDF の作成: ' + esc(made) + '（UTC のことがあります）' : '') + '<br>パターン: ' + esc(P.name) + '</div>';
    if (ng.length) head += '<div style="margin-bottom:8px;color:var(--ng)">' + ng.map(function (x) { return x.面 + ' 面の' + x.段 + 'の段・左から ' + x.位置 + ' 番目：' + x.入っている + '（本来 ' + x.入るべき + '）'; }).join('<br>') + '</div>';
    $('out').innerHTML = head + h; $('out').style.display = 'block'; $('st').textContent = '調べ終わりました'; $('bar').style.display = 'none';
  }
})();
</script>
</body>
</html>
