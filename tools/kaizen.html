<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>気づいたこと | Tokiwa Hub</title>
<!--
  💡 気づいたこと（改善メモ）

  各画面の「💡 気づいた」から送られたメモを集めて、直したかどうかまで追う。
  あわせて、画面ごとの機能の説明（tools/kinou.json）も一覧で見せる。
  ここを見れば「何ができるか」と「何が直ったか」が分かる ── 人が口で説明しなくて済むように。
-->
<style>
  :root{ --ink:#1a1a1a; --line:#e0ddd6; --bg:#f4f3f0; --blue:#0369a1; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); line-height:1.8;
        font-family:'Yu Gothic','Hiragino Kaku Gothic ProN',Meiryo,sans-serif; }
  header{ background:#1a1a1a; color:#fff; padding:10px 18px; display:flex;
          align-items:center; gap:12px; flex-wrap:wrap; }
  header .logo{ font-weight:800; font-size:14px; letter-spacing:.04em; }
  header .logo b{ color:#a3e635; }
  header .tname{ font-size:16px; font-weight:800; }
  header a{ color:#cbd5e1; font-size:12px; text-decoration:none; }
  header a:hover{ color:#fff; text-decoration:underline; }
  header .user{ margin-left:auto; font-size:11px; color:#cbd5e1; }
  main{ max-width:960px; margin:18px auto; padding:0 14px 4rem; }
  .sec{ background:#fff; border:1px solid var(--line); border-radius:8px;
        padding:.9rem 1.1rem; margin-bottom:.8rem; }
  .st{ font-size:10px; font-weight:700; color:#999; letter-spacing:.1em;
       margin-bottom:.6rem; text-transform:uppercase; }
  .tabs{ display:flex; gap:6px; margin-bottom:.8rem; flex-wrap:wrap; }
  .tab{ font:inherit; font-size:13px; font-weight:700; padding:6px 14px; cursor:pointer;
        border:1px solid var(--line); background:#fff; color:#555; border-radius:20px; }
  .tab.on{ background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
  .cnt{ font-size:11px; opacity:.8; margin-left:4px; }
  .memo{ border:1px solid var(--line); border-radius:8px; padding:.7rem .9rem;
         margin-bottom:.6rem; background:#fff; }
  .memo.done{ opacity:.6; }
  .memo .hd{ display:flex; gap:8px; align-items:center; flex-wrap:wrap;
             font-size:11.5px; color:#777; margin-bottom:.3rem; }
  .memo .body{ font-size:14px; white-space:pre-wrap; }
  .badge{ font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:10px; }
  .b-未対応{ background:#fee2e2; color:#b91c1c; }
  .b-対応中{ background:#fef3c7; color:#92400e; }
  .b-直した{ background:#dcfce7; color:#15803d; }
  .b-見送り{ background:#f1f5f9; color:#94a3b8; }
  .memo .act{ display:flex; gap:6px; margin-top:.5rem; flex-wrap:wrap; }
  .memo button{ font:inherit; font-size:11.5px; padding:3px 10px; border-radius:6px;
                border:1px solid var(--line); background:#fff; cursor:pointer; }
  .memo button:hover{ background:#f8f8f6; }
  .empty{ color:#bbb; text-align:center; padding:2rem; font-size:13px; }
  .kinou{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:.7rem; }
  .kcard{ border:1px solid var(--line); border-radius:8px; padding:.8rem 1rem; background:#fff; }
  .kcard h3{ margin:0 0 .1rem; font-size:15px; }
  .kcard .cat{ font-size:10.5px; color:#999; }
  .kcard .ds{ font-size:12.5px; color:#555; margin:.4rem 0 .3rem; }
  .kcard ul{ margin:.2rem 0 0; padding-left:17px; font-size:12.5px; }
  .kcard li{ margin:1px 0; }
  .kcard .cau{ font-size:11.5px; color:#92400e; margin-top:.4rem; }
  .kcard .loc{ font-size:11px; color:var(--blue); margin-top:.4rem; }
  textarea{ width:100%; font:inherit; font-size:13px; padding:8px; border:1px solid #cbd5e1;
            border-radius:6px; min-height:64px; resize:vertical; }
  .hint{ font-size:11.5px; color:#94a3b8; }
  #toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
          background:#1a1a1a; color:#fff; padding:9px 18px; border-radius:8px;
          font-size:13px; display:none; z-index:99; }
</style>
</head>
<body>
<header>
  <span class="logo">TOKIWA <b>HUB</b> 💡</span>
  <span class="tname">気づいたこと</span>
  <a href="../index.html">← Hub</a>
  <span class="user" id="hub-user"></span>
</header>

<main>
  <div class="sec">
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>

  <div class="sec">
    <div class="st">画面ごとにできること（説明はここが正）</div>
    <p class="hint" style="margin:0 0 .7rem">
      この説明は <code>tools/kinou.json</code> の1か所に書いてあり、
      各画面の「💡 気づいた」にも同じものが出ます。口で説明しなくて済むように。</p>
    <div class="kinou" id="kinou">読み込み中…</div>
  </div>

  <div class="sec">
    <div class="st">直した記録（更新履歴）</div>
    <div id="log">読み込み中…</div>
  </div>
</main>

<div id="toast"></div>

<script>
var DBKEY='murayama_v15', AUTHKEY='murayama_auth';
var GAS='https://script.google.com/a/macros/tokiwap-group.com/s/AKfycbw9-8Nnq3jV9lCDUEf7JOvQM_yAy1ZYnOIab-TYP3TZ-BtH7RosxKSeXmr-FvkxMVhv/exec';
var KEY='mitsumori-2024';
var 状態一覧=['未対応','対応中','直した','見送り'];
var いま='未対応';

function db(){ try{ return JSON.parse(localStorage.getItem(DBKEY))||null; }catch(e){ return null; } }
function auth(){ try{ return JSON.parse(localStorage.getItem(AUTHKEY))||{}; }catch(e){ return {}; } }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block';
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.style.display='none'; },2400); }
function メモ(){ var d=db(); return (d&&Array.isArray(d.kaizen))?d.kaizen:[]; }
function 日時(s){ try{ var d=new Date(s); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()
  +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }catch(e){ return ''; } }

function タブを描く(){
  var all=メモ();
  document.getElementById('tabs').innerHTML = 状態一覧.map(function(s){
    var n=all.filter(function(r){ return (r.状態||'未対応')===s; }).length;
    return '<button class="tab'+(s===いま?' on':'')+'" onclick="切替(\''+s+'\')">'
      + esc(s)+'<span class="cnt">'+n+'</span></button>';
  }).join('');
}
function 切替(s){ いま=s; タブを描く(); 一覧を描く(); }

function 一覧を描く(){
  var list=メモ().filter(function(r){ return (r.状態||'未対応')===いま; });
  list.sort(function(a,b){ return String(b.createdAt||'').localeCompare(String(a.createdAt||'')); });
  var el=document.getElementById('list');
  if(!list.length){
    el.innerHTML='<div class="empty">'+(いま==='未対応'
      ? '未対応はありません。各画面の「💡 気づいた」から送られたものがここに出ます'
      : 'ありません')+'</div>';
    return;
  }
  el.innerHTML=list.map(function(r){
    var st=r.状態||'未対応';
    return '<div class="memo'+(st==='直した'||st==='見送り'?' done':'')+'">'
      +'<div class="hd">'
      +'<span class="badge b-'+esc(st)+'">'+esc(st)+'</span>'
      +'<b>'+esc(r.画面||'')+'</b>'
      +(r.番号?'<span>'+esc(r.番号)+'</span>':'')
      +'<span>'+esc(r.書いた人||'')+'</span>'
      +'<span style="margin-left:auto">'+esc(日時(r.createdAt))+'</span>'
      +'</div>'
      +'<div class="body">'+esc(r.本文||'')+'</div>'
      +'<div class="act">'
      + 状態一覧.filter(function(s){ return s!==st; }).map(function(s){
          return '<button onclick="進める(\''+r.id+'\',\''+s+'\')">'+esc(s)+'にする</button>'; }).join('')
      +'<button onclick="文案(\''+r.id+'\')" title="更新履歴に載せる文をつくる">📋 履歴の文をつくる</button>'
      +'</div></div>';
  }).join('');
}

function 進める(id, s){
  var d=db(); if(!d){ toast('❌ 本体データが見つかりません。先に Hub にログインしてください'); return; }
  var r=(d.kaizen||[]).filter(function(x){ return x.id===id; })[0]; if(!r) return;
  r.状態=s; r._updatedAt=new Date().toISOString();
  var a=auth(); r.対応者=a.userName||'';
  try{ localStorage.setItem(DBKEY, JSON.stringify(d)); }catch(e){ toast('❌ 保存できません'); return; }
  雲へ();
  タブを描く(); 一覧を描く(); toast('「'+s+'」にしました');
}

function 文案(id){
  var r=メモ().filter(function(x){ return x.id===id; })[0]; if(!r) return;
  var t=(r.画面?r.画面+': ':'')+r.本文.replace(/\s+/g,' ').trim();
  navigator.clipboard.writeText(t).then(function(){
    toast('📋 写しました。changelog.json に貼ってください');
  }).catch(function(){ prompt('この文をコピーしてください', t); });
}

function 雲へ(){
  var a=auth(); if(!a.loggedIn||!a.companyId) return;
  var u=new URL(GAS); u.searchParams.set('action','syncAll');
  u.searchParams.set('apiKey',KEY); u.searchParams.set('companyId',a.companyId);
  fetch(u.toString(),{method:'GET',redirect:'follow'}).then(function(r){ return r.json(); })
    .then(function(r){ return (r&&(r.data||r))||null; }).catch(function(){ return null; })
    .then(function(cloud){
      var d=db(); if(!d||!cloud) return;
      var 見た={}, 出す=[];
      (d.kaizen||[]).concat(cloud.kaizen||[]).forEach(function(x){
        if(!x||!x.id) return;
        var 前=見た[x.id];
        if(!前){ 見た[x.id]=x; 出す.push(x.id); }
        else if(String(x._updatedAt||'')>String(前._updatedAt||'')) 見た[x.id]=x;
      });
      var 混=出す.map(function(i){ return 見た[i]; });
      d.kaizen=混;
      try{ localStorage.setItem(DBKEY, JSON.stringify(d)); }catch(e){}
      var data=Object.assign({},cloud); data.kaizen=混;
      var p=new URL(GAS); p.searchParams.set('action','saveAll'); p.searchParams.set('apiKey',KEY);
      fetch(p.toString(),{method:'POST',body:JSON.stringify({companyId:a.companyId,data:data}),redirect:'follow'});
    });
}

function 機能を描く(){
  fetch('kinou.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){ return r.json(); })
    .then(function(j){
      var keys=Object.keys(j).filter(function(k){ return k.charAt(0)!=='_'; });
      document.getElementById('kinou').innerHTML = keys.map(function(k){
        var v=j[k];
        return '<div class="kcard">'
          +'<div class="cat">'+esc(v.分類||'')+'</div>'
          +'<h3>'+esc(v.名前||k)+'</h3>'
          +(v.説明?'<div class="ds">'+esc(v.説明)+'</div>':'')
          +(v.できること?'<ul>'+v.できること.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>':'')
          +(v.注意?'<div class="cau">⚠ '+esc(v.注意)+'</div>':'')
          +(v.場所?'<div class="loc">📍 '+esc(v.場所)+'</div>':'')
          +'</div>';
      }).join('');
    })
    .catch(function(){ document.getElementById('kinou').innerHTML='<div class="empty">読み込めませんでした</div>'; });
}

function 履歴を描く(){
  fetch('../changelog.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){ return r.json(); })
    .then(function(list){
      document.getElementById('log').innerHTML=(list||[]).slice(0,6).map(function(e){
        return '<div style="font-weight:700;color:var(--blue);margin:.6rem 0 .1rem;font-size:12.5px">'
          +esc(e.date)+'</div><ul style="margin:0;padding-left:18px;font-size:13px">'
          +(e.items||[]).map(function(i){ return '<li>'+i+'</li>'; }).join('')+'</ul>';
      }).join('');
    })
    .catch(function(){ document.getElementById('log').innerHTML='<div class="empty">読み込めませんでした</div>'; });
}

(function(){
  var a=auth();
  document.getElementById('hub-user').textContent =
    a.loggedIn ? ('👤 '+(a.userName||'')+' / '+(a.companyName||'')) : '⚠ 本体未ログイン';
  タブを描く(); 一覧を描く(); 機能を描く(); 履歴を描く();
  雲へ();
})();
</script>
</body>
</html>
