<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定期のやること・入札 | Tokiwa Hub Tools</title>
<!--
  YARUKOTO-1（本多さん 9/30）: 定期のやること・来たらやること・案件
  ・毎年／2 年に一度の用事（入札参加資格の更新など）を、期限が近づいたらメールで知らせ、済むまで一覧に残す
  ・定期の連絡は、宛先・件名・本文のひな形から Gmail の下書きを開く（送るのは人）
  ・指名入札のように「来たらやる」ものは、誰が・どこに入って・何をするか をひな形にしておき、来たら 1 件の案件にする
  データは中継（tools/fm-relay/yarukoto.js）の帳簿。Google のサインインが要る。経営だけに見せる項目は 本多・福永 にしか返らない。
  このファイルには得意先・発注機関の名前を書かない（公開リポジトリ）。
-->
<style>
  :root{ --bg:#f4f3f0; --surface:#fff; --surface2:#faf9f6; --ink:#1c1b18; --muted:#6f6c66; --line:#e0ddd6; --line2:#cfcbc2;
    --accent:#3f6212; --accent-soft:#eef5e1; --over:#b3261e; --over-soft:#fbe9e7; --soon:#9a5b06; --soon-soft:#fdf1da; --far:#4b5563; --far-soft:#eef0f3; --link:#1d4ed8; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Yu Gothic UI','Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif; font-size:14px; line-height:1.6; }
  header{ background:#1c1b18; color:#fff; padding:9px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header a{ color:#d9f99d; text-decoration:none; font-weight:700; font-size:13px; }
  header h1{ font-size:16px; margin:0; font-weight:800; letter-spacing:.02em; }
  header .sp{ flex:1; }
  header .who{ font-size:12px; color:#d6d3cc; }
  main{ max-width:1180px; margin:0 auto; padding:14px 16px 60px; }
  button{ font:inherit; cursor:pointer; border:1px solid var(--line2); background:var(--surface); color:var(--ink); border-radius:7px; padding:6px 12px; font-weight:600; }
  button:hover{ border-color:var(--accent); }
  button.p{ background:var(--accent); border-color:var(--accent); color:#fff; }
  button.p:hover{ filter:brightness(1.1); }
  button.s{ padding:3px 9px; font-size:12px; }
  button.d{ color:var(--over); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  #msg{ min-height:22px; font-size:13px; color:var(--muted); margin:2px 0 8px; }
  #msg.err{ color:var(--over); font-weight:700; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tabs button{ border-radius:999px; padding:6px 14px; }
  .tabs button[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .tabs button b{ font-variant-numeric:tabular-nums; margin-left:4px; opacity:.8; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .bar input[type=search]{ font:inherit; padding:6px 10px; border:1px solid var(--line2); border-radius:7px; min-width:200px; background:var(--surface); }
  .bar label{ font-size:13px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .chip{ display:inline-block; font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--far-soft); color:var(--far); white-space:nowrap; }
  .chip.k{ background:#ede9fe; color:#5b21b6; }
  .list{ display:flex; flex-direction:column; gap:10px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; display:grid; grid-template-columns:132px minmax(0,1fr) auto; gap:0; overflow:hidden; }
  .card.hit{ box-shadow:0 0 0 3px #bbf7d0; }
  .when{ padding:12px 10px; text-align:center; border-right:1px solid var(--line); background:var(--far-soft); color:var(--far); display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .when .n{ font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.2; }
  .when .dt{ font-size:12px; font-variant-numeric:tabular-nums; }
  .when .cy{ font-size:11.5px; opacity:.85; }
  .when.over{ background:var(--over-soft); color:var(--over); }
  .when.soon{ background:var(--soon-soft); color:var(--soon); }
  .when.done{ background:var(--accent-soft); color:var(--accent); }
  .body{ padding:10px 14px; min-width:0; }
  .ttl{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .ttl .nm{ font-size:15.5px; font-weight:800; }
  .ttl .to{ color:var(--muted); font-size:13px; }
  .meta{ display:flex; gap:6px 16px; flex-wrap:wrap; font-size:13px; margin-top:3px; }
  .meta .k{ color:var(--muted); margin-right:4px; }
  .meta a{ color:var(--link); font-weight:700; }
  .steps{ list-style:none; margin:7px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .steps label{ display:flex; gap:7px; align-items:flex-start; font-size:13.5px; cursor:pointer; }
  .steps input{ margin-top:4px; width:15px; height:15px; accent-color:var(--accent); }
  .steps .ok{ color:var(--muted); text-decoration:line-through; }
  .steps .st{ font-size:11.5px; color:var(--accent); margin-left:6px; text-decoration:none; white-space:nowrap; }
  .memo{ font-size:12.5px; color:var(--muted); white-space:pre-wrap; margin-top:5px; }
  details.hist{ margin-top:6px; font-size:12.5px; }
  details.hist summary{ cursor:pointer; color:var(--muted); }
  details.hist ol{ margin:4px 0 0; padding-left:1.4em; color:#46433d; }
  .act{ padding:10px 12px; display:flex; flex-direction:column; gap:6px; align-items:stretch; border-left:1px solid var(--line); background:var(--surface2); min-width:150px; }
  .act .row2{ display:flex; gap:6px; }
  .act .row2 button{ flex:1; }
  .empty{ background:var(--surface); border:1px dashed var(--line2); border-radius:10px; padding:22px; text-align:center; color:var(--muted); }
  .empty .ex{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:12px; }
  .note{ font-size:12.5px; color:var(--muted); }
  dialog{ border:none; border-radius:12px; padding:0; width:min(760px,94vw); box-shadow:0 18px 60px rgba(0,0,0,.35); color:var(--ink); }
  dialog::backdrop{ background:rgba(0,0,0,.45); }
  dialog .dh{ padding:12px 18px; font-weight:800; background:#1c1b18; color:#fff; font-size:15px; }
  dialog .db{ padding:14px 18px; max-height:72vh; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  dialog .df{ padding:10px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  dialog .df .err{ color:var(--over); font-size:13px; font-weight:700; margin-right:auto; }
  .f{ display:grid; grid-template-columns:120px minmax(0,1fr); gap:8px; align-items:start; }
  .f > label{ font-size:12.5px; color:var(--muted); padding-top:7px; }
  .f input[type=text], .f input[type=date], .f input[type=number], .f input[type=email], .f input[type=url], .f select, .f textarea{ font:inherit; width:100%; padding:6px 9px; border:1px solid var(--line2); border-radius:7px; background:#fff; }
  .f textarea{ min-height:84px; resize:vertical; }
  .f .in{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .f .in > *{ flex:1 1 120px; min-width:0; }
  .f .in > span{ flex:0 0 auto; font-size:13px; color:var(--muted); }
  .seg{ display:flex; gap:0; border:1px solid var(--line2); border-radius:8px; overflow:hidden; }
  .seg label{ flex:1; text-align:center; padding:7px 8px; cursor:pointer; font-weight:700; font-size:13px; background:#fff; border-right:1px solid var(--line2); }
  .seg label:last-child{ border-right:0; }
  .seg input{ position:absolute; opacity:0; }
  .seg label:has(input:checked){ background:var(--ink); color:#fff; }
  fieldset.g{ border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin:0; display:flex; flex-direction:column; gap:8px; }
  fieldset.g legend{ font-size:12.5px; font-weight:800; padding:0 6px; }
  table.ppl{ border-collapse:collapse; width:100%; }
  table.ppl td{ padding:2px 4px 2px 0; }
  table.ppl input{ font:inherit; width:100%; padding:5px 8px; border:1px solid var(--line2); border-radius:6px; }
  @media (max-width:760px){ .card{ grid-template-columns:96px minmax(0,1fr); } .act{ grid-column:1 / -1; flex-direction:row; flex-wrap:wrap; border-left:0; border-top:1px solid var(--line); } .f{ grid-template-columns:1fr; } .f > label{ padding-top:0; } }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<body>
<header>
  <a href="../index.html" id="backHub">← Hub</a>
  <h1>定期のやること・入札</h1>
  <span class="sp"></span>
  <span id="signin"></span>
  <span class="who" id="who"></span>
  <button id="bSet" class="s" style="display:none">⚙ 知らせの設定</button>
  <button id="bAdd" class="p">＋ 足す</button>
</header>
<main>
  <div id="msg">読み込んでいます…</div>
  <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え">
    <button data-tab="now" aria-pressed="true">今やること<b id="cNow"></b></button>
    <button data-tab="teiki" aria-pressed="false">定期<b id="cTeiki"></b></button>
    <button data-tab="hina" aria-pressed="false">来たらやる<b id="cHina"></b></button>
    <button data-tab="anken" aria-pressed="false">案件リスト<b id="cAnken"></b></button>
  </div>
  <div class="bar">
    <input type="search" id="q" placeholder="名前・相手・担当で絞る" aria-label="絞り込み">
    <label id="lDone" style="display:none"><input type="checkbox" id="showDone"> 済んだ案件も出す</label>
    <span class="note" id="tabNote"></span>
  </div>
  <div class="list" id="list"></div>
  <p class="note" id="foot" style="margin-top:16px"></p>
</main>

<!-- 足す・直す -->
<dialog id="dEdit"><div class="dh" id="eTitle">足す</div><div class="db">
  <div class="seg" id="eKind">
    <label><input type="radio" name="kind" value="定期" checked>定期（毎年・2 年ごと など）</label>
    <label><input type="radio" name="kind" value="ひな形">来たらやる（指名入札など）</label>
    <label><input type="radio" name="kind" value="案件">1 回きりの案件</label>
  </div>
  <div class="f"><label for="eName">名前</label><input type="text" id="eName" maxlength="100" placeholder="例: ○○市 入札参加資格の更新"></div>
  <div class="f"><label for="eCat">分類・相手</label><div class="in"><input type="text" id="eCat" list="cats" maxlength="40" placeholder="分類（入札参加資格 など）"><input type="text" id="eTo" maxlength="100" placeholder="相手（役所・機関の名前）"></div></div>
  <datalist id="cats"><option value="入札参加資格"><option value="指名入札"><option value="定期連絡"><option value="届出・更新"><option value="その他"></datalist>
  <div class="f" id="rDue"><label for="eDue" id="lDue">次の期限</label><div class="in"><input type="date" id="eDue"><span id="sCyc">周期</span><input type="number" id="eCycN" min="1" max="120" value="1" style="max-width:80px"><select id="eCycU" style="max-width:110px"><option value="年">年ごと</option><option value="月">か月ごと</option><option value="週">週間ごと</option><option value="日">日ごと</option></select></div></div>
  <div class="f" id="rCount"><label for="eCount">次回の数え方</label><select id="eCount"><option value="期限">期限の日から数える（毎回 同じ時期に来るもの。更新・申請など）</option><option value="済んだ日">済ませた日から数える（連絡など、間をあけたいもの）</option></select></div>
  <div class="f"><label for="eWho">担当（誰が）</label><div class="in"><input type="text" id="eWho" list="ppl" maxlength="40" placeholder="名前"><input type="email" id="eWhoMail" maxlength="120" placeholder="知らせ先メール（空なら設定の人・既定の知らせ先）"><span id="sLead">知らせ始め</span><input type="number" id="eLead" min="0" max="365" placeholder="自動" style="max-width:90px" title="期限の何日前からメールで知らせるか。空＝年単位のものは 30 日前、ほかは 7 日前"><span id="sLead2">日前</span></div></div>
  <datalist id="ppl"></datalist>
  <fieldset class="g"><legend>どこに入って、何をするか</legend>
    <div class="f"><label for="eSite">どこに入る</label><div class="in"><input type="text" id="eSite" maxlength="80" placeholder="サイト・窓口の名前（例: 電子入札システム）"><input type="url" id="eUrl" maxlength="500" placeholder="https://…（開くページ）"></div></div>
    <div class="f"><label for="eSiteMemo">入り方のメモ</label><input type="text" id="eSiteMemo" maxlength="500" placeholder="ID・IC カードの保管場所など。パスワードそのものは書かない"></div>
    <div class="f"><label for="eSteps">手順</label><textarea id="eSteps" placeholder="1 行に 1 つ。上から順に。&#10;例:&#10;必要書類を確認する&#10;申請を出す&#10;受付票を保存する"></textarea></div>
  </fieldset>
  <fieldset class="g" id="gMail"><legend>メールのひな形（定期の連絡など。要らなければ空のまま）</legend>
    <div class="f"><label for="eMto">宛先・CC</label><div class="in"><input type="text" id="eMto" maxlength="300" placeholder="宛先（カンマ区切り）"><input type="text" id="eMcc" maxlength="300" placeholder="CC"></div></div>
    <div class="f"><label for="eMsub">件名</label><input type="text" id="eMsub" maxlength="200"></div>
    <div class="f"><label for="eMbody">本文</label><textarea id="eMbody" style="min-height:120px" placeholder="毎回ここから下書きを開き、内容を直してから自分で送ります"></textarea></div>
  </fieldset>
  <div class="f"><label for="eMemo">メモ</label><textarea id="eMemo" style="min-height:56px" maxlength="2000"></textarea></div>
  <div class="f" id="rOpt"><label>そのほか</label><div class="in"><label style="flex:0 0 auto;display:flex;gap:6px;align-items:center;font-size:13px" id="lKeiei"><input type="checkbox" id="eKeiei"> 経営だけに見せる（本多・福永）</label><label style="flex:0 0 auto;display:flex;gap:6px;align-items:center;font-size:13px" id="lStop"><input type="checkbox" id="eStop"> いまは止める（知らせない）</label></div></div>
</div><div class="df"><span class="err" id="eErr"></span><button id="eCancel">やめる</button><button id="eSave" class="p">保存</button></div></dialog>

<!-- 済んだ -->
<dialog id="dDone"><div class="dh" id="dnTitle">済んだ</div><div class="db">
  <div id="dnLead" style="font-weight:700"></div>
  <div class="f"><label for="dnDay">済ませた日</label><input type="date" id="dnDay"></div>
  <div class="f" id="rNext"><label for="dnNext">次回の期限</label><div class="in"><input type="date" id="dnNext"><span id="dnNextNote" class="note"></span></div></div>
  <div class="f" id="rRes"><label for="dnRes">結果</label><select id="dnRes"><option value="">（選ばない）</option><option>落札</option><option>不落</option><option>辞退</option><option>提出した</option><option>見送り</option></select></div>
  <div class="f"><label for="dnMemo">メモ</label><textarea id="dnMemo" style="min-height:60px" maxlength="500" placeholder="何をしたか、次回のために残しておくこと"></textarea></div>
</div><div class="df"><span class="err" id="dnErr"></span><button id="dnCancel">やめる</button><button id="dnOk" class="p">済んだ</button></div></dialog>

<!-- ひな形 → 案件 -->
<dialog id="dCase"><div class="dh">案件にする</div><div class="db">
  <div id="csLead" class="note"></div>
  <div class="f"><label for="csName">件名</label><input type="text" id="csName" maxlength="100" placeholder="例: 広報紙 印刷（○月分）"></div>
  <div class="f"><label for="csDue">期限</label><div class="in"><input type="date" id="csDue"><span class="note">入札・提出の締切日</span></div></div>
  <div class="f"><label for="csWho">担当（誰が）</label><div class="in"><input type="text" id="csWho" list="ppl" maxlength="40"><input type="email" id="csWhoMail" maxlength="120" placeholder="知らせ先メール"></div></div>
  <div class="f"><label for="csMemo">メモ</label><textarea id="csMemo" style="min-height:60px" maxlength="2000" placeholder="通知が来た日・予定価格・仕様の要点など"></textarea></div>
</div><div class="df"><span class="err" id="csErr"></span><button id="csCancel">やめる</button><button id="csOk" class="p">案件リストに入れる</button></div></dialog>

<!-- 知らせの設定（本多・福永） -->
<dialog id="dSet"><div class="dh">知らせの設定</div><div class="db">
  <fieldset class="g"><legend>毎朝のメール</legend>
    <div id="stState" style="font-weight:700"></div>
    <div class="note">期限が近づいた日に 1 回 → そのあと週 1 回 → 期限の 3 日前からと、過ぎたあとは毎日。済んだら止まります。1 人に 1 通にまとめて届きます（差出人は info@ のアドレス）。</div>
    <div class="in" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button id="stOn" class="p">毎朝の知らせを入れる</button><button id="stOff">外す</button><button id="stTest">試しに自分へ 1 通送る</button><span class="note" id="stRes"></span></div>
    <div class="f"><label for="stHour">送る時刻</label><div class="in"><select id="stHour" style="max-width:120px"></select><span class="note">時台（だいたいの時刻）</span></div></div>
    <div class="f"><label for="stTo">既定の知らせ先</label><input type="email" id="stTo" maxlength="120" placeholder="担当が決まっていないものの知らせ先（空なら本多さん）"></div>
  </fieldset>
  <fieldset class="g"><legend>人（担当に選ぶ名前と、その人のメール）</legend>
    <table class="ppl" id="stPpl"></table>
    <div><button id="stAddP" class="s">＋ 人を足す</button></div>
  </fieldset>
</div><div class="df"><span class="err" id="stErr"></span><button id="stCancel">閉じる</button><button id="stSave" class="p">保存</button></div></dialog>

<script src="fm-bridge.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var S = { 行: [], 設定: { 人: [], 知らせ先: '', 時刻: 8 }, 管理者: false, 今日: '', user: '', 知らせ: {} };
  var tab = 'now', busy = false, editing = null, doneFor = null, caseFor = null, hitId = '';
  // YARUKOTO-3: ?one=<id> … Hub の問い合わせ「定期でやること」から 1 件だけ開いたとき。一覧・登録・設定は出さず、その 1 件だけ
  var one = ''; try { one = (new URLSearchParams(location.search).get('one') || '').replace(/[^\w-]/g, ''); } catch (e) {}

  /* ---------- 日付（中継の yarukoto.js と同じ決まり） ---------- */
  function 日(s) { var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s || '')); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; }
  function 文字(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
  function 足す(d0, 数, 単位) { var ms = 日(d0); if (isNaN(ms)) return ''; 数 = Number(数) || 0; if (単位 === '日') return 文字(ms + 数 * 864e5); if (単位 === '週') return 文字(ms + 数 * 7 * 864e5);
    var d = new Date(ms), mm = d.getUTCMonth() + (単位 === '年' ? 数 * 12 : 数), y2 = d.getUTCFullYear() + Math.floor(mm / 12), m2 = ((mm % 12) + 12) % 12, 末 = new Date(Date.UTC(y2, m2 + 1, 0)).getUTCDate(); return 文字(Date.UTC(y2, m2, Math.min(d.getUTCDate(), 末))); }
  function 次回(行, 済んだ日) { var 周 = 行.周期 || {}, 数 = Number(周.数) || 0; if (数 <= 0) return ''; var 元 = 行.数え方 === '済んだ日' ? (済んだ日 || S.今日) : (行.期限 || 済んだ日 || S.今日); var 次 = 足す(元, 数, 周.単位 || '年'), n = 0; while (次 && 次 <= S.今日 && n++ < 400) 次 = 足す(次, 数, 周.単位 || '年'); return 次; }

    else if (a === 'case') openCase(x);
    else if (a === 'juchu') window.open('fm-juchu-hub.html?q=' + encodeURIComponent(x.名前 || ''), '_blank', 'noopener');
    else if (a === 'mail') { var メ = x.メール || {};   // Gmail の新規作成を開くだけ。直して送るのは人
      var u = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(メ.to || '') + (メ.cc ? '&cc=' + encodeURIComponent(メ.cc) : '') + '&su=' + encodeURIComponent(メ.件名 || '') + '&body=' + encodeURIComponent(メ.本文 || '');
      window.open(u, '_blank', 'noopener');
      call('やること_記録', [x.id, 'メールの下書きを開いた', ''], '').then(function (r) { put(r.行); say('Gmail の下書きを開きました。内容を直して送ったら「済んだ」を押してください。'); render(); }).catch(function (e) { say('下書きは開きましたが、履歴に残せませんでした: ' + (e.message || e), true); }); }
    else if (a === 'del') { if (!confirm('「' + (x.名前 || '') + '」を消します。よろしいですか？\n（一覧から消えます。履歴ごと見えなくなります）')) return;
      call('やること_消す', [x.id], '消しています…').then(function () { S.行 = S.行.filter(function (v) { return v.id !== x.id; }); 知らせる(); say('消しました。'); render(); }).catch(function (e) { say('消せませんでした: ' + (e.message || e), true); }); }
  });
  $('list').addEventListener('change', function (ev) {
    var c = ev.target.closest('input[data-step]'); if (!c) return; var card = ev.target.closest('.card'); var id = card.dataset.id, n = Number(c.dataset.step), on = c.checked;
    call('やること_手順', [id, n, on], '').then(function (r) { put(r.行); say(''); render(); }).catch(function (e) { c.checked = !on; say('印を付けられませんでした: ' + (e.message || e), true); });
  });
  $('tabs').addEventListener('click', function (ev) { var b = ev.target.closest('button[data-tab]'); if (!b) return; tab = b.dataset.tab; hitId = ''; render(); });
  $('q').addEventListener('input', render); $('showDone').addEventListener('change', render);

  /* ---------- 知らせの設定 ---------- */
  function pplRow(p) { return '<tr><td style="width:36%"><input type="text" maxlength="40" placeholder="名前" value="' + esc((p && p.名前) || '') + '"></td><td><input type="email" maxlength="120" placeholder="メール（社内のアドレス）" value="' + esc((p && p.メール) || '') + '"></td><td style="width:44px"><button class="s d" data-rm="1" title="この人を外す">×</button></td></tr>'; }
  function setState() { var on = S.知らせ && S.知らせ.入っている; $('stState').textContent = on === true ? '毎朝の知らせ: 入っています' : on === false ? '毎朝の知らせ: まだ入っていません' : '毎朝の知らせ: 状態を確かめられませんでした'; $('stOn').style.display = on === true ? 'none' : ''; $('stOff').style.display = on === true ? '' : 'none'; }
  $('bSet').onclick = function () {
    $('stErr').textContent = ''; $('stRes').textContent = ''; var h = ''; for (var i = 5; i <= 20; i++) h += '<option value="' + i + '">' + i + ' 時</option>'; $('stHour').innerHTML = h; $('stHour').value = String(S.設定.時刻 == null ? 8 : S.設定.時刻);
    $('stTo').value = S.設定.知らせ先 || ''; $('stPpl').innerHTML = ((S.設定.人 || []).length ? S.設定.人 : [{}]).map(pplRow).join(''); setState(); $('dSet').showModal();
  };
  $('stAddP').onclick = function () { $('stPpl').insertAdjacentHTML('beforeend', pplRow({})); };
  $('stPpl').addEventListener('click', function (ev) { var b = ev.target.closest('[data-rm]'); if (b) b.closest('tr').remove(); });
  $('stCancel').onclick = function () { $('dSet').close(); };
  function readSet() { var 人 = []; $('stPpl').querySelectorAll('tr').forEach(function (tr) { var i = tr.querySelectorAll('input'); if (i[0].value.trim()) 人.push({ 名前: i[0].value.trim(), メール: i[1].value.trim() }); }); return { 人: 人, 知らせ先: $('stTo').value.trim(), 時刻: Number($('stHour').value) }; }
  function saveSet() { return call('やること_設定_書く', [readSet()], '').then(function (r) { S.設定 = r.設定; $('ppl').innerHTML = (S.設定.人 || []).map(function (p) { return '<option value="' + esc(p.名前) + '">'; }).join(''); }); }
  $('stSave').onclick = function () { $('stErr').textContent = ''; saveSet().then(function () { $('dSet').close(); say('設定を保存しました。'); render(); }).catch(function (e) { $('stErr').textContent = e.message || String(e); }); };
  $('stOn').onclick = function () { $('stErr').textContent = ''; saveSet().then(function () { return call('やること_知らせを入れる', [true], ''); }).then(function (r) { S.知らせ = r.知らせ; setState(); render(); $('stRes').textContent = '入れました。明日の朝から届きます。'; }).catch(function (e) { $('stErr').textContent = e.message || String(e); }); };
  $('stOff').onclick = function () { if (!confirm('毎朝のメールの知らせを外します。よろしいですか？')) return; $('stErr').textContent = ''; call('やること_知らせを入れる', [false], '').then(function (r) { S.知らせ = r.知らせ; setState(); render(); $('stRes').textContent = '外しました。'; }).catch(function (e) { $('stErr').textContent = e.message || String(e); }); };
  $('stTest').onclick = function () { if (!confirm('いま期限が近いもの全部を、自分（' + S.user + '）あてに 1 通だけ送ります。よろしいですか？')) return; $('stErr').textContent = ''; $('stRes').textContent = '送っています…';
    call('やること_今すぐ知らせる', [], '').then(function (r) { var o = (r.出した || [])[0]; $('stRes').textContent = o ? o.宛先 + ' に ' + o.件数 + ' 件ぶんを送りました。' : (r.失敗 && r.失敗.length ? '送れませんでした: ' + r.失敗[0].理由 : 'いま期限が近いものが無いので、送りませんでした。'); }).catch(function (e) { $('stRes').textContent = ''; $('stErr').textContent = e.message || String(e); }); };

  /* ---------- 起動 ---------- */
  if (中か) $('backHub').style.display = 'none';
  if (one) { document.querySelector('header').style.display = 'none'; $('tabs').style.display = 'none'; document.querySelector('.bar').style.display = 'none'; document.querySelector('main').style.paddingTop = '10px'; }
  try { FM.サインインのボタンを置く($('signin')); } catch (e) {}
  window.addEventListener('fm-signin', function (ev) { if (ev.detail && ev.detail.email && !S.user && !busy) load(); });
  window.addEventListener('hashchange', jump);
  load();
})();
</script>
</body>
</html>
