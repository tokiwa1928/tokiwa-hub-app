<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hub の設定</title>
<script src="hub-auth.js"></script>
<style>
  body{font:15px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:24px 16px}
  .box{max-width:560px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;padding:20px 22px}
  h1{font-size:19px;margin:0 0 6px} p{color:#475569;margin:4px 0 14px;font-size:13px}
  label{display:block;font-weight:700;margin:12px 0 4px;font-size:13px}
  input{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:1px solid #94a3b8}
  button{font:inherit;font-weight:700;padding:9px 20px;border:0;background:#0f766e;color:#fff;cursor:pointer;margin-top:16px}
  button:disabled{opacity:.5}
  #out{margin-top:16px;font-size:13px;white-space:pre-wrap;background:#f1f5f9;padding:10px 12px;display:none}
  .ok{color:#065f46;font-weight:700} .ng{color:#b91c1c;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <h1>🔑 Box の鍵を Hub に入れる</h1>
  <p>Box 開発者コンソールの「Tokiwa Hub」アプリの値を入れます。入れた値は Hub（会社の Apps Script）に直接送られ、この画面にもあとで表示されません。管理者だけが使えます。</p>
  <div id="now">いまの状態を見ています…</div>
  <label for="cid">クライアント ID（BOX_CLIENT_ID）</label><input id="cid" autocomplete="off" spellcheck="false">
  <label for="sec">クライアントシークレット（BOX_CLIENT_SECRET）</label><input id="sec" type="password" autocomplete="new-password" spellcheck="false">
  <label for="ent">Enterprise ID（BOX_ENTERPRISE_ID）</label><input id="ent" autocomplete="off" spellcheck="false" inputmode="numeric">
  <button id="go">保存してつながるか試す</button>
  <div id="out"></div>
</div>
<div class="box" style="margin-top:16px">
  <h1>🧹 使っていない設定（スクリプト プロパティ）を片付ける</h1>
  <p>Hub のコードが使っていない名前だけを出します（値は出しません）。使っているもの（鍵・同期の記録など）はここからは消せません。消したものは元に戻せないので、知らない名前は残してください。</p>
  <button id="audit" style="background:#334155">一覧を見る</button>
  <div id="plist" style="margin-top:12px;font-size:13px"></div>
</div>
<script>
(function(){
  var HUB='https://script.google.com/a/macros/tokiwap-group.com/s/AKfycbw9-8Nnq3jV9lCDUEf7JOvQM_yAy1ZYnOIab-TYP3TZ-BtH7RosxKSeXmr-FvkxMVhv/exec';
  function call(action, body){ body=body||{}; body.action=action;
    return fetch(HUB+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}).then(function(r){ return r.json(); }); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function show(r){
    var o=document.getElementById('out'); o.style.display='block';
    if(!r||!r.success){ o.innerHTML='<span class="ng">できませんでした: '+esc(r&&r.error||'通信の失敗')+'</span>'; return; }
    var h='Box: '+(r.token==='つながりました'?'<span class="ok">✓ つながりました</span>':'<span class="ng">'+esc(r.token||'')+'</span>');
    (r.folders||[]).forEach(function(f){ h+='\n・'+esc(f.company)+' … '+(f.code===200?'<span class="ok">見えます</span>（'+esc(f.name)+'・'+(f.items==null?'?':f.items)+' 件）':'<span class="ng">見えません（'+f.code+'）'+(f.code===404?' → サービスアカウントをフォルダに招待してください':'')+'</span>'); });
    o.innerHTML=h;
  }
  function status(){ call('boxKeysStatus').then(function(r){
      var n=document.getElementById('now');
      if(!r||!r.success){ n.innerHTML='<span class="ng">'+esc(r&&r.error||'通信の失敗')+'</span>'; return; }
      var has=r.has||{}; n.innerHTML='入っている鍵: '+['BOX_CLIENT_ID','BOX_CLIENT_SECRET','BOX_ENTERPRISE_ID'].map(function(k){ return k.replace('BOX_','')+(has[k]?' ✓':' ×'); }).join('　');
      if(has.BOX_CLIENT_ID) show(r);
    }).catch(function(e){ document.getElementById('now').textContent='読めませんでした: '+e; }); }
  document.getElementById('go').onclick=function(){
    var b={ BOX_CLIENT_ID:document.getElementById('cid').value.trim(), BOX_CLIENT_SECRET:document.getElementById('sec').value.trim(), BOX_ENTERPRISE_ID:document.getElementById('ent').value.trim() };
    if(!b.BOX_CLIENT_ID&&!b.BOX_CLIENT_SECRET&&!b.BOX_ENTERPRISE_ID){ alert('どれか入れてください'); return; }
    var btn=this; btn.disabled=true; btn.textContent='保存しています…';
    call('boxKeysSet', b).then(function(r){ show(r); document.getElementById('sec').value=''; status(); })
      .catch(function(e){ show({ success:false, error:String(e) }); })
      .then(function(){ btn.disabled=false; btn.textContent='保存してつながるか試す'; });
  };
  document.getElementById('audit').onclick=function(){
    var el=document.getElementById('plist'); el.textContent='読んでいます…';
    call('propsAudit').then(function(r){
      if(!r||!r.success){ el.innerHTML='<span class="ng">'+esc(r&&r.error||'通信の失敗')+'</span>'; return; }
      var un=r.items.filter(function(x){ return !x.used; });
      var h='全部で <b>'+r.total+'</b> 個（Apps Script の画面で編集できるのは 50 個まで）・使っていないもの <b>'+un.length+'</b> 個';
      if(un.length){ h+='<div style="margin:8px 0">'+un.map(function(x){ return '<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin:3px 0"><input type="checkbox" class="pdel" value="'+esc(x.name)+'" checked style="width:auto"> '+esc(x.name)+' <span style="color:#94a3b8">（'+x.size+' 文字）</span></label>'; }).join('')+'</div><button id="pdelgo" style="background:#b91c1c">チェックしたものを消す</button>'; }
      h+='<details style="margin-top:10px"><summary style="cursor:pointer;color:#475569">使っているもの（'+(r.total-un.length)+' 個）</summary><div style="color:#475569">'+r.items.filter(function(x){ return x.used; }).map(function(x){ return esc(x.name); }).join('、')+'</div></details>';
      el.innerHTML=h;
      var go=document.getElementById('pdelgo'); if(go) go.onclick=function(){
        var names=[].slice.call(document.querySelectorAll('.pdel:checked')).map(function(c){ return c.value; });
        if(!names.length) return; if(!confirm(names.length+' 個を消します。元に戻せません。よろしいですか？')) return;
        go.disabled=true; call('propsDelete',{ names:names }).then(function(d){
          if(!d||!d.success){ alert('できませんでした: '+(d&&d.error)); go.disabled=false; return; }
          alert(d.deleted.length+' 個を消しました。残り '+d.left+' 個'+(d.kept.length?'（使っているので残したもの: '+d.kept.join(', ')+'）':'')); document.getElementById('audit').click(); });
      };
    }).catch(function(e){ el.textContent='読めませんでした: '+e; });
  };
  status();
})();
</script>
</body>
</html>
