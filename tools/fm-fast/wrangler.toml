# 速い中継（Cloudflare Workers）── FAST-5（11/4）
#   受注入力が FileMaker を読む通信（画面_読み込み・画面_recordIdで読む）だけをここで受ける。
#   Apps Script の中継（tools/fm-relay）は 1 往復 1.5〜2 秒かかるので、よく使う読みだけをこちら（0.1〜0.2 秒）へ。
#   書く・写し・帳簿・Drive は今までどおり Apps Script。
#
#   配る: GitHub Actions「速い中継を Cloudflare へ配る」（.github/workflows/fast-deploy.yml）
#   秘密: FM_REFRESH_TOKEN（Claris ID の更新トークン。GitHub の secret → wrangler secret）
name = "tokiwa-fm-fast"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[vars]
FM_HOST = "tokiwa.account.filemaker-cloud.com"
FM_DB = "トキワ印刷DB"
LAYOUT = "Hub受注"
COGNITO = "https://cognito-idp.us-west-2.amazonaws.com/"
CLIENT_ID = "4l9rvl4mv5es1eep1qe97cautn"
WEB_CLIENT_ID = "301364298857-pmt4p3fq440fh6hct3m8avcnlf11jos7.apps.googleusercontent.com"
ALLOWED_DOMAIN = "tokiwap-group.com,tokiwap.co.jp"
