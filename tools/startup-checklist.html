<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会社 立上げ・引継ぎ チェックリスト | Tokiwa Hub Tools</title>
<style>
  :root{ --ink:#1a1a1a; --line:#e0ddd6; --bg:#f4f3f0; --cyan:#0891b2; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif; background:var(--bg); color:var(--ink); font-size:13px; }
  header{ background:var(--ink); color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; }
  header .logo{ font-weight:800; font-size:14px; } header .logo b{ color:#a3e635; }
  header .tname{ font-size:15px; font-weight:800; }
  header .back{ margin-left:auto; font-size:12px; color:#cbd5e1; text-decoration:none; }
  main{ max-width:960px; margin:14px auto; padding:0 14px; }
  .bar{ position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .tab{ padding:6px 12px; border:1px solid var(--line); border-radius:20px; background:#fff; cursor:pointer; font-weight:700; font-size:12px; }
  .tab.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn{ padding:6px 12px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; font-size:12px; font-weight:700; font-family:inherit; }
  .btn.pri{ background:var(--cyan); color:#fff; border-color:var(--cyan); }
  .prog{ flex:1; min-width:150px; height:12px; background:#e5e3dc; border-radius:8px; overflow:hidden; }
  .prog > i{ display:block; height:100%; background:linear-gradient(90deg,#22c55e,#16a34a); width:0; transition:width .2s; }
  .pnum{ font-weight:800; font-size:13px; }
  .sec{ background:#fff; border:1px solid var(--line); border-radius:10px; margin:12px 0; overflow:hidden; }
  .sh{ display:flex; align-items:center; gap:10px; padding:10px 14px; background:#fafaf8; border-bottom:1px solid var(--line); cursor:pointer; }
  .sh h2{ font-size:14px; margin:0; flex:1; }
  .sh .sp{ font-size:12px; color:#64748b; font-weight:700; }
  .items{ padding:4px 0; }
  .it{ display:flex; gap:10px; padding:8px 14px; border-bottom:1px dashed #eee; align-items:flex-start; }
  .it:last-child{ border-bottom:none; }
  .it.done{ background:#f0fdf4; }
  .it input[type=checkbox]{ width:20px; height:20px; margin-top:1px; flex:0 0 auto; cursor:pointer; }
  .it .body{ flex:1; min-width:0; }
  .it .t{ font-weight:700; font-size:13.5px; line-height:1.4; }
  .it.done .t{ text-decoration:line-through; color:#6b7280; }
  .it .meta{ margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .badge{ font-size:10.5px; font-weight:700; border-radius:10px; padding:1px 8px; }
  .b-to{ background:#e0f2fe; color:#075985; }
  .b-due{ background:#fee2e2; color:#b91c1c; }
  .it .sub{ display:flex; gap:8px; margin-top:5px; flex-wrap:wrap; align-items:center; }
  .it .sub input{ font-family:inherit; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:3px 7px; }
  .it .memo{ flex:1; min-width:140px; }
  .del{ border:none; background:none; color:#c4c4c4; cursor:pointer; font-size:15px; }
  .del:hover{ color:#b91c1c; }
  .addrow{ padding:8px 14px; display:flex; gap:6px; flex-wrap:wrap; }
  .addrow input{ font-family:inherit; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  .note{ font-size:11px; color:#94a3b8; margin:8px 0; line-height:1.6; }
  #toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:#fff; padding:9px 18px; border-radius:8px; font-size:13px; display:none; z-index:99; }
  @media print{
    header,.bar,.addrow,.del,.back{ display:none !important; }
    .note.printhide{ display:none; }
    body{ background:#fff; } main{ max-width:none; }
    .sec{ break-inside:avoid; } .it .sub{ display:none; }
  }
</style>
</head>
<body>
<header>
  <span class="logo">TOKIWA <b>HUB</b></span>
  <span class="tname">✅ 会社 立上げ・引継ぎ チェックリスト</span>
  <a class="back" href="../index.html">← Hubへ戻る</a>
</header>
<main>
  <div class="bar">
    <input id="proj" placeholder="対象（会社名・案件名）" style="font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:180px" oninput="saveProj()">
    <div class="prog"><i id="prog-all"></i></div>
    <span class="pnum" id="pnum-all">0%</span>
    <label style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="hideDone" onchange="render()"> 未完了のみ</label>
    <button class="btn" onclick="window.print()">🖨 印刷</button>
    <button class="btn" onclick="resetAll()">🧹 チェック全解除</button>
  </div>
  <div id="tabs" class="bar" style="border-top:none;top:44px"></div>
  <div id="list"></div>
  <p class="note printhide">※ 一般的な目安です。要否・期限・添付書類は状況で変わります。登記・税務・社会保険は<b>司法書士／税理士／社労士</b>にご確認ください。チェック状態はこの端末に保存されます。</p>
</main>
<div id="toast"></div>
<script>
var KEY='setup_checklist_v1';
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){t.style.display='none';},2200); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

// ── チェックリスト本体（提出先 to / 期限 due）──
var DATA=[
 { id:'setup', name:'① 会社立ち上げ（設立）', items:[
   {t:'事業計画・資金計画（自己資金／借入／補助金）'},
   {t:'基本事項を決定：商号・事業目的・本店所在地・資本金・役員・事業年度'},
   {t:'印鑑を作成（会社実印・銀行印・角印）'},
   {t:'定款を作成 →（株式会社は）公証役場で認証', to:'公証役場'},
   {t:'資本金の払込 → 払込証明を作成'},
   {t:'設立登記を申請', to:'法務局', due:'発起人決定後すみやかに'},
   {t:'登記事項証明書・印鑑証明書を取得（各種届出で使用）', to:'法務局'},
   {t:'法人名義の銀行口座を開設', to:'銀行'}
 ]},
 { id:'tax', name:'② 設立後の税務手続き書類', items:[
   {t:'法人設立届出書', to:'税務署', due:'設立日から2か月以内'},
   {t:'青色申告の承認申請書（最優先・特典大）', to:'税務署', due:'設立3か月以内と第1期末前日の早い方'},
   {t:'給与支払事務所等の開設届出書', to:'税務署', due:'開設から1か月以内'},
   {t:'源泉所得税の納期の特例の承認申請書（従業員10人未満）', to:'税務署', due:'随時'},
   {t:'棚卸資産の評価方法の届出書（任意）', to:'税務署', due:'第1期の申告期限まで'},
   {t:'減価償却資産の償却方法の届出書（任意）', to:'税務署', due:'第1期の申告期限まで'},
   {t:'適格請求書発行事業者の登録申請書（インボイス）', to:'税務署'},
   {t:'消費税課税事業者選択届出書（該当時・還付狙い等）', to:'税務署'},
   {t:'消費税簡易課税制度選択届出書（該当時）', to:'税務署'},
   {t:'事前確定届出給与に関する届出書（役員賞与を損金にする場合）', to:'税務署', due:'総会1か月／期首4か月の早い方'},
   {t:'法人設立届出書（法人事業税・都道府県民税）', to:'都道府県税事務所', due:'15日〜1か月目安'},
   {t:'法人設立届出書（法人市町村民税）※東京23区は都税に一本化', to:'市区町村', due:'自治体の期限'}
 ]},
 { id:'insurance', name:'③ 社会保険・労働保険（人を雇う場合）', items:[
   {t:'健康保険・厚生年金保険 新規適用届', to:'年金事務所', due:'事実発生から5日以内'},
   {t:'被保険者資格取得届（役員・従業員）', to:'年金事務所', due:'5日以内'},
   {t:'健康保険 被扶養者（異動）届（扶養家族がいる場合）', to:'年金事務所'},
   {t:'労働保険 保険関係成立届', to:'労働基準監督署', due:'成立から10日以内'},
   {t:'概算保険料申告書', to:'労働基準監督署', due:'成立から50日以内'},
   {t:'雇用保険 適用事業所設置届', to:'ハローワーク', due:'設置から10日以内'},
   {t:'雇用保険 被保険者資格取得届', to:'ハローワーク', due:'翌月10日まで'},
   {t:'就業規則の届出（常時10人以上）／36協定・時間外協定', to:'労働基準監督署'}
 ]},
 { id:'handover', name:'④ 事業引継ぎ（代表者変更ほか）', items:[
   {t:'役員変更登記（代表取締役の変更）', to:'法務局', due:'就任/退任から2週間以内'},
   {t:'株主総会・取締役会議事録／必要なら定款変更'},
   {t:'異動届出書（代表者変更）', to:'税務署'},
   {t:'異動届（法人事業税・住民税）', to:'都道府県・市区町村'},
   {t:'事業所関係変更（訂正）届', to:'年金事務所'},
   {t:'労働保険・雇用保険の事業主（代表者）変更届', to:'労基署・ハローワーク'},
   {t:'代表者・届出印・口座名義の変更、借入/連帯保証の見直し', to:'銀行'},
   {t:'インボイス登録情報（代表者）の確認・届出', to:'税務署'},
   {t:'許認可の名義変更（該当時：古物・産廃収集運搬 等）'},
   {t:'代表者印・銀行印・会社実印の見直し／印鑑カード'},
   {t:'表記差し替え：名刺・角印・封筒・帳票（請求/納品/見積）・ウェブ'},
   {t:'取引先・金融機関へ挨拶状／代表者変更のご案内'},
   {t:'各種契約の名義変更：リース・賃貸借・保険・通信・公共料金・サブスク'}
 ]},
 { id:'print', name:'⑤ 印刷事業を引き継ぐ/始める時の実務', items:[
   {t:'設備：印刷機・製版/CTP・断裁・製本/後加工の保守契約・点検記録・消耗品在庫'},
   {t:'データ/RIP：ホットフォルダ・RIP・カラープロファイル(ICC)・面付け・出力条件'},
   {t:'版・データ保管：刷版(棚版)と入稿/完全データの所在・命名規則・保管年限'},
   {t:'得意先資産：得意先マスタ・単価表・リピート版(製品番号)・仕様履歴'},
   {t:'仕入・外注：用紙/インキの掛け条件、製本・特殊加工・配送の外注先と単価'},
   {t:'進行管理：進行中案件・受注残・見積中・校正中・支給品/預り品の一覧化'},
   {t:'産廃・環境：廃インキ/現像液の処理委託契約(マニフェスト)、有機溶剤/特化物の管理者、消防(危険物)'},
   {t:'人・規程：雇用継続・就業規則・36協定・退職金規程・技能の属人化解消'},
   {t:'知財・信用：商標/ロゴ・社名使用、与信・売掛/買掛残の確定'}
 ]}
];

var ST={ proj:'', done:{}, custom:{} };
try{ var sv=JSON.parse(localStorage.getItem(KEY)||'null'); if(sv) ST=Object.assign(ST,sv); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }
function saveProj(){ ST.proj=document.getElementById('proj').value; save(); }

var curTab='all';
function allItems(sec){ return sec.items.concat((ST.custom[sec.id]||[])); }
function keyOf(secId,i){ return secId+'#'+i; }
function secProgress(sec){ var its=allItems(sec); var n=its.length, d=0; for(var i=0;i<n;i++){ if((ST.done[keyOf(sec.id,i)]||{}).on) d++; } return {n:n,d:d}; }

function render(){
  document.getElementById('proj').value=ST.proj||'';
  // タブ
  var tabs='<span class="tab'+(curTab==='all'?' on':'')+'" onclick="setTab(\'all\')">すべて</span>';
  DATA.forEach(function(s){ tabs+='<span class="tab'+(curTab===s.id?' on':'')+'" onclick="setTab(\''+s.id+'\')">'+esc(s.name)+'</span>'; });
  document.getElementById('tabs').innerHTML=tabs;
  // 全体進捗
  var tn=0,td=0; DATA.forEach(function(s){ var p=secProgress(s); tn+=p.n; td+=p.d; });
  var pct=tn?Math.round(td/tn*100):0;
  document.getElementById('prog-all').style.width=pct+'%';
  document.getElementById('pnum-all').textContent=pct+'%（'+td+'/'+tn+'）';
  // リスト
  var hide=document.getElementById('hideDone').checked;
  var secs=DATA.filter(function(s){ return curTab==='all'||curTab===s.id; });
  document.getElementById('list').innerHTML=secs.map(function(s){
    var its=allItems(s); var p=secProgress(s);
    var rows=its.map(function(it,i){
      var k=keyOf(s.id,i), d=ST.done[k]||{};
      if(hide && d.on) return '';
      var isCustom=i>=s.items.length;
      return '<div class="it'+(d.on?' done':'')+'">'
        +'<input type="checkbox" '+(d.on?'checked':'')+' onchange="toggle(\''+s.id+'\','+i+',this.checked)">'
        +'<div class="body"><div class="t">'+esc(it.t)+'</div>'
        +'<div class="meta">'+(it.to?'<span class="badge b-to">提出先：'+esc(it.to)+'</span>':'')+(it.due?'<span class="badge b-due">期限：'+esc(it.due)+'</span>':'')+'</div>'
        +'<div class="sub"><input type="date" value="'+esc(d.date||'')+'" title="完了日" onchange="setDate(\''+s.id+'\','+i+',this.value)">'
        +'<input class="memo" placeholder="メモ（担当・番号など）" value="'+esc(d.memo||'')+'" onchange="setMemo(\''+s.id+'\','+i+',this.value)"></div></div>'
        +(isCustom?'<button class="del" title="削除" onclick="delCustom(\''+s.id+'\','+(i-s.items.length)+')">✕</button>':'')
        +'</div>';
    }).join('');
    return '<div class="sec"><div class="sh"><h2>'+esc(s.name)+'</h2><span class="sp">'+p.d+' / '+p.n+'</span><div class="prog" style="max-width:120px"><i style="width:'+(p.n?Math.round(p.d/p.n*100):0)+'%"></i></div></div>'
      +'<div class="items">'+(rows||'<div class="note" style="padding:10px 14px">（表示する項目がありません）</div>')+'</div>'
      +'<div class="addrow"><input id="ai-'+s.id+'" placeholder="項目を追加" style="flex:1;min-width:160px"><input id="ait-'+s.id+'" placeholder="提出先(任意)" style="width:120px"><input id="aid-'+s.id+'" placeholder="期限(任意)" style="width:120px"><button class="btn pri" onclick="addCustom(\''+s.id+'\')">＋追加</button></div>'
      +'</div>';
  }).join('');
}
function setTab(t){ curTab=t; render(); }
function toggle(sec,i,on){ var k=keyOf(sec,i); var d=ST.done[k]||{}; d.on=on; if(on&&!d.date) d.date=today(); ST.done[k]=d; save(); render(); }
function setDate(sec,i,v){ var k=keyOf(sec,i); var d=ST.done[k]||{}; d.date=v; ST.done[k]=d; save(); }
function setMemo(sec,i,v){ var k=keyOf(sec,i); var d=ST.done[k]||{}; d.memo=v; ST.done[k]=d; save(); }
function addCustom(sec){
  var t=(document.getElementById('ai-'+sec).value||'').trim(); if(!t){ toast('項目名を入力'); return; }
  var to=(document.getElementById('ait-'+sec).value||'').trim(), due=(document.getElementById('aid-'+sec).value||'').trim();
  if(!ST.custom[sec]) ST.custom[sec]=[];
  ST.custom[sec].push({t:t,to:to,due:due}); save(); render();
}
function delCustom(sec,idx){
  if(!ST.custom[sec]) return;
  // 対応するdoneキーを詰め直す（静的項目数 + idx のキーを削除し以降を前へ）
  var base=DATA.filter(function(s){return s.id===sec;})[0].items.length;
  ST.custom[sec].splice(idx,1);
  var nc=ST.custom[sec].length;
  for(var j=idx;j<=nc;j++){ ST.done[sec+'#'+(base+j)]=ST.done[sec+'#'+(base+j+1)]; }
  delete ST.done[sec+'#'+(base+nc+1)];
  save(); render();
}
function resetAll(){ if(!confirm('すべてのチェック・完了日・メモを消します（追加した項目は残ります）。よろしいですか？')) return; ST.done={}; save(); render(); toast('チェックを全解除しました'); }
render();
</script>
</body>
</html>
