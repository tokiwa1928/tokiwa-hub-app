<script>
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function 数(v) { var x = Number(String(v == null ? '' : v).replace(/[,\s]/g, '')); return isNaN(x) ? 0 : x; }
function 円(n) { return '¥' + Math.round(n).toLocaleString(); }
function 和暦(d) { var y = d.getFullYear(), m = d.getMonth() + 1, dd = d.getDate(); return '令和' + (y - 2018) + '年' + m + '月' + dd + '日'; }
function 日付(v) { var m = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(String(v || '').trim()); if (m) return 和暦(new Date(Number(m[3]), Number(m[1]) - 1, Number(m[2]))); var m2 = /^(\d{4})-(\d\d)-(\d\d)$/.exec(String(v || '').trim()); if (m2) return 和暦(new Date(Number(m2[1]), Number(m2[2]) - 1, Number(m2[3]))); return String(v || ''); }
var マスタ = {};
function マスタを用意() {
  var L = '得意先マスタ';
  try { var c = JSON.parse(localStorage.getItem('fm_master_' + L) || 'null'); if (c && c.取った && Date.now() - new Date(c.取った).getTime() < 24 * 3600 * 1000) { マスタ[L] = c; return Promise.resolve(); } } catch (e) {}
  return FM.呼ぶ('マスタ_配る', [L]).then(function (j) { j.取った = new Date().toISOString(); マスタ[L] = j; try { localStorage.setItem('fm_master_' + L, JSON.stringify(j)); } catch (e) {} });
}
function 得意先(code) { var m = マスタ['得意先マスタ']; if (!m) return null; return m.行.filter(function (r) { return String(r['得意先コード']) === String(code); })[0] || null; }
function 列を探す(row, words) { if (!row) return ''; var keys = Object.keys(row); for (var i = 0; i < words.length; i++) { var k = keys.filter(function (x) { return x.indexOf(words[i]) >= 0; })[0]; if (k && row[k]) return String(row[k]); } return ''; }
function 発行者() { var d = { 名: 'トキワ印刷株式会社', 住所: '', TEL: '', FAX: '', 担当: '' }; try { var o = JSON.parse(localStorage.getItem('mitsumori_issuer') || 'null'); if (o) Object.keys(o).forEach(function (k) { d[k] = o[k]; }); } catch (e) {} return d; }
function 発行者を直す() { var d = 発行者(); var 名 = prompt('会社名', d.名); if (名 === null) return; var 住所 = prompt('住所（〒から）', d.住所); if (住所 === null) return; var TEL = prompt('TEL', d.TEL); if (TEL === null) return; var FAX = prompt('FAX', d.FAX); if (FAX === null) return; var 担当 = prompt('担当者名（空なら伝票の担当者）', d.担当); if (担当 === null) return; try { localStorage.setItem('mitsumori_issuer', JSON.stringify({ 名: 名, 住所: 住所, TEL: TEL, FAX: FAX, 担当: 担当 })); } catch (e) {} if (直近) 描く(直近, 直近手配); }
var 直近 = null, 直近手配 = null;
function 仕様の文(f) {
  var parts = [];
  var 紙 = [f['紙質1'], f['メーカー1'], f['品名1']].filter(Boolean).join(' '); if (紙) parts.push(紙);
  if (f['サイズ横'] || f['サイズ縦']) parts.push((f['サイズ横'] || '') + '×' + (f['サイズ縦'] || '') + 'mm');
  var 色 = []; if (f['色数1']) 色.push('表' + f['色数1'] + '色'); if (f['色MAX1']) 色.push('裏' + f['色MAX1'] + '色'); if (色.length) parts.push(色.join('・')); else if (f['インキ表1']) parts.push(f['インキ表1']);
  if (f['製本加工']) parts.push(f['製本加工']);
  if (f['パーツ数'] && Number(f['パーツ数']) > 1) parts.push(f['パーツ数'] + 'パーツ');
  return parts.join('　');
}
// ---- MITSU-MU-1（11/26）: 発行会社の切り替え。村山印刷は Excel「御見積書」（A4 横）と同じ様式で、参考価格（先方売価）の売価を使う
//   将来ほかの関連会社を足すときは 会社表 に 1 行足し、#co の <option> を足す（様式は村山と同じ横型を使う）
var 会社表 = {
  murayama: { 鍵: '村山', 得意先コード: '5236', 名: '村山印刷有限会社', 代表: '代表取締役 本多　亮', 住所: '東京都武蔵村山市残堀2-1-1', TEL: 'TEL(042)560-2431', FAX: 'FAX(042)560-3697', 頭: 'M' }
};
var 直近先方 = null;
function ログイン会社() { try { return String(JSON.parse(localStorage.getItem('murayama_auth') || '{}').companyName || ''); } catch (e) { return ''; } }
function 発行会社(f) {
  var v = $('co').value; if (v) return v;
  var cd = String((f && f['得意先コード']) || '').trim(), nm = ログイン会社(), hit = 'tokiwa';
  Object.keys(会社表).forEach(function (k) { if (会社表[k].得意先コード === cd || (nm && nm.indexOf(会社表[k].鍵) >= 0)) hit = k; });
  return hit;
}
function 先方の売価(key) { var 鍵 = (会社表[key] || {}).鍵; var 行 = ((直近先方 || {}).行 || []).filter(function (x) { return 鍵 && String(x.会社 || '').indexOf(鍵) >= 0; }); 行.sort(function (a, b) { return String(b.更新日 || '') < String(a.更新日 || '') ? -1 : 1; }); return 行[0] || null; }
function 年月日(v) { var s = String(v || '').trim(), m = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s); if (m) return new Date(Number(m[3]), Number(m[1]) - 1, Number(m[2])); m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s); if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])); return null; }
function 二桁(n) { return (n < 10 ? '0' : '') + n; }
function 切捨(n) { return Math.floor(n + 1e-7); }   // 数量×単価の切り捨て（74.6×300 が 22379.999… になるのを避ける）
function 数を出す(n) { return n === '' || n == null || isNaN(n) ? '' : Number(n).toLocaleString('ja-JP', { maximumFractionDigits: 3 }); }
function 横の仕様(f) {
  var p = [];
  var 紙 = f['品名1'] || f['紙質1']; if (紙) p.push(String(紙));
  if (f['サイズ横'] || f['サイズ縦']) p.push((f['サイズ横'] || '') + '*' + (f['サイズ縦'] || ''));
  if (f['色数1'] || f['色MAX1']) p.push((f['色数1'] || 0) + '*' + (f['色MAX1'] || 0));
  if (f['インキ表1']) p.push(String(f['インキ表1']));
  if (f['製本加工']) p.push(String(f['製本加工']));
  return p.join(',');
}
function 控えの鍵(f, key) { return 'mitsumori_mu_' + String(f['見積番号'] || f['伝票番号'] || '') + '_' + key; }
function 控えを読む(f, key) { try { return JSON.parse(localStorage.getItem(控えの鍵(f, key)) || 'null'); } catch (e) { return null; } }
function 横の初め(f, key) {
  var sp = 先方の売価(key);
  var qty = (数(f['合計数1']) || 数(f['ロット契約単位']) || 数(f['数量']));
  var 単価 = sp && sp.単価 !== '' && sp.単価 != null ? 数(sp.単価) : '';
  if (単価 === '' && sp && sp.金額 !== '' && sp.金額 != null && qty) 単価 = Math.round(数(sp.金額) / qty * 100) / 100;
  var 宛 = (String(f['得意先コード'] || '') === 会社表[key].得意先コード ? f['ユーザー名'] : '') || '';
  if (!宛) { var 客 = 得意先(f['得意先コード']); 宛 = (客 && 客['得意先名']) || f['得意先名'] || ''; }
  var d = 年月日(f['起票日']) || new Date();
  return { 宛: String(宛).trim(), 日付: 和暦(d), 日: d.getFullYear() + '-' + 二桁(d.getMonth() + 1) + '-' + 二桁(d.getDate()), 単価あり: 単価 !== '',
    行: [{ 件名: String(f['製品名'] || ''), 仕様: 横の仕様(f), 数量: qty || '', 単位: String(f['単位'] || ''), 単価: 単価, 備考: '' }] };
}
function 横で描く(f, key) {
  var co = 会社表[key], 控 = 控えを読む(f, key), d = 控 || 横の初め(f, key);
  while (d.行.length < 5) d.行.push({ 件名: '', 仕様: '', 数量: '', 単位: '', 単価: '', 備考: '' });
  var 年 = 年月日(d.日) || new Date();
  document.title = co.頭 + 二桁(年.getFullYear() - 2018) + 二桁(年.getMonth() + 1) + 二桁(年.getDate()) + '_' + (d.宛 || '') + '_' + (d.行[0].件名 || '');
  $('kind-label').textContent = '御見積書（' + co.名 + '）';
  var ce = ' contenteditable="true"';
  var h = '<table class="ttl"><tr><td class="h">御見積書</td><td class="d"' + ce + ' data-k="日付">' + esc(d.日付) + '</td></tr></table>';
  h += '<div class="to"><span' + ce + ' data-k="宛">' + esc(d.宛) + '</span> 様</div>';
  h += '<table class="mu"><colgroup><col style="width:2.2%"><col style="width:28.2%"><col style="width:32%"><col style="width:5.9%"><col style="width:3.4%"><col style="width:7.3%"><col style="width:10.4%"><col style="width:10.6%"></colgroup>';
  h += '<thead><tr class="first"><th class="out-l" style="letter-spacing:0;font-size:7pt">No.</th><th>件名</th><th>規格・仕様等</th><th>数量</th><th style="letter-spacing:0">単位</th><th>単価</th><th style="letter-spacing:.1em">税抜金額</th><th class="out-r">備考</th></tr></thead><tbody id="mu-rows">';
  d.行.forEach(function (r, i) {
    h += '<tr class="it' + (i === d.行.length - 1 ? ' last' : '') + '"><td class="n out-l"></td><td' + ce + ' data-k="件名">' + esc(r.件名) + '</td><td' + ce + ' data-k="仕様">' + esc(r.仕様) + '</td><td class="r"' + ce + ' data-k="数量">' + esc(数を出す(r.数量)) + '</td><td class="c"' + ce + ' data-k="単位">' + esc(r.単位) + '</td><td class="r"' + ce + ' data-k="単価">' + esc(数を出す(r.単価)) + '</td><td class="r amt"></td><td class="out-r"' + ce + ' data-k="備考">' + esc(r.備考) + '</td></tr>';
  });
  h += '</tbody><tbody>';
  var 文 = ['毎度有難うございます。上記のとおりお見積りいたします。よろしくご検討ください。', '数量、ｻｲｽﾞ･用紙･頁数等の仕様が変われば金額も変わります｡', 'また、上記金額には校正提出後の訂正･変更による費用は含まれておりません。'];
  h += '<tr class="sum"><td class="memo" colspan="5" rowspan="3"' + ce + '>※&nbsp;' + 文.map(esc).join('<br>&emsp;') + '</td><td class="k out-l">合 計</td><td class="r" id="mu-sum"></td><td class="out-r"></td></tr>';
  h += '<tr class="sum"><td class="k out-l">消 費 税</td><td class="r" id="mu-tax"></td><td class="out-r"></td></tr>';
  h += '<tr class="sum last"><td class="k out-l" style="letter-spacing:0">税込合計</td><td class="r" id="mu-all"></td><td class="out-r"></td></tr>';
  h += '<tr><td class="nb" colspan="5"></td><td class="nb co" colspan="3"' + ce + '>' + esc(co.名) + '</td></tr>';
  h += '<tr><td class="nb" colspan="5"></td><td class="nb rep" colspan="3"' + ce + '>' + esc(co.代表) + '</td></tr>';
  h += '<tr><td class="nb" colspan="5"></td><td class="nb"></td><td class="nb ad" colspan="2" style="font-weight:600"' + ce + '>' + esc(co.住所) + '</td></tr>';
  h += '<tr><td class="nb lim" colspan="5"' + ce + '>見積り有効期限 発行日より１ヶ月限</td><td class="nb"></td><td class="nb ad" colspan="2"' + ce + '>' + esc(co.TEL) + '</td></tr>';
  h += '<tr><td class="nb lim2" colspan="5"' + ce + '>(有効期限後の発注につきましては、お手数ですが再度ご確認下さい。)</td><td class="nb"></td><td class="nb ad" colspan="2"' + ce + '>' + esc(co.FAX) + '</td></tr>';
  h += '</tbody></table>';
  $('paper').innerHTML = h;
