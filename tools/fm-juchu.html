<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>受注入力 | Tokiwa Hub</title>
<style>
  /* FileMakerの受注入力に寄せた「詰まった業務画面」 */
  :root{ --ln:#8a93a6; --ln2:#c3c9d6; --bg:#d9dde6; --pane:#eef0f5;
         --band:#cfd6ea; --band2:#dfe3ee; --ttl:#2b3a55; --focus:#fde68a; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:#111;
        font-family:'Meiryo','Yu Gothic',sans-serif; font-size:12px; }
  .sheet{ width:1180px; margin:6px auto 30px; background:#fff; border:1px solid var(--ln); }
  /* タイトル＋ボタン列（FileMakerのヘッダ帯） */
  .hd{ display:flex; align-items:center; gap:10px; padding:4px 8px; background:var(--pane); border-bottom:1px solid var(--ln); }
  .hd .ttl{ font-size:16px; font-weight:800; letter-spacing:.3em; color:var(--ttl); padding:0 6px; }
  .hd .sp{ margin-left:auto; }
  .fbtn{ font-family:inherit; font-size:11px; font-weight:700; padding:3px 9px; border:1px solid #6b7280;
         border-radius:3px; cursor:pointer; background:linear-gradient(#fff,#e8eaef); color:#1f2937; }
  .fbtn:hover{ background:linear-gradient(#fff,#dfe3ea); }
  .fbtn.b{ background:linear-gradient(#5b7cc4,#3f5fa5); color:#fff; border-color:#2f4a86; }
  .fbtn.g{ background:linear-gradient(#5aa06a,#3d8250); color:#fff; border-color:#2f6b40; }
  .fbtn.r{ background:linear-gradient(#c96a63,#a8443d); color:#fff; border-color:#8d332d; }
  .fbtn.on{ background:linear-gradient(#f6e27a,#e9cf4a); border-color:#a98c1b; }
  /* セクション帯 */
  .sec{ border-top:1px solid var(--ln2); }
  .sec>.cap{ background:var(--band); color:var(--ttl); font-weight:800; font-size:11.5px;
             padding:2px 8px; letter-spacing:.25em; border-bottom:1px solid var(--ln2); }
  .sec>.bd{ padding:4px 6px; }
  /* 行: ラベルは左・小さく */
  .r{ display:flex; flex-wrap:wrap; align-items:center; gap:0 2px; margin:1px 0; }
  .c{ display:flex; align-items:center; }
  .c>label{ font-size:10.5px; color:#31405c; background:var(--band2); border:1px solid var(--ln2);
            border-right:none; padding:2px 5px; white-space:nowrap; line-height:1.5; }
  .c>input,.c>select{ font-family:inherit; font-size:12px; padding:1px 4px; border:1px solid var(--ln2);
            background:#fff; height:21px; }
  .c>input:focus,.c>select:focus{ background:var(--focus); outline:none; }
  .c>input[readonly]{ background:#eef2f7; color:#334155; }
  .w4{ width:44px } .w6{ width:64px } .w8{ width:84px } .w10{ width:106px }
  .w12{ width:128px } .w16{ width:170px } .w20{ width:214px } .w28{ width:300px }
  .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .amtbig{ font-size:14px; font-weight:800; text-align:right; }
  .hint{ font-size:10px; color:#5b6577; margin-left:4px; }
  /* 一覧 */
  .lst{ border:1px solid var(--ln2); max-height:180px; overflow:auto; margin:2px 6px 6px; background:#fff; }
  .lst table{ border-collapse:collapse; width:100%; font-size:11px; }
  .lst th,.lst td{ border:1px solid #dde1e9; padding:1px 5px; white-space:nowrap; }
  .lst th{ background:var(--band2); position:sticky; top:0; }
  .foot{ padding:5px 8px; font-size:10.5px; color:#4b5563; background:var(--pane); border-top:1px solid var(--ln2); line-height:1.7; }
  .grid{ display:grid; gap:5px 10px; }
  .g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  .f{ display:flex; flex-direction:column; }
  .f label{ font-size:10px; color:#475569; }
  .f .hint{ margin:0; }
  #report-box{ display:none; }
  body.v-hub .hub-extra{ display:block; } body.v-fm .hub-extra{ display:none; }
</style>
</head>
<body class="v-fm">
<div class="sheet">

  <div class="hd">
    <span class="ttl">受注入力</span>

  <div class="sec"><div class="cap">受　注</div><div class="bd">

  <div class="sec"><div class="cap">登 録 済 み</div>
    <div class="lst"><table id="tbl"></table></div>
  </div>

  <div class="foot">
    入力欄は<b>過去の実績から選べます</b>（用紙18／インキ19／製本加工11／品名152種）。無い値は打てば次から候補に出ます。

  </div>
</div>

// 印刷機に実在するホットフォルダ（192.168.0.201 実機確認済）
var HOTFOLDERS=['現品票(墨)','現品票(墨緑)','現品票(墨茶)','現品票(墨赤)','現品票(墨青)',
                '現品票(緑)','現品票(緑茶)','現品票(緑赤)','現品票(緑青)',
                '現品票(茶)','現品票(赤)','現品票(赤茶)','現品票(赤青)','現品票(青)'];
function inkFolder(v){
  var s=String(v||'').replace(/[,、　\s]+/g,',').replace(/,+$/,'');
  if(!s) return '';
  if(/見本/.test(s)) return '⚠要確認（色見本あり）';
  var parts=s.split(',').map(function(x){ return x.replace('茶色','茶').replace(/^K$/,'墨').trim(); }).filter(Boolean);
  var uniq=[]; parts.forEach(function(p){ if(uniq.indexOf(p)<0) uniq.push(p); });
  var ORDER=['墨','緑','赤','青','茶'];
  if(/カラー/.test(s)) return '⚠色の指定が必要（「カラー」は旧表記）';
  if(uniq.some(function(p){ return ORDER.indexOf(p)<0; })) return '⚠要確認（'+s+'）';
  uniq.sort(function(a,b){ return ORDER.indexOf(a)-ORDER.indexOf(b); });
  if(!uniq.length) return '';
  var name='現品票('+uniq.slice(0,2).join('')+')';
  return HOTFOLDERS.indexOf(name)>=0 ? name : ('⚠要確認（'+name+' は印刷機にありません）');
}

function fill(sel, arr, blank){
  var el=document.getElementById(sel); if(!el) return;
  el.innerHTML=(blank!==false?'<option value=""></option>':'')
    + (arr||[]).map(function(v){ return '<option>'+String(v).replace(/</g,'&lt;')+'</option>'; }).join('');
}
function fillDL(id, arr){
  var el=document.getElementById(id); if(!el) return;
  el.innerHTML=(arr||[]).map(function(v){ return '<option value="'+String(v).replace(/"/g,'&quot;')+'">'; }).join('');

function g(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
function s(id,v){ var e=document.getElementById(id); if(e) e.value=(v==null?'':v); }

function setView(v){
  document.body.className='v-'+v;
  document.getElementById('sw-fm').classList.toggle('on', v==='fm');
  document.getElementById('sw-hub').classList.toggle('on', v==='hub');
  try{ localStorage.setItem('fm_juchu_view', v); }catch(e){}
}
function calc(){
  var p=parseFloat(g('f-price'))||0;
  var q=parseFloat(g('f-lotset'))||0;
  var a=Math.round(p*q);
  s('f-amt', a?a.toLocaleString():'');
  var _ta=document.getElementById('t-amt'); if(_ta) _ta.textContent=a.toLocaleString();
}

// Hubの取引先マスタを読む
function hubCust(){
  try{
    var db=JSON.parse(localStorage.getItem('murayama_v15')||'null')||{};
    var arr=((db.master||{}).cust)||[];
    var orgs=[], users=[];
    arr.forEach(function(r){
      if(!r||typeof r==='string') return;
      if(r.org && orgs.indexOf(r.org)<0) orgs.push(r.org);
      if(r.user && users.indexOf(r.user)<0) users.push(r.user);
    });
    return { orgs:orgs.sort(), users:users.sort() };
  }catch(e){ return { orgs:[], users:[] }; }
}

function newRec(){
  ['f-denpyo','f-lotno','f-item','f-lotset','f-lotunit','f-zan','f-price','f-amt',
   'f-paper','f-w','f-h','f-bind','f-memo','f-due','f-note','f-hot'].forEach(function(k){ s(k,''); });
  s('f-date', new Date().toISOString().slice(0,10));
  var _t0e=document.getElementById('t-amt'); if(_t0e) _t0e.textContent='0';
  document.getElementById('t-id').textContent='';
  document.getElementById('msg').textContent='';
  document.getElementById('f-cust').focus();
}
function repeatFrom(){
  if(!REC.length){ alert('まだ登録がありません'); return; }
  var last=REC[REC.length-1];
  Object.keys(last.f||{}).forEach(function(k){ s(k, last.f[k]); });
  s('f-denpyo',''); s('f-lotno', last.f['f-denpyo']||'');
  var sel=document.getElementById('f-lotkind'); if(sel) sel.value='リピート';
  calc(); onInk();
  document.getElementById('msg').textContent='前回（'+(last.f['f-denpyo']||'')+'）から複製しました。伝票番号を入れてください。';
}
function saveRec(){
  var cust=g('f-cust'), item=g('f-item');
  if(!cust || !item){ alert('得意先と製品名（品名）は必要です'); return; }
  var f={};
  ['f-denpyo','f-date','f-lotkind','f-lotno','f-cust','f-user','f-item','f-hinshu',
   'f-lotset','f-lotunit','f-zan','f-unit','f-price','f-paper','f-kikaku','f-w','f-h','f-kiri',
   'f-ink','f-iro','f-menu','f-bind','f-mishin','f-memo','f-specchg','f-platechg','f-due','f-note']
   .forEach(function(k){ f[k]=g(k); });
  var qty=parseFloat(f['f-lotset'])||0, pr=parseFloat(f['f-price'])||0;
  var rec={
    savedAt:new Date().toISOString(),
    f:f,
    // Hubの案件形式へのマッピング（そのまま取り込める形）
    hub:{
      id:f['f-denpyo']||('FM-'+Date.now()),
      cust:f['f-cust'], item:f['f-item'],
      spec:[f['f-paper'],f['f-kikaku'],(f['f-w']&&f['f-h'])?(f['f-w']+'×'+f['f-h']):'',
            f['f-ink']?('インキ:'+f['f-ink']):'', f['f-bind']].filter(Boolean).join(' / '),
      qty:qty, unit:f['f-unit']||'枚',
      unitPrice:pr, exTax:Math.round(pr*qty),
      orderDate:f['f-date'], dueDate:f['f-due'],
      end_user:f['f-user'], memo:f['f-note'],
      repeatFrom:f['f-lotno'], hotFolder:inkFolder(f['f-ink']),
      source:'FM風受注入力'
    }
  };
  REC.push(rec);
  try{ localStorage.setItem(KEY, JSON.stringify(REC)); }catch(e){ alert('保存に失敗: '+e.message); }
  document.getElementById('t-id').textContent='登録: '+rec.hub.id;
  try{ logSave(rec); }catch(e){}
  document.getElementById('msg').textContent='✅ 登録しました（'+REC.length+'件目）';
  renderList();
}
function renderList(){
  var h='<thead><tr><th>伝票番号</th><th>得意先</th><th>製品名</th><th>数量</th><th>単価</th><th>金額</th><th>ホットフォルダ</th></tr></thead><tbody>';
  if(!REC.length){ document.getElementById('tbl').innerHTML=h+'<tr><td colspan="7" style="padding:14px;color:#94a3b8">まだありません</td></tr></tbody>'; return; }
  REC.slice().reverse().forEach(function(r){
    var b=r.hub||{};
    h+='<tr><td>'+(b.id||'')+'</td><td>'+(b.cust||'')+'</td><td>'+(b.item||'')+'</td>'
      +'<td style="text-align:right">'+(b.qty||'')+'</td><td style="text-align:right">'+(b.unitPrice||'')+'</td>'
      +'<td style="text-align:right">'+((b.exTax||0).toLocaleString())+'</td>'
      +'<td style="color:#0e7c86;font-weight:700">'+(b.hotFolder||'')+'</td></tr>';
  });
  document.getElementById('tbl').innerHTML=h+'</tbody>';
}
function onInk(){ s('f-hot', inkFolder(g('f-ink'))); }

/* ===== 使われ方の記録 =====
   目的: どの項目が実際に使われているかを知り、使わない項目を削る・選択肢を直すため。
   ※ 氏名・端末名は一切記録しない（人を評価するためのものではない） */
var LOGKEY='fm_juchu_log_v1';
var LOG=[]; var _t0=Date.now(); var _edits={};
var FIELDLABEL={'f-denpyo':'伝票番号','f-date':'起票日','f-lotkind':'ロット区分','f-lotno':'ロットNO',
 'f-cust':'得意先','f-user':'ユーザー','f-item':'製品名','f-hinshu':'品種','f-lotset':'ロットセット数',
 'f-lotunit':'ロット契約単位','f-zan':'注残数','f-unit':'単位','f-price':'売価単価','f-paper':'紙質',
 'f-kikaku':'規格','f-w':'サイズ横','f-h':'サイズ縦','f-kiri':'切数','f-ink':'インキ','f-iro':'色数',
 'f-menu':'面付','f-bind':'製本加工','f-mishin':'横ミシン','f-memo':'備考','f-specchg':'仕様変更',
 'f-platechg':'版下変更','f-due':'希望納期','f-note':'社内メモ'};
function _logFields(){ return Object.keys(FIELDLABEL); }
function trackEdits(){
  _logFields().forEach(function(k){
    var el=document.getElementById(k); if(!el||el._tracked) return;
    el._tracked=true;
    el.addEventListener('change', function(){ _edits[k]=(_edits[k]||0)+1; });
  });
}
function logSave(rec){
  var filled={}, vals={};
  _logFields().forEach(function(k){
    var v=g(k); filled[k]=v?1:0;
    if(v && ['f-lotkind','f-hinshu','f-unit','f-kikaku','f-kiri','f-ink','f-iro','f-menu','f-mishin','f-specchg','f-platechg'].indexOf(k)>=0) vals[k]=v;
  });
  LOG.push({ t:new Date().toISOString().slice(0,16), view:(document.body.className==='v-hub'?'Hub風':'FM風'),
             secs:Math.round((Date.now()-_t0)/1000), filled:filled, vals:vals, edits:_edits,
             repeat:(g('f-lotkind')==='リピート')?1:0 });
  if(LOG.length>2000) LOG=LOG.slice(-2000);
  try{ localStorage.setItem(LOGKEY, JSON.stringify(LOG)); }catch(e){}
  _t0=Date.now(); _edits={};
}
function showReport(){
  var box=document.getElementById('report-box'); box.style.display='block';
  var n=LOG.length;
  if(!n){ document.getElementById('report-body').innerHTML='<div style="padding:14px;color:#94a3b8">まだ記録がありません。何件か登録すると出ます。</div>'; return; }
  var use={}, ed={}, valc={};
  _logFields().forEach(function(k){ use[k]=0; ed[k]=0; });
  var fm=0, hub=0, rep=0, secs=0;
  LOG.forEach(function(r){
    _logFields().forEach(function(k){ use[k]+=(r.filled&&r.filled[k])?1:0; ed[k]+=(r.edits&&r.edits[k])||0; });
    if(r.view==='Hub風') hub++; else fm++;
    rep+=r.repeat||0; secs+=r.secs||0;
    Object.keys(r.vals||{}).forEach(function(k){ valc[k]=valc[k]||{}; valc[k][r.vals[k]]=(valc[k][r.vals[k]]||0)+1; });
  });
  var rows=_logFields().map(function(k){ return {k:k, l:FIELDLABEL[k], u:Math.round(use[k]*100/n), e:ed[k]}; });
  var never=rows.filter(function(r){ return r.u===0; });
  var often=rows.filter(function(r){ return r.e>=Math.max(2,n*0.3); });
  var h='<div class="grid g4" style="margin-bottom:10px">'
    +'<div class="f"><label>登録件数</label><b style="font-size:17px">'+n+'</b></div>'
    +'<div class="f"><label>1件あたり平均</label><b style="font-size:17px">'+Math.round(secs/n)+'秒</b></div>'
    +'<div class="f"><label>リピートの割合</label><b style="font-size:17px">'+Math.round(rep*100/n)+'%</b></div>'
    +'<div class="f"><label>Hub風を使った割合</label><b style="font-size:17px">'+Math.round(hub*100/n)+'%</b>'
    +'<span class="hint">FM風 '+fm+'件 / Hub風 '+hub+'件</span></div></div>';
  if(never.length){
    h+='<div style="background:#fff7ed;border:1px solid #fdba74;border-radius:6px;padding:8px 11px;margin-bottom:8px">'
      +'<b>一度も使われていない項目（'+never.length+'）</b> → 削れる可能性があります<br>'
      +'<span style="color:#9a3412">'+never.map(function(r){ return r.l; }).join('、')+'</span></div>';
  }
  if(often.length){
    h+='<div style="background:#eff6ff;border:1px solid #93c5fd;border-radius:6px;padding:8px 11px;margin-bottom:8px">'
      +'<b>何度も直している項目</b> → 選択肢が実態に合っていないかも<br>'
      +'<span style="color:#1e40af">'+often.map(function(r){ return r.l+'('+r.e+'回)'; }).join('、')+'</span></div>';
  }
  h+='<div class="savedlist"><table><thead><tr><th>項目</th><th>使用率</th><th>修正回数</th><th>よく選ばれる値</th></tr></thead><tbody>';
  rows.sort(function(a,b){ return a.u-b.u; }).forEach(function(r){
    var vv=valc[r.k]?Object.keys(valc[r.k]).sort(function(a,b){ return valc[r.k][b]-valc[r.k][a]; }).slice(0,3)
              .map(function(v){ return v+'('+valc[r.k][v]+')'; }).join('、'):'';
    h+='<tr'+(r.u===0?' style="background:#fff7ed"':'')+'><td>'+r.l+'</td><td style="text-align:right">'+r.u+'%</td>'
      +'<td style="text-align:right">'+r.e+'</td><td style="color:#475569">'+vv+'</td></tr>';
  });
  document.getElementById('report-body').innerHTML=h+'</tbody></table></div>';
  try{ box.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){}
}
function exportReport(){
  if(!LOG.length){ alert('記録がありません'); return; }
  var n=LOG.length, use={}, ed={};
  _logFields().forEach(function(k){ use[k]=0; ed[k]=0; });
  LOG.forEach(function(r){ _logFields().forEach(function(k){
    use[k]+=(r.filled&&r.filled[k])?1:0; ed[k]+=(r.edits&&r.edits[k])||0; }); });
  var L=['項目,使用率(%),修正回数,登録件数'];
  _logFields().forEach(function(k){ L.push([FIELDLABEL[k],Math.round(use[k]*100/n),ed[k],n].join(',')); });
  var blob=new Blob([String.fromCharCode(0xFEFF)+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='使われ方レポート_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}
function clearLog(){
  if(!confirm('使われ方の記録を消します（登録した案件は消えません）。よろしいですか？')) return;
  LOG=[]; try{ localStorage.removeItem(LOGKEY); }catch(e){}
  showReport();
}
