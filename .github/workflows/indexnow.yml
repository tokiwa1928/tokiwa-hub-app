# NOINDEX-2: Bing（IndexNow）に「このページたちを読み直して」と知らせる。
#   ページには noindex が入っているので、読み直されると検索結果から外れる。Actions → IndexNow → Run workflow
name: IndexNow
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 送る
        run: |
          KEY=79c33160507e8ea3c1a10978fa161ca2
          BASE=https://tokiwa1928.github.io/tokiwa-hub-app
          URLS=$( { echo index.html; echo ""; find tools docs brand -name '*.html' 2>/dev/null; ls *.html; } | sort -u | sed "s#^#$BASE/#" | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          BODY=$(python3 -c "import json,sys;print(json.dumps({'host':'tokiwa1928.github.io','key':'$KEY','keyLocation':'$BASE/$KEY.txt','urlList':json.loads(sys.argv[1])}))" "$URLS")
          echo "$BODY" | head -c 600; echo
          for EP in https://api.indexnow.org/indexnow https://www.bing.com/indexnow; do
            echo "== $EP"; curl -sS -w "\nHTTP %{http_code}\n" -X POST "$EP" -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
          done
