# 速い中継（tools/fm-fast）を Cloudflare Workers へ配る。
#   main に tools/fm-fast/ の変更が入ったら自動。手で動かすときは Actions → 「速い中継を Cloudflare へ配る」→ Run workflow。
#
#   要る secret（このリポジトリの Settings → Secrets and variables → Actions）
#     CLOUDFLARE_API_TOKEN   Cloudflare の API トークン（権限: Workers Scripts 編集）
#     CLOUDFLARE_ACCOUNT_ID  Cloudflare のアカウント ID（ダッシュボード右下か Workers の画面）
#     FM_REFRESH_TOKEN       Claris ID の更新トークン（Apps Script のスクリプトプロパティと同じ値）
name: 速い中継を Cloudflare へ配る

on:
  push:
    branches: [main]
    paths:
      - 'tools/fm-fast/**'
      - '.github/workflows/fast-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 鍵の確認
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FM_REFRESH_TOKEN: ${{ secrets.FM_REFRESH_TOKEN }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN がありません"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID がありません"; exit 1; }
          [ -n "$FM_REFRESH_TOKEN" ] || { echo "::error::secret FM_REFRESH_TOKEN がありません"; exit 1; }
      - name: 配る（wrangler deploy）
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/fm-fast
          command: deploy
      - name: FileMaker の更新トークンを置く
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/fm-fast
          command: secret put FM_REFRESH_TOKEN
          secrets: |
            FM_REFRESH_TOKEN
        env:
          FM_REFRESH_TOKEN: ${{ secrets.FM_REFRESH_TOKEN }}
      - name: 住所を出す
        run: echo "::notice::Workers の住所は Cloudflare → Workers & Pages → tokiwa-fm-fast に出ます（https://tokiwa-fm-fast.<サブドメイン>.workers.dev）"
