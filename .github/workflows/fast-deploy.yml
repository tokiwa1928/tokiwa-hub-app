# 速い中継（tools/fm-fast）を Cloudflare Workers へ配る。
#   main に tools/fm-fast/ の変更が入ったら自動。手で動かすときは Actions → 「速い中継を Cloudflare へ配る」→ Run workflow。
#
#   要る secret（このリポジトリの Settings → Secrets and variables → Actions）
#     CLOUDFLARE_API_TOKEN   Cloudflare の API トークン（権限: Workers Scripts 編集）
#     CLOUDFLARE_ACCOUNT_ID  Cloudflare のアカウント ID（ダッシュボード右下か Workers の画面）
#     FM_REFRESH_TOKEN       Claris ID の更新トークン（Apps Script のスクリプトプロパティと同じ値）
name: 速い中継を Cloudflare へ配る

on:
  push:
    branches: [main]
    paths:
      - 'tools/fm-fast/**'
      - '.github/workflows/fast-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 鍵の確認
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FM_REFRESH_TOKEN: ${{ secrets.FM_REFRESH_TOKEN }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN がありません"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID がありません"; exit 1; }
          [ -n "$FM_REFRESH_TOKEN" ] || { echo "::error::secret FM_REFRESH_TOKEN がありません"; exit 1; }
      - name: workers.dev のサブドメインを用意（無ければ tokiwa-hub で登録）
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain"
          SUB=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "$API" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')")
          if [ -z "$SUB" ]; then
            for name in tokiwa-hub tokiwa-hub-fm tokiwap; do
              R=$(curl -s -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$API" -d "{\"subdomain\":\"$name\"}")
              if echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('success') else 1)"; then SUB=$name; break; fi
              echo "$name は使えませんでした: $(echo "$R" | head -c 300)"
            done
          fi
          [ -n "$SUB" ] || { echo "::error::workers.dev のサブドメインを登録できませんでした"; exit 1; }
          echo "subdomain=$SUB" >> $GITHUB_ENV
          echo "::notice::速い中継の住所: https://tokiwa-fm-fast.$SUB.workers.dev"
      - name: 配る（wrangler deploy）
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/fm-fast
          command: deploy
      - name: FileMaker の更新トークンを置く
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/fm-fast
          command: secret put FM_REFRESH_TOKEN
          secrets: |
            FM_REFRESH_TOKEN
        env:
          FM_REFRESH_TOKEN: ${{ secrets.FM_REFRESH_TOKEN }}
      - name: 住所を出す
        run: |
          echo "::notice::速い中継の住所: https://tokiwa-fm-fast.${subdomain}.workers.dev"
          curl -s --max-time 20 "https://tokiwa-fm-fast.${subdomain}.workers.dev/" | head -c 300 || true
