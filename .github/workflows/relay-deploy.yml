# 中継（tools/fm-relay）を Apps Script へ配る。
#   main に tools/fm-relay/ の変更が入ったら clasp push → 既存の Web アプリ配備を新しい版に差し替える。
#   手で動かすときは Actions → 「中継を Apps Script へ配る」→ Run workflow。
#
#   要る secret（リポジトリの Settings → Secrets and variables → Actions）
#     CLASPRC_JSON_B64   自分の PC の ~/.clasprc.json を base64 にしたもの（clasp login 済みの PC で作る）
#     RELAY_SCRIPT_ID    中継の Apps Script のスクリプト ID（tools/fm-relay/.clasp.json の scriptId）
#     RELAY_DEPLOY_ID    Web アプリの配備 ID（URL の /macros/s/ と /exec の間。無ければ push だけ）
name: 中継を Apps Script へ配る

on:
  push:
    branches: [main]
    paths:
      - 'tools/fm-relay/**'
      - '.github/workflows/relay-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @google/clasp@latest
      - run: clasp --version

      - name: 鍵を置く
        run: |
          if [ -z "${{ secrets.CLASPRC_JSON_B64 }}" ]; then echo "::error::secret CLASPRC_JSON_B64 がありません"; exit 1; fi
          if [ -z "${{ secrets.RELAY_SCRIPT_ID }}" ]; then echo "::error::secret RELAY_SCRIPT_ID がありません"; exit 1; fi
          echo "${{ secrets.CLASPRC_JSON_B64 }}" | base64 -d > ~/.clasprc.json
          python3 -c "import json; d=json.load(open('$HOME/.clasprc.json')); print('clasprc keys:', list(d.keys()))"
          cat > tools/fm-relay/.clasp.json <<EOT
          {"scriptId":"${{ secrets.RELAY_SCRIPT_ID }}","rootDir":"."}
          EOT

      - name: 戻せるように版を残す
        working-directory: tools/fm-relay
        run: clasp version "GitHub 配る前の控え ${GITHUB_SHA:0:7}" || echo "::warning::控えの版を作れませんでした（続けます）"

      - name: clasp push
        working-directory: tools/fm-relay
        run: clasp push -f

      - name: Web アプリを新しい版にする
        if: ${{ secrets.RELAY_DEPLOY_ID != '' }}
        working-directory: tools/fm-relay
        run: |
          clasp deploy -i "${{ secrets.RELAY_DEPLOY_ID }}" -d "GitHub ${GITHUB_SHA:0:7} $(git log -1 --pretty=%s | cut -c1-60)"
          echo "✅ 配備 ${{ secrets.RELAY_DEPLOY_ID }} を新しい版にしました"

      - name: 配備 ID が無いとき
        if: ${{ secrets.RELAY_DEPLOY_ID == '' }}
        run: echo "::warning::RELAY_DEPLOY_ID が無いので push だけしました。Web アプリは Apps Script の「デプロイを管理」で新しい版にしてください"
